  // ================= Evolução mês a mês =================
  // Patrimônio (contas + investimentos): guarda um retrato por mês quando o app é aberto
  function snapshot() {
    if (!state.accounts.length && !state.investments.length) return;
    const val = state.accounts.reduce((s, a) => s + accBalance(a), 0) + state.investments.reduce((s, i) => s + estimate(i), 0);
    state.snapshots ||= {};
    if (state.snapshots[curKey()] !== val) { state.snapshots[curKey()] = val; save(true); }
  }
  const shortMonth = key => new Date(+key.slice(0, 4), +key.slice(5) - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  // Valores redondos para o eixo (0 / 1.000 / 2.000…)
  // passo "redondo" (1, 2, 2,5 ou 5 × 10ⁿ) para ~4 linhas, e o topo no primeiro múltiplo acima do maior valor
  function niceScale(v) {
    if (v <= 0) return { max: 100000, step: 25000 };
    const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
    return { max: Math.ceil(v / step) * step, step };
  }
  const compact = c => { const v = c / 100; return v >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : v >= 1e3 ? (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : v.toLocaleString('pt-BR', { maximumFractionDigits: 0 }); };

  function renderEvo() {
    snapshot();
    const n = ui.evoRange || 6;
    const end = view.month > curKey() ? view.month : curKey();
    const months = Array.from({ length: n }, (_, i) => addMonths(end, i - n + 1));
    const data = months.map(k => { const t = totals(k); return { k, receita: t.receita, despesas: t.despesas, saldo: t.receita - t.despesas }; });
    const box = $('#evo');
    if (!data.some(d => d.receita || d.despesas)) { box.hidden = true; return; }
    box.hidden = false;
    const table = ui.evoTable;
    box.innerHTML = `<div class="evo-head"><h2>Evolução</h2>
      <div class="evo-ctl"><div class="pills" id="evoRange">${[6, 12].map(x => `<button type="button" data-n="${x}" class="${x === n ? 'on' : ''}">${x} meses</button>`).join('')}</div>
        <button class="btn-soft" id="evoTableBtn" type="button">${table ? 'Ver gráfico' : 'Ver tabela'}</button></div></div>
      <div class="evo-body"><div>${table ? evoTable(data) : `<div class="evo-legend"><span><i style="background:var(--green)"></i>Receita</span><span><i style="background:var(--red)"></i>Despesas</span></div><div class="evo-chart" id="evoChart"></div>`}</div>
        <div class="insights">${insights()}</div></div>`;
    if (!table) drawEvoChart(data);
    box.querySelector('#evoRange').onclick = e => { const b = e.target.closest('[data-n]'); if (b) { ui.evoRange = +b.dataset.n; saveUi(); renderEvo(); } };
    box.querySelector('#evoTableBtn').onclick = () => { ui.evoTable = !ui.evoTable; saveUi(); renderEvo(); };
  }

  function evoTable(data) {
    return `<table class="evo-table"><thead><tr><th>Mês</th><th>Receita</th><th>Despesas</th><th>Sobra</th></tr></thead><tbody>${data.map(d =>
      `<tr><td>${monthLabel(d.k)}</td><td>${money(d.receita)}</td><td>${money(d.despesas)}</td><td style="color:${d.saldo < 0 ? 'var(--red)' : 'inherit'}">${d.saldo < 0 && !ui.hidden ? '–' : ''}${money(Math.abs(d.saldo))}</td></tr>`).join('')}</tbody></table>`;
  }

  function drawEvoChart(data) {
    const wrap = $('#evoChart');
    const W = Math.max(wrap.clientWidth, 280), H = 220, padL = 44, padB = 26, padT = 8;
    const plotW = W - padL, plotH = H - padB - padT;
    const { max, step } = niceScale(Math.max(...data.map(d => Math.max(d.receita, d.despesas))));
    const y = v => padT + plotH - v / max * plotH;
    const slot = plotW / data.length;
    const bw = Math.min(24, Math.max(6, (slot - 14) / 2));       // colunas finas, no máximo 24px
    const ticks = Array.from({ length: Math.round(max / step) + 1 }, (_, i) => i * step);
    const bar = (x, v, color) => {
      if (!v) return '';
      const top = y(v), h = padT + plotH - top, r = Math.min(4, h, bw / 2);
      // topo arredondado 4px, base reta
      return `<path d="M${x},${padT + plotH} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${padT + plotH} Z" fill="${color}"/>`;
    };
    const svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Receita e despesas por mês">
      ${ticks.map(t => `<line class="grid-line" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${padL - 8}" y="${y(t) + 3.5}" text-anchor="end">${ui.hidden ? '•' : compact(t)}</text>`).join('')}
      ${data.map((d, i) => {
        const cx = padL + slot * i + slot / 2, x1 = cx - bw - 1, x2 = cx + 1;   // 2px entre as colunas
        return `<g class="m" tabindex="0" data-i="${i}" aria-label="${monthLabel(d.k)}: receita ${brl.format(d.receita / 100)}, despesas ${brl.format(d.despesas / 100)}">
          <rect class="band" x="${padL + slot * i + 2}" y="${padT}" width="${slot - 4}" height="${plotH}" rx="6"/>
          ${bar(x1, d.receita, 'var(--green)')}${bar(x2, d.despesas, 'var(--red)')}
          <text class="xl ${d.k === view.month ? 'cur' : ''}" x="${cx}" y="${H - 8}" text-anchor="middle">${shortMonth(d.k)}</text>
          <rect class="hit" x="${padL + slot * i}" y="0" width="${slot}" height="${H}"/></g>`;
      }).join('')}</svg><div class="evo-tip" id="evoTip"></div>`;
    wrap.innerHTML = svg;
    const tip = wrap.querySelector('#evoTip');
    const show = g => {
      const d = data[+g.dataset.i];
      tip.innerHTML = `<div class="tt">${monthLabel(d.k)}</div>
        <div class="r"><span><i style="background:var(--green)"></i>Receita</span><b>${money(d.receita)}</b></div>
        <div class="r"><span><i style="background:var(--red)"></i>Despesas</span><b>${money(d.despesas)}</b></div>
        <div class="r"><span>Sobra</span><b style="color:${d.saldo < 0 ? 'var(--red)' : 'inherit'}">${d.saldo < 0 && !ui.hidden ? '–' : ''}${money(Math.abs(d.saldo))}</b></div>`;
      // abre ao lado da coluna (à esquerda se couber, senão à direita), sem cobrir o mês que você está olhando
      const i = +g.dataset.i, k = wrap.clientWidth / W, slotL = (padL + slot * i) * k, slotR = slotL + slot * k;
      tip.classList.add('on');
      const tw = tip.offsetWidth;
      tip.style.left = (slotL - tw - 6 >= 0 ? slotL - tw - 6 : Math.min(slotR + 6, wrap.clientWidth - tw)) + 'px';
      tip.style.top = '4px';
    };
    // toque: 1º toque mostra os valores do mês, 2º toque no mesmo mês abre ele (no mouse, clique abre direto)
    let touchShown = null, lastType = 'mouse';
    wrap.querySelectorAll('g.m').forEach(g => {
      g.addEventListener('pointerdown', ev => { lastType = ev.pointerType; });
      g.addEventListener('pointerenter', ev => { if (ev.pointerType !== 'touch') show(g); });
      g.addEventListener('focus', () => show(g));
      g.addEventListener('pointerleave', ev => { if (ev.pointerType !== 'touch') tip.classList.remove('on'); });
      g.addEventListener('blur', () => tip.classList.remove('on'));
      g.addEventListener('click', () => {
        if (lastType === 'touch' && touchShown !== g) { touchShown = g; show(g); return; }
        view.month = data[+g.dataset.i].k; render();
      });
      g.addEventListener('keydown', e => { if (e.key === 'Enter') { view.month = data[+g.dataset.i].k; render(); } });
    });
  }

  // Comparações automáticas do mês visto com o anterior
  function insights() {
    const k = view.month, prev = addMonths(k, -1);
    const t = totals(k), tp = totals(prev);
    const out = [];
    const pctTxt = (a, b) => b ? Math.round((a - b) / b * 100) : null;
    const dp = pctTxt(t.despesas, tp.despesas);
    if (t.despesas && dp !== null) out.push(['📊', dp > 0 ? `Você gastou <b>${dp}% a mais</b> que em ${shortMonth(prev)}` : dp < 0 ? `Você gastou <b>${-dp}% a menos</b> que em ${shortMonth(prev)}` : `Gastos iguais a ${shortMonth(prev)}`, `${money(t.despesas)} contra ${money(tp.despesas)}`]);
    // categorias que mais mudaram
    const byCat = key => { const m = new Map(); variaveisOf(key).forEach(v => m.set(v.category, (m.get(v.category) || 0) + v.amount)); return m; };
    const a = byCat(k), b = byCat(prev);
    const changes = [...new Set([...a.keys(), ...b.keys()])].map(id => ({ id, now: a.get(id) || 0, before: b.get(id) || 0 }))
      .map(c => ({ ...c, diff: c.now - c.before })).filter(c => c.before && Math.abs(c.diff) >= 1000).sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff)).slice(0, 2);
    changes.forEach(c => {
      const name = cat(c.id)?.name || 'Sem categoria', p = Math.round(c.diff / c.before * 100);
      out.push([c.diff > 0 ? '↑' : '↓', `<b>${esc(name)}</b> ${c.diff > 0 ? 'subiu' : 'caiu'} ${Math.abs(p)}%`, `${money(c.now)} contra ${money(c.before)} em ${shortMonth(prev)}`]);
    });
    // Mês atual: quanto dá pra gastar por dia até o fim do mês com o que sobra (receita − investir − despesas já previstas)
    if (k === curKey() && t.receita) {
      const daysLeft = daysIn(k) - today.getDate() + 1;
      out.push(t.saldo > 0 ? ['📅', `Dá para gastar <b>${money(Math.floor(t.saldo / daysLeft))}</b> por dia`, `até o fim do mês (${daysLeft} dia${daysLeft > 1 ? 's' : ''}), mantendo o que você separou pra investir`]
        : ['⛔', `O mês já está <b>${money(-t.saldo)}</b> no vermelho`, 'Contando o que você separou pra investir']);
    }
    const avg = avgExpenses();
    if (avg) out.push(['🧮', `Média de despesas: <b>${money(avg)}</b>/mês`, 'Últimos 3 meses com lançamentos']);
    if (t.receita) {
      const rate = Math.round((t.receita - t.despesas) / t.receita * 100);
      out.push([rate >= 20 ? '🌱' : rate >= 0 ? '🙂' : '⚠️', rate >= 0 ? `Sobrou <b>${rate}%</b> da receita neste mês` : `Gastou <b>${-rate}%</b> além da receita`, rate >= 20 ? 'Ótimo ritmo pra investir' : rate >= 0 ? 'Tente chegar em 20%' : 'Vale rever as maiores categorias']);
    }
    const snaps = Object.entries(state.snapshots || {}).sort(([x], [y]) => x.localeCompare(y));
    if (snaps.length) {
      const [firstK, firstV] = snaps[0], [, lastV] = snaps[snaps.length - 1], d = lastV - firstV;
      out.push(['🏦', `Patrimônio: <b>${money(lastV)}</b>`, snaps.length > 1 ? `${d >= 0 ? '+' : '–'}${money(Math.abs(d))} desde ${monthLabel(firstK)} (contas + investimentos)` : 'Contas + investimentos. A evolução aparece nos próximos meses.']);
    }
    return out.length ? out.map(([ic, h, sub]) => `<div class="ins"><span class="ic" aria-hidden="true">${ic}</span><div>${h}<small>${sub}</small></div></div>`).join('')
      : `<div class="ins"><span class="ic">💡</span><div>Lance receitas e despesas por alguns meses pra ver as comparações aqui.</div></div>`;
  }
  let evoResize;
  window.addEventListener('resize', () => { clearTimeout(evoResize); evoResize = setTimeout(withMemo(renderEvo), 150); });

  // ================= Limite por categoria =================
  const spentIn = (catId, key) => variaveisOf(key).filter(v => v.category === catId).reduce((s, v) => s + v.amount, 0);
  // Estado do limite: ok (<80%), warn (80–100%), over (passou)
  function limitsOf(key) {
    return catsOf('despesa').filter(c => c.limit > 0).map(c => {
      const spent = spentIn(c.id, key), pct = spent / c.limit;
      return { ...c, spent, pct, state: pct > 1 ? 'over' : pct >= 0.8 ? 'warn' : 'ok' };
    }).sort((a, b) => b.pct - a.pct);
  }
  function limitsHtml(key) {
    const list = limitsOf(key);
    if (!list.length) return '';
    const txt = { ok: '', warn: '⚠️ ', over: '⛔ ' };
    return `<div class="limits"><div class="limits-h">Limites do mês</div>${list.map(l => `
      <div class="limit" title="${esc(l.name)}: ${brl.format(l.spent / 100)} de ${brl.format(l.limit / 100)}">
        <div class="limit-top"><span><span class="ldot" style="background:${l.color}"></span>${esc(l.name)}</span>
          <span class="num">${txt[l.state]}${money(l.spent)} <small>de ${money(l.limit)}</small></span></div>
        <div class="meter ${l.state === 'ok' ? '' : l.state}" role="progressbar" aria-valuenow="${Math.round(l.pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(l.name)}"><i style="width:${Math.min(l.pct, 1) * 100}%"></i></div>
        <div class="limit-sub">${l.state === 'over' ? `Passou ${money(l.spent - l.limit)} do limite` : `Ainda cabe ${money(l.limit - l.spent)} · ${Math.round(l.pct * 100)}%`}</div>
      </div>`).join('')}</div>`;
  }

  // ================= Metas =================
  const GOAL_EMOJI = ['🎯', '🛟', '🏖️', '✈️', '🚗', '🏠', '🎓', '💍', '💻', '🎮', '👶', '🐶'];
  const monthsBetween = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5) - +a.slice(5));
  const goalSaved = g => g.investments && g.investments.length
    ? state.investments.filter(i => g.investments.includes(i.id)).reduce((s, i) => s + estimate(i), 0)
    : (g.saved || 0);
  function goalInfo(g) {
    const saved = goalSaved(g), left = Math.max(g.target - saved, 0);
    const months = g.deadline ? monthsBetween(curKey(), g.deadline) + 1 : 0;
    const done = saved >= g.target;
    const late = !done && g.deadline && g.deadline < curKey();
    return { saved, left, pct: g.target ? Math.min(saved / g.target, 1) : 0, done, late, perMonth: !done && months > 0 ? Math.ceil(left / months) : 0, months };
  }
  // Média das despesas dos últimos 3 meses com movimento (para a reserva de emergência)
  function avgExpenses() {
    const vals = [1, 2, 3].map(n => totals(addMonths(curKey(), -n)).despesas).filter(v => v > 0);
    if (!vals.length) { const now = totals(curKey()).despesas; return now; }
    return Math.round(vals.reduce((s, v) => s + v, 0) / vals.length);
  }
  const monthLabel = key => { const l = new Date(+key.slice(0, 4), +key.slice(5) - 1, 1).toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }); return l.replace('.', '').replace(' de ', '/'); };

  function renderMetasTable() {
    $('#tableTitle').textContent = 'Metas';
    const q = view.query.trim().toLowerCase();
    const rows = state.metas.filter(g => !q || g.name.toLowerCase().includes(q));
    if (!rows.length) {
      $('#table').innerHTML = `<div class="empty">${q ? 'Nada encontrado com esse filtro.' : 'Nenhuma meta ainda.<br>Viagem, carro novo, reserva de emergência…'}${q ? '' : `<br><button class="btn-soft" data-add>${ico('plus')}Criar meta</button>`}</div>`;
      return;
    }
    $('#table').innerHTML = rows.map(g => {
      const i = goalInfo(g);
      const cls = i.done ? '' : i.late ? 'over' : 'info';
      const status = i.done ? '✓ Meta alcançada' : i.late ? `Prazo passou (${monthLabel(g.deadline)})` : i.perMonth ? `Guardar <b>${money(i.perMonth)}</b>/mês até ${monthLabel(g.deadline)}` : 'Sem prazo';
      return `<div class="row goal">
        <span class="date"><span class="goal-emoji">${g.emoji || '🎯'}</span></span>
        <div class="name"><span>${esc(g.name)}${g.investments && g.investments.length ? `<small>ligada aos investimentos</small>` : ''}</span>
          <div class="meter ${cls}" role="progressbar" aria-valuenow="${Math.round(i.pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso da meta"><i style="width:${i.pct * 100}%"></i></div>
          <div class="goal-meta"><span>${Math.round(i.pct * 100)}% · ${status}</span>${!i.done && !(g.investments && g.investments.length) ? `<button type="button" class="link" data-goaladd="${g.id}" style="white-space:nowrap;flex:none">+ Guardar</button>` : ''}</div></div>
        <span class="val num">${money(i.saved)}<small style="display:block;color:var(--muted);font-weight:500">de ${money(g.target)}</small></span>
        <button class="edit" data-edit="${g.id}" aria-label="Editar meta">${ico('pencil', 'width:14px;height:14px')}</button>
      </div>`;
    }).join('');
  }

  function renderMetasChart() {
    if (!state.metas.length) { $('#chart').innerHTML = `<div class="chart-empty">${ico('pie')}<span>O resumo das suas metas aparece aqui</span></div>`; return; }
    const infos = state.metas.map(goalInfo);
    const saved = infos.reduce((s, i) => s + i.saved, 0), target = state.metas.reduce((s, g) => s + g.target, 0);
    const perMonth = infos.reduce((s, i) => s + i.perMonth, 0);
    const t = totals(curKey());
    $('#chart').innerHTML = `<div class="stat-hero"><small>Guardado para as metas</small><strong>${money(saved)}</strong><small>de ${money(target)} · ${target ? Math.round(saved / target * 100) : 0}%</small></div>
      <div class="meter info" style="height:10px"><i style="width:${target ? Math.min(saved / target, 1) * 100 : 0}%"></i></div>
      <div class="stat-rows">
        <div><span>Pra cumprir os prazos</span><b class="num">${money(perMonth)}/mês</b></div>
        <div><span>Você reserva pra investir</span><b class="num">${money(t.investir)}/mês</b></div>
        <div><span>Metas concluídas</span><b>${infos.filter(i => i.done).length} de ${infos.length}</b></div>
      </div>
      ${perMonth > t.investir && t.receita ? `<p class="help" style="margin-top:12px">⚠️ As metas pedem ${money(perMonth - t.investir)} a mais por mês do que você reserva em "Investir". Ajuste os prazos ou o quanto investe.</p>` : ''}`;
  }

  function openMeta(item) {
    const editing = !!item;
    const g = item ? { ...item, investments: [...(item.investments || [])] } : { name: '', emoji: '🎯', target: 0, deadline: addMonths(curKey(), 12), saved: 0, investments: [] };
    openModal(`<form id="f">${modalHead(editing ? 'Editar meta' : 'Nova meta', 'Um objetivo com valor e prazo. O app diz quanto guardar por mês.')}
      <div class="emoji-pick" id="gEmoji">${GOAL_EMOJI.map(e => `<button type="button" class="${e === g.emoji ? 'on' : ''}">${e}</button>`).join('')}</div>
      <label class="fl" for="fName">Nome</label><input class="input" id="fName" maxlength="40" placeholder="Ex.: Viagem pro Nordeste" value="${esc(g.name)}" />
      <div class="two">
        <div>${moneyField('fAmount', g.target, 'Quanto quer juntar')}</div>
        <div><label class="fl" for="fDeadline">Até quando</label><input class="input" type="month" id="fDeadline" value="${g.deadline || ''}" /></div>
      </div>
      <button type="button" class="link" id="gReserve">🛟 Calcular reserva de emergência (6 meses de despesas)</button>
      <p class="help" id="gReserveHelp"></p>
      <label class="fl">De onde vem o dinheiro</label>
      <div class="seg2" id="gSrc"><button type="button" data-src="manual">Digitar quanto já guardei</button><button type="button" data-src="inv">Somar meus investimentos</button></div>
      <div id="gManual">${moneyField('fSaved', g.saved || 0, 'Guardado até agora')}</div>
      <div id="gInv"></div>
      <p class="help" id="gHelp"></p>
      ${footer(editing)}</form>`, m => {
      let src = g.investments.length ? 'inv' : 'manual';
      const target = m.querySelector('#fAmount'), savedIn = m.querySelector('#fSaved');
      const help = () => {
        const tmp = { ...g, target: cents(target), deadline: m.querySelector('#fDeadline').value, saved: cents(savedIn), investments: src === 'inv' ? g.investments : [] };
        const i = goalInfo(tmp);
        m.querySelector('#gHelp').textContent = !tmp.target ? '' : i.done ? 'Meta já alcançada 🎉' : i.late ? 'O prazo já passou.' : i.perMonth ? `Faltam ${brl.format(i.left / 100)}: guarde uns ${brl.format(i.perMonth / 100)} por mês (${i.months} ${i.months === 1 ? 'mês' : 'meses'}).` : '';
      };
      const drawSrc = () => {
        m.querySelectorAll('#gSrc button').forEach(b => b.classList.toggle('on', b.dataset.src === src));
        m.querySelector('#gManual').hidden = src !== 'manual';
        m.querySelector('#gInv').innerHTML = src !== 'inv' ? '' : state.investments.length
          ? `<div class="bank-chips" id="gInvPick">${state.investments.map(i => `<button type="button" data-inv="${i.id}" class="${g.investments.includes(i.id) ? 'on' : ''}">${esc(i.name)} · ${brl.format(estimate(i) / 100)}</button>`).join('')}</div>`
          : `<p class="help">Você ainda não tem investimentos cadastrados na aba Investimentos.</p>`;
        help();
      };
      m.querySelector('#gEmoji').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; g.emoji = b.textContent; m.querySelectorAll('#gEmoji button').forEach(x => x.classList.toggle('on', x === b)); });
      m.querySelector('#gSrc').addEventListener('click', e => { const b = e.target.closest('[data-src]'); if (b) { src = b.dataset.src; drawSrc(); } });
      m.querySelector('#gInv').addEventListener('click', e => {
        const b = e.target.closest('[data-inv]'); if (!b) return;
        const id = b.dataset.inv;
        g.investments = g.investments.includes(id) ? g.investments.filter(x => x !== id) : [...g.investments, id];
        b.classList.toggle('on'); help();
      });
      const setTarget = bindMoney(target, help);
      bindMoney(savedIn, help);
      m.querySelector('#fDeadline').addEventListener('input', help);
      m.querySelector('#gReserve').addEventListener('click', () => {
        const avg = avgExpenses();
        if (!avg) { m.querySelector('#gReserveHelp').textContent = 'Lance suas despesas primeiro pra eu calcular a média.'; return; }
        setTarget(avg * 6);
        if (!m.querySelector('#fName').value.trim()) m.querySelector('#fName').value = 'Reserva de emergência';
        g.emoji = '🛟'; m.querySelectorAll('#gEmoji button').forEach(x => x.classList.toggle('on', x.textContent === '🛟'));
        m.querySelector('#gReserveHelp').textContent = `Sua média de despesas é ${brl.format(avg / 100)} por mês → 6 meses = ${brl.format(avg * 6 / 100)}.`;
        help();
      });
      drawSrc();
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const data = { name: m.querySelector('#fName').value.trim(), emoji: g.emoji, target: cents(target), deadline: m.querySelector('#fDeadline').value,
          saved: src === 'manual' ? cents(savedIn) : 0, investments: src === 'inv' ? g.investments : [] };
        if (!data.name) return showErr('Dê um nome pra meta.');
        if (!data.target) return showErr('Quanto você quer juntar?');
        if (src === 'inv' && !data.investments.length) return showErr('Escolha pelo menos um investimento.');
        if (editing) Object.assign(state.metas.find(x => x.id === item.id), data);
        else state.metas.push({ ...data, id: uid(), created: Date.now() });
        undoToast(editing ? 'Meta atualizada' : 'Meta criada 🎯', undoSnap);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => {
        const snap = JSON.stringify(state.metas);
        state.metas = state.metas.filter(x => x.id !== item.id);
        closeModal(); commit();
        toast('Meta excluída', 'Desfazer', () => { state.metas = JSON.parse(snap); commit(); });
      });
    });
  }

  // Guardar um valor numa meta (manual) sem abrir a edição completa; opcionalmente tirando de uma conta
  function openGoalAdd(g) {
    openModal(`<form id="f">${modalHead(`${g.emoji || '🎯'} ${esc(g.name)}`, `Guardado até agora: ${brl.format((g.saved || 0) / 100)} de ${brl.format(g.target / 100)}.`)}
      <div class="seg2" id="gaMv"><button type="button" data-mv="in" class="on">+ Guardar</button><button type="button" data-mv="out">− Retirar</button></div>
      ${moneyField('fAmount', 0, 'Valor')}
      ${state.accounts.length ? `<label class="fl" for="gaAcc" id="gaAccLbl">Sai da conta</label><select class="select" id="gaAcc"><option value="">Não mexer nas contas</option>${state.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>` : ''}
      <p class="help" id="gaHelp"></p>
      ${footer(false).replace('>Adicionar<', '>Salvar<')}</form>`, m => {
      let mv = 'in';
      const amount = m.querySelector('#fAmount');
      const help = () => { const c = cents(amount), after = Math.max((g.saved || 0) + (mv === 'in' ? c : -c), 0);
        m.querySelector('#gaHelp').textContent = c ? `Fica em ${brl.format(after / 100)} (${g.target ? Math.min(100, Math.round(after / g.target * 100)) : 0}% da meta).` : ''; };
      bindMoney(amount, help);
      m.querySelector('#gaMv').addEventListener('click', e => { const b = e.target.closest('[data-mv]'); if (!b) return; mv = b.dataset.mv;
        m.querySelectorAll('#gaMv button').forEach(x => x.classList.toggle('on', x === b));
        if (m.querySelector('#gaAccLbl')) m.querySelector('#gaAccLbl').textContent = mv === 'in' ? 'Sai da conta' : 'Volta para a conta'; help(); });
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const c = cents(amount); if (!c) return showErr('Digite o valor.');
        const undoSnap = JSON.stringify(state), meta = state.metas.find(x => x.id === g.id), acc = m.querySelector('#gaAcc')?.value;
        meta.saved = Math.max((meta.saved || 0) + (mv === 'in' ? c : -c), 0);
        if (acc) (state.transfers ||= []).push({ id: uid(), created: Date.now(), date: todayIso, amount: c, from: mv === 'in' ? acc : '', to: mv === 'in' ? '' : acc,
          inv: 'meta:' + g.id, desc: `${mv === 'in' ? 'Guardado na meta' : 'Retirado da meta'} ${meta.name}` });
        undoToast(meta.saved >= meta.target ? `Meta ${meta.name} alcançada! 🎉` : `${brl.format(c / 100)} ${mv === 'in' ? 'guardados' : 'retirados'}`, undoSnap);
        commit();
      });
    });
  }

  // ================= Assinaturas =================
  const cycleText = a => a.cycle === 'anual' ? `Anual · ${pad(a.day)}/${MESES[a.month - 1]}` : `Mensal · dia ${pad(a.day)}`;

  function renderAssinTable() {
    $('#tableTitle').textContent = 'Assinaturas';
    const q = view.query.trim().toLowerCase();
    const rows = state.assinaturas.filter(a => activeIn(a, view.month) && (!q || a.name.toLowerCase().includes(q)))
      .sort((a, b) => perMonth(b) - perMonth(a));
    if (!rows.length) {
      $('#table').innerHTML = (q ? '' : detectBanner()) + `<div class="empty">${q ? 'Nada encontrado com esse filtro.' : 'Nenhuma assinatura ainda.<br>Netflix, Spotify, Crunchyroll… tudo num lugar só.'}${q ? '' : `<br><button class="btn-soft" data-add>${ico('plus')}Adicionar</button>`}</div>`;
      return;
    }
    const charged = new Set(assinaturasOf(view.month).map(a => a.id));
    const head = `<div class="row head"><span></span><span>Serviço</span><span class="cat">Cobrança</span><span class="val">Valor</span><span></span></div>`;
    const body = rows.map(a => {
      const tag = `<span class="tag" style="background:var(--field);color:var(--ink-2)">${cycleText(a)}</span>`;
      const suffix = a.cycle === 'anual' ? '/ano' : '/mês';
      return `<div class="row">
        <span class="date">${logoHtml(a)}</span>
        <div class="name"><span>${esc(a.name)}${!charged.has(a.id) ? `<small>${(a.skip || []).includes(view.month) ? 'pulada este mês' : 'não cobra este mês'}</small>` : ''}${viaHtml(a)}</span><div class="tag-m">${tag}</div></div>
        <span class="cat">${tag}</span>
        ${charged.has(a.id) && inFatura({ ...a, shownDate: dateIn(view.month, a.day) }, view.month)
          ? `<span class="val num absorbed" title="Já está dentro da fatura do ${esc(payCardOf(a).name)}">${money(a.amount)}${suffix}<small>na fatura</small></span>`
          : `<span class="val num">${money(a.amount)}<small style="color:var(--muted);font-weight:500">${suffix}</small></span>`}
        <button class="edit" data-edit="${a.id}" aria-label="Editar">${ico('pencil', 'width:14px;height:14px')}</button>
      </div>`;
    }).join('');
    const month = rows.reduce((s, a) => s + perMonth(a), 0);
    const now = assinaturasOf(view.month).reduce((s, a) => s + a.amount, 0);
    const inside = assinaturasOf(view.month).filter(a => inFatura(a, view.month)).reduce((s, a) => s + a.amount, 0);
    $('#table').innerHTML = detectBanner() + head + body + `
      <div class="total"><span>Custo por mês</span><strong class="num negc">${money(month)}</strong></div>
      <div class="yield"><span>Cobrado neste mês ${money(now)}${inside ? ` · ${money(inside)} já nas faturas` : ''}</span><span>Por ano <strong class="num" style="color:var(--red)">${money(month * 12)}</strong></span></div>`;
  }

  function renderAssinChart() {
    const rows = state.assinaturas.filter(a => activeIn(a, view.month)).map(a => {
      const b = BRANDS[a.brand];
      return { name: a.name, color: b ? b.color : (a.color || '#64748b'), value: perMonth(a) };
    }).filter(g => g.value > 0).sort((a, b) => b.value - a.value);
    const total = rows.reduce((s, g) => s + g.value, 0);
    $('#chart').innerHTML = total ? donutHtml(rows, total, 'Por mês')
      : `<div class="chart-empty">${ico('pie')}<span>Suas assinaturas aparecem aqui</span></div>`;
  }

  function openAssinatura(item) {
    const editing = !!item;
    const a = item ? { ...item } : { brand: '', name: '', icon: '', amount: 0, cycle: 'mensal', day: +defaultDate().slice(8), month: +view.month.slice(5) };
    const services = Object.entries(BRANDS).filter(([, b]) => b.kind === 'sub');
    openModal(`<form id="f">${modalHead(editing ? 'Editar assinatura' : 'Nova assinatura', 'Streaming, música, apps… o que é cobrado todo mês ou todo ano.')}
      <div id="svcPick"></div>
      <label class="fl" for="fAmount">Valor</label>
      <div class="money"><span>R$</span><input id="fAmount" inputmode="numeric" value="${centsText(a.amount)}" data-cents="${a.amount}" autocomplete="off" /></div>
      <label class="fl">Cobrança</label>
      <div class="seg2" id="fCycle"><button type="button" data-cy="mensal">Mensal</button><button type="button" data-cy="anual">Anual</button></div>
      <div class="two">
        <div><label class="fl" for="fDay" style="margin-top:4px">Dia da cobrança</label>
          <select class="select" id="fDay">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${i + 1 === a.day ? 'selected' : ''}>Dia ${pad(i + 1)}</option>`).join('')}</select></div>
        <div id="monthBox"><label class="fl" for="fMonth" style="margin-top:4px">Mês de renovação</label>
          <select class="select" id="fMonth">${MESES.map((mm, i) => `<option value="${i + 1}" ${i + 1 === a.month ? 'selected' : ''}>${mm}</option>`).join('')}</select></div>
      </div>
      <p class="help" id="cyHelp"></p>
      ${payField(item ? a : null)}
      ${footer(editing)}</form>`, m => {
      const amount = m.querySelector('#fAmount');
      let chosen = !!(a.brand || a.name);
      const drawPick = () => {
        const box = m.querySelector('#svcPick');
        if (chosen) {
          box.innerHTML = `<div class="picked">
            <button type="button" class="logo-btn" id="pIcon" title="Trocar ícone (usar uma imagem sua)">${logoHtml(a, 'lg')}</button>
            <div class="grow"><input class="input" id="fName" maxlength="40" value="${esc(a.name)}" placeholder="Nome do serviço" aria-label="Nome do serviço" />
              ${a.icon ? `<button type="button" class="link" id="pReset">Voltar ao ícone padrão</button>` : ''}</div>
            ${editing ? '' : `<button type="button" class="link" id="pChange">Trocar</button>`}</div>`;
          m.querySelector('#fName').addEventListener('input', e => { a.name = e.target.value; if (!a.brand) m.querySelector('#pIcon').innerHTML = logoHtml(a, 'lg'); });
          m.querySelector('#pIcon').addEventListener('click', async () => { const icon = await pickIcon(); if (icon) { a.icon = icon; drawPick(); } });
          m.querySelector('#pReset')?.addEventListener('click', () => { a.icon = ''; drawPick(); });
          m.querySelector('#pChange')?.addEventListener('click', () => { chosen = false; a.brand = ''; a.name = ''; a.icon = ''; drawPick(); });
        } else {
          box.innerHTML = `<input class="input svc-search" id="svcQ" placeholder="Buscar serviço…" autocomplete="off" />
            <div class="svc-grid" id="svcGrid">${services.map(([k, b]) => `<button type="button" class="svc" data-svc="${k}">${logoHtml({ brand: k })}<span>${esc(b.name)}</span></button>`).join('')}
            <button type="button" class="svc" data-svc="">${logoHtml({ name: '+', color: '#94a3b8' })}<span>Outro</span></button></div>`;
          m.querySelector('#svcQ').addEventListener('input', e => {
            const q = e.target.value.trim().toLowerCase();
            m.querySelectorAll('#svcGrid .svc').forEach(el => { el.hidden = !!q && el.dataset.svc !== '' && !BRANDS[el.dataset.svc].name.toLowerCase().includes(q); });
          });
          m.querySelector('#svcGrid').addEventListener('click', e => {
            const b = e.target.closest('[data-svc]'); if (!b) return;
            a.brand = b.dataset.svc;
            a.name = a.brand ? BRANDS[a.brand].name : (m.querySelector('#svcQ').value.trim() || '');
            a.color = a.brand ? '' : PALETTE[state.assinaturas.length % PALETTE.length];
            chosen = true;
            drawPick();
            if (!a.brand) m.querySelector('#fName').focus(); else amount.focus();
          });
        }
      };
      const drawCycle = () => {
        m.querySelectorAll('#fCycle button').forEach(b => b.classList.toggle('on', b.dataset.cy === a.cycle));
        m.querySelector('#monthBox').style.visibility = a.cycle === 'anual' ? 'visible' : 'hidden';
        const c = cents(amount);
        m.querySelector('#cyHelp').textContent = !c ? '' : a.cycle === 'anual'
          ? `Equivale a ${brl.format(Math.round(c / 12) / 100)} por mês. Entra nas despesas só no mês da renovação.`
          : `São ${brl.format(c * 12 / 100)} por ano.`;
      };
      bindMoney(amount, drawCycle);
      m.querySelector('#fCycle').addEventListener('click', e => { const b = e.target.closest('[data-cy]'); if (b) { a.cycle = b.dataset.cy; drawCycle(); } });
      drawPick(); drawCycle(); bindPay(m);
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const name = (m.querySelector('#fName')?.value || '').trim();
        if (!name) return showErr('Escolha o serviço ou dê um nome.');
        const data = { brand: a.brand || '', name, icon: a.icon || '', color: a.color || '', amount: cents(amount), cycle: a.cycle,
          day: +m.querySelector('#fDay').value, month: +m.querySelector('#fMonth').value, ...readPay(m) };
        if (!data.amount) return showErr('Digite o valor.');
        if (!editing) {
          state.assinaturas.push({ ...data, id: uid(), created: Date.now(), start: view.month });
        } else {
          const old = state.assinaturas.find(x => x.id === item.id);
          const priceChanged = old.amount !== data.amount || old.cycle !== data.cycle || old.day !== data.day || old.month !== data.month
            || (old.payCard || '') !== data.payCard || (old.payAccount || '') !== data.payAccount;
          if (old.start < view.month && priceChanged) {
            // Reajuste: o valor antigo fica no histórico e o novo vale deste mês em diante
            const end = old.end;
            Object.assign(old, { name: data.name, icon: data.icon, brand: data.brand }, { end: addMonths(view.month, -1) });
            state.assinaturas.push({ ...data, id: uid(), created: old.created, start: view.month, end });
          } else Object.assign(old, data);
        }
        undoToast(editing ? 'Assinatura atualizada' : 'Assinatura adicionada', undoSnap);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => removeRecurringAware('assinaturas', item, true));
    });
  }

  // ================= Detector de assinaturas =================
  // Como cada serviço costuma aparecer no extrato
  const SUB_RE = { youtubemusic: /youtube ?music/, youtube: /youtube|google ?yt/, netflix: /netflix/, spotify: /spotify/, crunchyroll: /crunchyroll/,
    prime: /amazon ?prime|prime ?video|amazonprime/, disney: /disney/, hbomax: /hbo ?max|\bhbo\b|max\.com/, globoplay: /globo ?play/, appletv: /apple ?tv/,
    paramount: /paramount/, applemusic: /apple ?music/, deezer: /deezer/, icloud: /icloud/, chatgpt: /openai|chatgpt/, claude: /anthropic|claude\.ai/,
    xbox: /xbox|game ?pass/, playstation: /playstation|\bpsn\b|sony ?interactive/, discord: /discord/, twitch: /twitch/, duolingo: /duolingo/, canva: /canva/,
    ms365: /microsoft ?365|office ?365|\bmsft\b/, adobe: /adobe/, notion: /notion/, dropbox: /dropbox/, audible: /audible/, ifood: /clube ?ifood|ifood ?club/, uber: /uber ?one/ };
  // resultado só depende do texto: guardado pra não rodar ~30 expressões por lançamento a cada tela
  const brandCache = new Map();
  const brandOfDesc = d => {
    const n = norm(d);
    if (brandCache.has(n)) return brandCache.get(n);
    let out = ''; for (const [k, re] of Object.entries(SUB_RE)) if (re.test(n)) { out = k; break; }
    if (brandCache.size > 5000) brandCache.clear();
    brandCache.set(n, out); return out;
  };
  const squash = t => norm(t).replace(/[^a-z0-9]/g, '');
  const merchantKey = d => norm(d).replace(/\(\d+\/\d+\)|parc(ela)?\s*\d+.*$/g, '').replace(/[^a-z ]/g, ' ')
    .replace(/\b(pag|pagto|pgto|compra|debito|credito|cartao|pix|www|com|br|ltda|sa|me|eireli|de|da|do)\b/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
  const mdiff = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5) - +a.slice(5));
  const niceName = d => {
    const t = String(d).replace(/[*_#]+/g, ' ').replace(/\b\d[\d/.\-:]*\b/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
    return t === t.toUpperCase() ? t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : t;
  };
  // A assinatura cadastrada que corresponde a um lançamento (pelo serviço ou pelo nome)
  function subFor(desc, key) {
    const b = brandOfDesc(desc), n = squash(desc);
    return state.assinaturas.find(a => activeIn(a, key) && ((b && a.brand === b) || (squash(a.name).length >= 4 && n.includes(squash(a.name)))));
  }
  // Gastos que se repetem todo mês com valor parecido (ou serviços conhecidos) e ainda não estão em Assinaturas
  function detectSubs() { return cached('subs', detectSubsRaw); }
  function detectSubsRaw() {
    const ignore = new Set(state.subIgnore || []), groups = {};
    for (const v of state.variaveis) {
      if (v.installment || !v.amount || !v.desc) continue;
      const b = brandOfDesc(v.desc), k = b ? 'b:' + b : 'm:' + merchantKey(v.desc);
      if (k.length < 5 || ignore.has(k)) continue;
      (groups[k] ||= []).push(v);
    }
    const out = [];
    for (const [k, items] of Object.entries(groups)) {
      const brand = k.startsWith('b:') ? k.slice(2) : '';
      const byMonth = {};
      items.forEach(v => (byMonth[monthOf(v.date)] ||= []).push(v));
      const months = Object.keys(byMonth).sort(), lastMonth = months[months.length - 1];
      if (mdiff(lastMonth, curKey()) > 2) continue;                       // parou de cobrar
      const last = byMonth[lastMonth].sort((a, b) => a.date.localeCompare(b.date))[byMonth[lastMonth].length - 1];
      if (subFor(last.desc, lastMonth) || (brand && state.assinaturas.some(a => a.brand === brand && activeIn(a, curKey())))) continue;
      if (!brand) {
        const recent = months.slice(-3);
        if (recent.length < 3 || recent.some(m => byMonth[m].length > 1)) continue;   // várias compras no mês: não é assinatura
        if (mdiff(recent[0], recent[2]) > 3) continue;
        const amts = recent.map(m => byMonth[m][0].amount), days = recent.map(m => +byMonth[m][0].date.slice(8));
        if (Math.max(...amts) > Math.min(...amts) * 1.1 || Math.max(...days) - Math.min(...days) > 6) continue;
      }
      out.push({ key: k, brand, name: brand ? BRANDS[brand].name : niceName(last.desc), amount: last.amount, day: +last.date.slice(8), months: months.length,
        lastMonth, payCard: last.payCard || '', payAccount: last.payAccount || '', ids: byMonth[lastMonth].map(v => v.id), color: brand ? '' : PALETTE[out.length % PALETTE.length] });
    }
    return out.sort((a, b) => b.amount - a.amount);
  }
  // Reajustes vistos nos extratos importados
  const priceChanges = () => Object.entries(state.subPrice || {}).map(([id, p]) => ({ ...p, sub: state.assinaturas.find(a => a.id === id) }))
    .filter(p => p.sub && p.sub.amount !== p.amount);
  const priceText = p => `${p.amount > p.sub.amount ? 'Subiu' : 'Baixou'} de ${money(p.sub.amount)} para ${money(p.amount)}`;
  function applyPrice(id, accept) {
    const p = state.subPrice?.[id], old = state.assinaturas.find(a => a.id === id);
    if (state.subPrice) delete state.subPrice[id];
    if (accept && p && old) {
      const from = monthOf(p.date);
      if (old.start < from) {
        // O preço antigo fica no histórico e o novo vale do mês da cobrança em diante
        const nu = { ...old, id: uid(), amount: p.amount, start: from, end: old.end };
        old.end = addMonths(from, -1);
        state.assinaturas.push(nu);
      } else old.amount = p.amount;
      toast(`${old.name} agora custa ${money(p.amount)}`);
    }
    commit();
  }
  const detectBanner = () => {
    const found = detectSubs(), prices = priceChanges();
    return (found.length ? `<div class="det-banner"><span class="det-ic">${ico('spark')}</span><span class="grow"><strong>${found.length === 1 ? 'Achei 1 possível assinatura' : `Achei ${found.length} possíveis assinaturas`}</strong><small>${esc(found.slice(0, 3).map(d => d.name).join(', '))}${found.length > 3 ? '…' : ''} se repete${found.length > 1 ? 'm' : ''} nos seus gastos</small></span><button class="btn-soft" type="button" data-detect>Revisar</button></div>` : '')
      + prices.map(p => `<div class="det-banner">${logoHtml(p.sub, 'sm')}<span class="grow"><strong>${esc(p.sub.name)} mudou de preço</strong><small>${priceText(p)} em ${monthName(monthOf(p.date))}</small></span><button class="link" type="button" data-subprice="${p.sub.id}" data-ok="0">Ignorar</button><button class="btn-soft" type="button" data-subprice="${p.sub.id}" data-ok="1">Atualizar</button></div>`).join('');
  };
  document.addEventListener('click', e => {
    if (e.target.closest('[data-detect]')) { togglePop($('#bellPop'), false); return openSubDetect(); }
    const sp = e.target.closest('[data-subprice]');
    if (sp) { togglePop($('#bellPop'), false); applyPrice(sp.dataset.subprice, sp.dataset.ok === '1'); }
  });

  function openSubDetect() {
    const list = detectSubs();
    if (!list.length) return toast('Nenhuma assinatura nova encontrada');
    const sel = new Set(list.map((_, i) => i));
    const via = d => d.payCard ? ' · ' + esc(state.cards.find(c => c.id === d.payCard)?.name || 'cartão') : d.payAccount ? ' · ' + esc(state.accounts.find(a => a.id === d.payAccount)?.name || 'conta') : '';
    openModal(`${modalHead('Possíveis assinaturas', 'Gastos que se repetem todo mês. Marque o que é assinatura.')}
      <div class="det-list" id="detList">${list.map((d, i) => `<div class="det-row" data-i="${i}">
        <label class="check"><input type="checkbox" checked /><span class="box">${ico('check')}</span></label>
        ${logoHtml(d, 'sm')}
        <span class="t"><strong>${esc(d.name)}</strong><small>${money(d.amount)}/mês · dia ${pad(d.day)} · ${d.months > 1 ? `apareceu em ${d.months} meses` : 'serviço de assinatura'}${via(d)}</small></span>
        <button type="button" class="link" data-no="${i}" title="Não perguntar de novo">Não é</button></div>`).join('')}</div>
      <p class="help">O gasto do último mês vira a assinatura, pra não contar duas vezes. Os meses anteriores continuam no histórico.</p>
      <div class="actions"><span class="grow"></span><button type="button" class="btn cancel" data-close>Cancelar</button><button type="button" class="btn save" id="detGo"></button></div>`, m => {
      const sync = () => {
        m.querySelectorAll('.det-row').forEach(r => { const on = sel.has(+r.dataset.i); r.classList.toggle('off', !on); r.querySelector('input').checked = on; });
        m.querySelector('#detGo').textContent = sel.size ? `Adicionar ${sel.size}` : 'Adicionar';
        m.querySelector('#detGo').disabled = !sel.size;
      };
      onModalClose = () => render();
      m.querySelector('#detList').addEventListener('change', e => { const i = +e.target.closest('.det-row').dataset.i; e.target.checked ? sel.add(i) : sel.delete(i); sync(); });
      m.querySelector('#detList').addEventListener('click', e => {
        const no = e.target.closest('[data-no]'); if (!no) return;
        const i = +no.dataset.no;
        (state.subIgnore ||= []).push(list[i].key); save();
        sel.delete(i); no.closest('.det-row').remove(); sync();
        if (!m.querySelector('.det-row')) { closeModal(); commit(); }
      });
      m.querySelector('#detGo').addEventListener('click', () => {
        const snap = JSON.stringify({ a: state.assinaturas, v: state.variaveis });
        const chosen = list.filter((_, i) => sel.has(i)), drop = new Set(chosen.flatMap(d => d.ids));
        chosen.forEach((d, n) => state.assinaturas.push({ brand: d.brand, name: d.name, icon: '', color: d.color, amount: d.amount, cycle: 'mensal', day: d.day,
          month: +d.lastMonth.slice(5), payCard: d.payCard, payAccount: d.payAccount, id: uid(), created: Date.now() + n, start: d.lastMonth }));
        state.variaveis = state.variaveis.filter(v => !drop.has(v.id));
        closeModal(); commit();
        toast(`${chosen.length} assinatura${chosen.length > 1 ? 's' : ''} adicionada${chosen.length > 1 ? 's' : ''}`, 'Desfazer', () => { const o = JSON.parse(snap); state.assinaturas = o.a; state.variaveis = o.v; commit(); });
      });
      sync();
    });
  }

  // ================= Cartões de crédito =================
  const flagHtml = k => FLAGS[k] ? `<span class="flag" title="${FLAGS[k].name}"><img src="${FLAGS[k].img}" alt="${FLAGS[k].name}" /></span>` : '';
  const FLAG_HINT = { nubank: 'mastercard', inter: 'mastercard', c6: 'mastercard' };   // bandeira mais comum de cada banco, só como sugestão
  const monthName = key => new Date(+key.slice(0, 4), +key.slice(5) - 1, 1).toLocaleDateString('pt-BR', { month: 'long' });

  function renderCardsTable() {
    $('#tableTitle').textContent = 'Cartões de crédito';
    const q = view.query.trim().toLowerCase();
    const rows = cardsOf(view.month).filter(c => !q || c.name.toLowerCase().includes(q)).map(c => {
      const k = focusKey(c, view.month);
      return { ...c, fk: k, fatura: (state.faturas[c.id] || {})[k] || null, dates: faturaDates(c, k) };
    });
    if (!rows.length) {
      $('#table').innerHTML = `<div class="empty">${q ? 'Nada encontrado com esse filtro.' : 'Nenhum cartão ainda.<br>Cadastre seus cartões e lance a fatura de cada mês.'}${q ? '' : `<br><button class="btn-soft" data-add>${ico('plus')}Adicionar cartão</button>`}</div>`;
      return;
    }
    const head = `<div class="row head"><span></span><span>Cartão</span><span class="cat">Fatura</span><span class="val">Valor</span><span></span></div>`;
    const body = rows.map(c => {
      const f = c.fatura;
      const st = FSTATE[faturaState(c, c.fk, f)];
      const status = !f ? `<button class="tag status none" data-fatura="${c.id}" data-key="${c.fk}">Lançar fatura</button>`
        : `<button class="tag status ${st[0]}" data-fpay="${c.id}" data-key="${c.fk}" title="${f.paid ? 'Marcar como não paga' : 'Marcar como paga'}">${st[1]}</button>`;
      const avail = c.limit ? c.limit - cardUsed(c) : 0;
      const limit = c.limit ? ` · disponível <b style="color:${avail < c.limit * 0.1 ? 'var(--red)' : 'inherit'}">${money(Math.max(avail, 0))}</b> de ${money(c.limit)}` : '';
      const prev = !f ? faturaPreview(c.id, c.fk) : 0;
      return `<div class="row">
        <span class="date">${logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color })}</span>
        <div class="name"><span>${esc(c.name)}${c.count === false ? `<small>fora das despesas</small>` : ''}</span>
          <div class="card-sub">${flagHtml(c.flag)}${c.last4 ? `•••• ${esc(c.last4)} · ` : ''}${c.fk !== view.month ? `fatura de ${monthName(c.fk)} · ` : ''}fecha ${dm(c.dates.close)} · vence ${dm(c.dates.due)}${limit}</div>
          ${(() => { const its = itemsOnCard(c.id, c.fk); return its.length ? `<div class="card-sub">inclui ${its.slice(0, 3).map(i => esc(i.label)).join(', ')}${its.length > 3 ? ` +${its.length - 3}` : ''}</div>` : ''; })()}
          <div class="tag-m">${status}</div></div>
        <span class="cat">${status}</span>
        <span class="val num">${f ? money(f.amount) : prev ? `<span style="color:var(--muted)">≈ ${money(prev)}<small style="display:block;font-size:.68rem">prévia</small></span>` : '<span style="color:var(--muted)">—</span>'}</span>
        <button class="edit" data-edit="${c.id}" data-key="${c.fk}" aria-label="Fatura">${ico('pencil', 'width:14px;height:14px')}</button>
      </div>`;
    }).join('');
    const total = rows.reduce((s, c) => s + (c.fatura ? c.fatura.amount : 0), 0);
    const open = rows.reduce((s, c) => s + (c.fatura && !c.fatura.paid ? c.fatura.amount : 0), 0);
    $('#table').innerHTML = head + body + `
      <div class="total"><span>${view.month === curKey() ? 'Total das faturas atuais' : `Total das faturas que vencem em ${monthName(view.month)}`}</span><strong class="num negc">${money(total)}</strong></div>
      <div class="yield"><span>${open ? 'Em aberto' : total ? 'Tudo pago ✓' : ''}</span><span>${open ? `<strong class="num" style="color:var(--amber)">${money(open)}</strong>` : ''}</span></div>`;
  }

  function renderCardsChart() {
    const rows = cardsOf(view.month).map(c => ({ ...c, fatura: (state.faturas[c.id] || {})[focusKey(c, view.month)] }))
      .filter(c => c.fatura && c.fatura.amount > 0).map(c => {
      const b = BRANDS[c.bank];
      return { name: c.name, color: b ? b.color : (c.color || '#64748b'), value: c.fatura.amount };
    }).sort((a, b) => b.value - a.value);
    const total = rows.reduce((s, g) => s + g.value, 0);
    $('#chart').innerHTML = total ? donutHtml(rows, total, 'Faturas')
      : `<div class="chart-empty">${ico('pie')}<span>As faturas do mês aparecem aqui</span></div>`;
  }

  function ccPreview(c) {
    const b = BRANDS[c.bank];
    const color = b ? b.color : (c.color || '#3b414b');
    return `<div class="cc-preview" style="background:linear-gradient(135deg, ${color}, color-mix(in srgb, ${color} 55%, #000))">
      <div class="cc-top"><span class="cc-name">${esc(c.name || 'Meu cartão')}</span>${logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color })}</div>
      <div class="cc-chip"></div>
      <div class="cc-bottom"><span class="cc-num">${c.last4 ? `•••• ${esc(c.last4)}` : ''}</span>${flagHtml(c.flag) || '<span></span>'}</div></div>`;
  }

  function openCartao(item) {
    const editing = !!item;
    const c = item ? { ...item } : { bank: '', name: '', flag: '', last4: '', closeDay: 3, dueDay: 10, limit: 0, count: true, icon: '' };
    const banks = Object.keys(BRANDS).filter(k => BRANDS[k].kind === 'bank');
    openModal(`<form id="f">${modalHead(editing ? 'Editar cartão' : 'Novo cartão de crédito', 'Banco, bandeira e datas da fatura.')}
      <div id="ccPrev"></div>
      <label class="fl">Banco</label>
      <div class="bank-chips" id="ccBanks">${banks.map(k => `<button type="button" data-bank="${k}" class="${k === c.bank ? 'on' : ''}">${logoHtml({ brand: k }, 'sm')}${esc(BRANDS[k].name)}</button>`).join('')}
        <button type="button" data-bank="" class="${editing && !c.bank ? 'on' : ''}">${ico('plus', 'width:12px;height:12px')}Outro</button></div>
      <label class="fl">Bandeira</label>
      <div class="flag-pick" id="ccFlags">${Object.keys(FLAGS).map(k => `<button type="button" data-flag="${k}" class="${k === c.flag ? 'on' : ''}">${flagHtml(k)}${FLAGS[k].name}</button>`).join('')}</div>
      <div class="two">
        <div><label class="fl" for="fName">Nome do cartão</label><input class="input" id="fName" maxlength="30" placeholder="Ex.: Nubank, Itaú Click" value="${esc(c.name)}" /></div>
        <div><label class="fl" for="fLast4">Final <span style="color:var(--muted);font-weight:500">(opcional)</span></label><input class="input num" id="fLast4" inputmode="numeric" placeholder="1234" value="${esc(c.last4)}" /></div>
      </div>
      <div class="three">
        <div>${moneyField('fLimit', c.limit, 'Limite (opcional)')}</div>
        <div><label class="fl" for="fClose">Fecha dia</label><select class="select" id="fClose">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${i + 1 === c.closeDay ? 'selected' : ''}>${pad(i + 1)}</option>`).join('')}</select></div>
        <div><label class="fl" for="fDue">Vence dia</label><select class="select" id="fDue">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${i + 1 === c.dueDay ? 'selected' : ''}>${pad(i + 1)}</option>`).join('')}</select></div>
      </div>
      ${editing ? '' : moneyField('fAmount', 0, 'Valor da fatura atual (opcional)')}
      ${state.accounts.length ? `<label class="fl" for="fPayAcc">Fatura paga com a conta</label>
      <select class="select" id="fPayAcc"><option value="">Não informar</option>${state.accounts.map(a => `<option value="${a.id}" ${a.id === c.payAccount ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <p class="help">Quando você marcar a fatura como paga, o valor sai do saldo dessa conta.</p>` : ''}
      ${checkField('fCount', 'Somar a fatura nas despesas', 'Desmarque se você já lança as compras deste cartão em Despesa variável, pra não contar duas vezes.', c.count !== false)}
      ${footer(editing)}</form>`, m => {
      const prev = () => { m.querySelector('#ccPrev').innerHTML = ccPreview(c); };
      const nameInput = m.querySelector('#fName');
      m.querySelector('#ccBanks').addEventListener('click', e => {
        const b = e.target.closest('[data-bank]'); if (!b) return;

        c.bank = b.dataset.bank; c.icon = '';
        if (!c.bank) c.color = PALETTE[state.cards.length % PALETTE.length];

      m.querySelector('#ccFlags').addEventListener('click', e => {
        const b = e.target.closest('[data-flag]'); if (!b) return;

        prev();
      });
      nameInput.addEventListener('input', () => { c.name = nameInput.value; prev(); });
      m.querySelector('#fLast4').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); c.last4 = e.target.value; prev(); });
      bindMoney(m.querySelector('#fLimit'));
      if (!editing) bindMoney(m.querySelector('#fAmount'));
      prev();
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const name = nameInput.value.trim();
        if (!name) return showErr('Escolha o banco ou dê um nome ao cartão.');
        if (!c.flag) return showErr('Escolha a bandeira do cartão.');
        const data = { bank: c.bank || '', name, flag: c.flag, last4: c.last4 || '', icon: c.icon || '', color: c.color || '',
          limit: cents(m.querySelector('#fLimit')), closeDay: +m.querySelector('#fClose').value, dueDay: +m.querySelector('#fDue').value,
          count: m.querySelector('#fCount').checked, payAccount: m.querySelector('#fPayAcc')?.value || '' };
        if (editing) Object.assign(state.cards.find(x => x.id === item.id), data);
        else {
          const id = uid();
          state.cards.push({ ...data, id, created: Date.now(), start: view.month });
          const amount = cents(m.querySelector('#fAmount'));
          if (amount) (state.faturas[id] ||= {})[focusKey({ ...data, id }, view.month)] = { amount, paid: false };
        }
        undoToast(editing ? 'Cartão atualizado' : 'Cartão adicionado', undoSnap);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => removeRecurringAware('cards', item, true));
    });
  }

  function openFatura(card, key = focusKey(card, view.month)) {
    const f = (state.faturas[card.id] || {})[key];
    const last = (state.faturas[card.id] || {})[addMonths(key, -1)];
    const mn = monthName(key);
    const { close, due } = faturaDates(card, key);
    const st = faturaState(card, key, f);
    const next = addMonths(key, 1), nextF = (state.faturas[card.id] || {})[next];
    const stTxt = { open: 'aberta, ainda recebendo compras', closed: 'fechada, esperando pagamento', late: 'vencida', paid: 'paga' }[st];
    openModal(`<form id="f">${modalHead(`Fatura de ${mn}`, `${esc(card.name)}${card.last4 ? ` •••• ${esc(card.last4)}` : ''}`)}
      <div class="fnav"><button type="button" id="fPrev" aria-label="Fatura anterior">${ico('left')}</button>
        <div><strong>Fecha ${dm(close)} · vence ${dm(due)}</strong><small>${f || st !== 'late' ? `Fatura ${stTxt}` : 'Já venceu'}</small></div>
        <button type="button" id="fNext" aria-label="Próxima fatura">${ico('right')}</button></div>
      ${ccPreview(card)}
      ${moneyField('fAmount', f ? f.amount : 0, 'Valor da fatura')}
      ${last && !f ? `<div class="last-hint"><span>Mês passado: ${brl.format(last.amount / 100)}</span><button type="button" class="link" id="fLast">Usar esse valor</button></div>` : ''}
      ${!f && faturaPreview(card.id, key) ? `<div class="last-hint"><span>Compras já lançadas neste cartão: ${brl.format(faturaPreview(card.id, key) / 100)}</span><button type="button" class="link" id="fPrevUse">Usar esse valor</button></div>` : ''}
      <div id="insideBox"></div>
      ${st === 'late' && f && !nextF ? `<div class="movebox">Essa fatura venceu em ${dm(due)} e está sem pagar. Se esse valor é da fatura que ainda está aberta (fecha ${dm(faturaDates(card, next).close)}), mova pra de ${monthName(next)}.
        <br><button type="button" class="btn-soft" id="fMove">${ico('right', 'width:13px;height:13px')}Mover para a fatura de ${monthName(next)}</button></div>` : ''}
      ${checkField('fPaid', 'Fatura paga', '', f ? f.paid : false)}
      <div class="err" id="fErr"></div>
      <div class="actions">${f ? `<button type="button" class="btn del" id="fFatClear">Apagar fatura</button>` : ''}
        <button type="button" class="link" id="fEditCard" style="margin-left:${f ? '6px' : '0'}">Editar cartão</button><span class="grow"></span>
        <button type="button" class="btn cancel" data-close>Cancelar</button><button type="submit" class="btn save" id="fSave">Salvar</button></div></form>`, m => {
      const amount = m.querySelector('#fAmount');
      const its = itemsOnCard(card.id, key);
      const itSum = its.reduce((s, i) => s + i.amount, 0);
      const drawInside = () => {
        if (!its.length) return;
        const a = cents(amount), rest = a - itSum;
        m.querySelector('#insideBox').innerHTML = `<div class="inside"><div style="font-weight:700;margin-bottom:4px">Já dentro desta fatura</div>
          ${its.map(i => `<div class="it">${logoHtml(i.name ? i : { name: i.label, color: '#94a3b8' })}<span>${esc(i.label)} <span style="color:var(--muted)">· ${i.kind}</span></span><span class="num">${brl.format(i.amount / 100)}</span></div>`).join('')}
          <div class="sum"><span>${a ? 'Outras compras' : 'Soma dos itens'}</span><span class="num">${brl.format((a ? rest : itSum) / 100)}</span></div>
          ${a && rest < 0 ? `<div class="warn">A fatura está menor que a soma dos itens. Confira o valor.</div>` : ''}</div>`;
      };
      const set = bindMoney(amount, drawInside);
      drawInside();
      m.querySelector('#fLast')?.addEventListener('click', () => set(last.amount));
      m.querySelector('#fPrevUse')?.addEventListener('click', () => set(faturaPreview(card.id, key)));
      m.querySelector('#fEditCard').addEventListener('click', () => openCartao(state.cards.find(x => x.id === card.id)));
      m.querySelector('#fPrev').addEventListener('click', () => openFatura(card, addMonths(key, -1)));
      m.querySelector('#fNext').addEventListener('click', () => openFatura(card, next));
      m.querySelector('#fMove')?.addEventListener('click', () => {
        const undoSnap = JSON.stringify(state);
        state.faturas[card.id][next] = { ...state.faturas[card.id][key], paid: false };
        delete state.faturas[card.id][key];
        commit();
        undoToast(`Movida para a fatura de ${monthName(next)} (vence ${dm(faturaDates(card, next).due)})`, undoSnap);
      });
      m.querySelector('#fFatClear')?.addEventListener('click', () => {
        const snap = JSON.stringify(state.faturas);
        delete state.faturas[card.id][key];
        commit();
        toast('Fatura apagada', 'Desfazer', () => { state.faturas = JSON.parse(snap); commit(); });
      });
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const a = cents(amount);
        if (!a) return showErr('Digite o valor da fatura.');
        const paid = m.querySelector('#fPaid').checked;
        const prevF = (state.faturas[card.id] || {})[key];
        (state.faturas[card.id] ||= {})[key] = { amount: a, paid,
          ...(paid ? { paidAt: prevF?.paidAt || todayIso, paidTs: prevF?.paid ? prevF.paidTs : Date.now(), payAccount: prevF?.payAccount ?? (card.payAccount || '') } : {}) };
        undoToast(`Fatura de ${mn} salva (vence ${dm(due)})`, undoSnap);
        commit();
      });
    });
  }

  function toggleFaturaPaid(cardId, key) {
    const f = (state.faturas[cardId] || {})[key];
    if (!f) return;
    const card = state.cards.find(c => c.id === cardId);
    const undoSnap = JSON.stringify(state);
    f.paid = !f.paid;
    if (f.paid) { f.paidAt = todayIso; f.paidTs = Date.now(); f.payAccount = card?.payAccount || ''; } else { delete f.paidAt; delete f.paidTs; delete f.payAccount; }
    save(); render();
    undoToast(f.paid ? 'Fatura marcada como paga' : 'Fatura em aberto', undoSnap);
  }

  // ================= Investimentos =================
  const fmtRate = r => r.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  const RATE_LABEL = { cdi: '% do CDI', pre: '% ao ano (prefixado)', none: 'Não rende' };

  // Dias úteis (seg–sex) depois de "from" até "to", inclusive. Feriados não são descontados.
  function businessDays(fromIso, toIso) {
    const d = new Date(fromIso + 'T12:00:00'), end = new Date(toIso + 'T12:00:00');
    let n = 0;
    while (d < end) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w > 0 && w < 6) n++; }
    return n;
  }
  // Taxa por dia útil (base 252 dias úteis por ano)
  function dailyRate(inv) {
    if (inv.type === 'cdi') return (Math.pow(1 + state.cdi.rate / 100, 1 / 252) - 1) * inv.rate / 100;
    if (inv.type === 'pre') return Math.pow(1 + inv.rate / 100, 1 / 252) - 1;
    return 0;
  }
  const estimate = inv => Math.round(inv.balance * Math.pow(1 + dailyRate(inv), businessDays(inv.updatedAt, todayIso)));
  const monthlyYield = inv => Math.round(estimate(inv) * (Math.pow(1 + dailyRate(inv), 21) - 1));
  const rateText = inv => inv.type === 'cdi' ? `${fmtRate(inv.rate).replace(',00', '')} CDI` : inv.type === 'pre' ? `${fmtRate(inv.rate).replace(',00', '')} a.a.` : 'Sem rendimento';

  function renderInvestTable() {
    $('#tableTitle').textContent = 'Investimentos';
    const q = view.query.trim().toLowerCase();
    const rows = state.investments.filter(i => !q || (i.name + ' ' + (i.institution || '')).toLowerCase().includes(q))
      .map(i => ({ ...i, now: estimate(i) })).sort((a, b) => b.now - a.now);
    if (!rows.length) {
      $('#table').innerHTML = `<div class="empty">${q ? 'Nada encontrado com esse filtro.' : 'Nenhum investimento cadastrado.<br>Ex.: sua conta do Mercado Pago rendendo 120% do CDI.'}${q ? '' : `<br><button class="btn-soft" data-add>${ico('plus')}Adicionar</button>`}</div>`;
      return;
    }
    const head = `<div class="row head"><span>Atualiz.</span><span>Nome</span><span class="cat">Rende</span><span class="val">Saldo hoje</span><span></span></div>`;
    const body = rows.map(i => {
      const tag = `<span class="tag rate">${rateText(i)}</span>`;
      return `<div class="row">
        <span class="date num" title="Última vez que você informou o saldo">${ddmm(i.updatedAt)}</span>
        <div class="name"><span>${esc(i.name)}${i.institution ? `<small class="inst">${esc(i.institution)}</small>` : ''}</span><div class="tag-m">${tag}</div></div>
        <span class="cat">${tag}</span>
        <span class="val num">${money(i.now)}</span>
        <button class="edit" data-edit="${i.id}" aria-label="Editar">${ico('pencil', 'width:14px;height:14px')}</button>
      </div>`;
    }).join('');
    const total = rows.reduce((s, i) => s + i.now, 0);
    const month = rows.reduce((s, i) => s + monthlyYield(i), 0);
    $('#table').innerHTML = head + body + `
      <div class="total"><span>Total investido</span><strong class="num pos">${money(total)}</strong></div>
      <div class="yield"><span>Rendimento estimado (bruto, antes do IR)</span><span>≈ <strong class="num">${money(month)}</strong> / mês</span></div>`;
  }

  function renderInvestChart() {
    const rows = state.investments.map((i, n) => ({ name: i.name, color: PALETTE[n % PALETTE.length], value: estimate(i) }))
      .filter(g => g.value > 0).sort((a, b) => b.value - a.value);
    const total = rows.reduce((s, g) => s + g.value, 0);
    $('#chart').innerHTML = total ? donutHtml(rows, total, 'Patrimônio')
      : `<div class="chart-empty">${ico('pie')}<span>Seus investimentos aparecem aqui</span></div>`;
  }

  function openInvestment(item) {
    const editing = !!item;
    const inv = item || { name: '', institution: '', type: 'cdi', rate: 100, balance: 0, updatedAt: todayIso };
    const now = editing ? estimate(inv) : 0;
    openModal(`<form id="f">${modalHead(editing ? 'Editar investimento' : 'Novo investimento', 'Onde seu dinheiro está guardado e quanto rende.')}
      <label class="fl" for="fName">Nome</label><input class="input" id="fName" maxlength="40" placeholder="Ex.: Conta Mercado Pago, CDB, Tesouro Selic…" value="${esc(inv.name)}" />
      <label class="fl" for="fInst">Instituição <span style="color:var(--muted);font-weight:500">(opcional)</span></label><input class="input" id="fInst" maxlength="40" placeholder="Ex.: Mercado Pago" value="${esc(inv.institution || '')}" />
      <label class="fl" for="fType">Rendimento</label>
      <div class="rate-row">
        <select class="select" id="fType">${Object.entries(RATE_LABEL).map(([k, v]) => `<option value="${k}" ${k === inv.type ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <div class="suffix" id="rateBox"><input class="input num" id="fRate" type="number" inputmode="decimal" min="0" max="1000" step="0.01" value="${inv.rate}" aria-label="Taxa" /><span id="rateSuf"></span></div>
      </div>
      <p class="help" id="rateHelp"></p>
      ${moneyField('fAmount', now || inv.balance, editing ? 'Saldo hoje' : 'Quanto tem guardado hoje')}
      ${editing ? `<p class="help">Estimado pelo rendimento desde ${ddmm(inv.updatedAt)}. Se no app do banco estiver diferente, é só corrigir aqui.</p>
      <div class="divider"></div>
      <label class="fl">Aporte ou resgate <span style="color:var(--muted);font-weight:500">(opcional)</span></label>
      <div class="seg2" id="fMv"><button type="button" data-mv="in" class="on">+ Aportar</button><button type="button" data-mv="out">− Resgatar</button></div>
      <div class="money"><span>R$</span><input id="fMove" inputmode="numeric" value="0,00" data-cents="0" autocomplete="off" aria-label="Valor do aporte ou resgate" /></div>
      <p class="help" id="mvHelp"></p>
      ${state.accounts.length ? `<label class="fl" for="fMvAcc" id="mvAccLbl">Sai da conta</label>
      <select class="select" id="fMvAcc"><option value="">Não mexer nas contas</option>${state.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>` : ''}` : ''}
      ${footer(editing)}</form>`, m => {
      const type = m.querySelector('#fType'), rate = m.querySelector('#fRate'), amount = m.querySelector('#fAmount');
      let mv = 'in';
      const refresh = () => {
        const t = type.value;
        m.querySelector('#rateBox').hidden = t === 'none';
        m.querySelector('#rateSuf').textContent = t === 'cdi' ? '% CDI' : '% a.a.';
        const tmp = { type: t, rate: +rate.value || 0, balance: cents(amount), updatedAt: todayIso };
        const y = monthlyYield(tmp);
        m.querySelector('#rateHelp').textContent = t === 'none' ? 'Só guarda o valor, sem calcular rendimento.'
          : `${t === 'cdi' ? `Com o CDI a ${fmtRate(state.cdi.rate)} ao ano, isso` : 'Isso'} dá ≈ ${fmtRate((Math.pow(1 + dailyRate(tmp), 252) - 1) * 100)} ao ano${y ? `, uns ${brl.format(y / 100)} por mês` : ''} (bruto).`;
        if (editing) {
          const mvC = cents(m.querySelector('#fMove'));
          const final = cents(amount) + (mv === 'in' ? mvC : -mvC);
          m.querySelector('#mvHelp').textContent = mvC ? `Saldo depois: ${brl.format(Math.max(final, 0) / 100)}` : '';
        }
      };
      bindMoney(amount, refresh);
      type.addEventListener('change', refresh); rate.addEventListener('input', refresh);
      if (editing) {
        bindMoney(m.querySelector('#fMove'), refresh);
        m.querySelector('#fMv').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          mv = b.dataset.mv; m.querySelectorAll('#fMv button').forEach(x => x.classList.toggle('on', x === b));
          if (m.querySelector('#mvAccLbl')) m.querySelector('#mvAccLbl').textContent = mv === 'in' ? 'Sai da conta' : 'Entra na conta';
          refresh();
        });
      }
      refresh();
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const name = m.querySelector('#fName').value.trim();
        if (!name) return showErr('Dê um nome, ex.: Conta Mercado Pago.');
        let balance = cents(amount);
        if (editing) { const mvC = cents(m.querySelector('#fMove')); balance += mv === 'in' ? mvC : -mvC; }
        if (balance < 0) return showErr('O resgate é maior que o saldo.');
        const data = { name, institution: m.querySelector('#fInst').value.trim(), type: type.value,
          rate: Math.max(0, +rate.value || 0), balance, updatedAt: todayIso };
        if (editing) {
          Object.assign(state.investments.find(x => x.id === item.id), data);
          // aporte tirado de uma conta / resgate que caiu numa conta: o saldo da conta acompanha (vira uma transferência)
          const mvC = cents(m.querySelector('#fMove')), acc = m.querySelector('#fMvAcc')?.value;
          if (mvC && acc) (state.transfers ||= []).push({ id: uid(), created: Date.now(), date: todayIso, amount: mvC,
            from: mv === 'in' ? acc : '', to: mv === 'in' ? '' : acc, inv: item.id, desc: `${mv === 'in' ? 'Aporte em' : 'Resgate de'} ${name}` });
        }
        else state.investments.push({ ...data, id: uid(), created: Date.now() });
        undoToast(editing ? 'Investimento atualizado' : 'Investimento adicionado', undoSnap);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => {
        const snapshot = JSON.stringify(state.investments);
        state.investments = state.investments.filter(x => x.id !== item.id);
        closeModal(); commit();
        toast('Investimento excluído', 'Desfazer', () => { state.investments = JSON.parse(snapshot); commit(); });
      });
    });
  }

  // ================= Contas bancárias =================
  const BANK_KEYS = Object.keys(BRANDS).filter(k => BRANDS[k].kind === 'bank');

  function openAccounts() {
    const draft = state.accounts.map(a => { const cur = accBalance(a); return { ...a, cur, moves: accountMoves(a), brand: a.brand || brandByName(a.name) || '', neg: cur < 0, abs: Math.abs(cur) }; });
    openModal(`<form id="f">${modalHead('Minhas contas', 'Quanto tem em cada conta agora. A soma vira o seu saldo.')}
      <div id="accList"></div>
      <p class="fl" style="margin-top:16px">Adicionar conta</p>
      <div class="bank-chips" id="bankChips"></div>
      <div class="acc-total"><span>Saldo total</span><strong class="num" id="accTotal"></strong></div>
      ${state.accounts.length >= 2 ? `<button type="button" class="btn-soft" id="accTransfer" style="margin-top:10px">⇄ Transferir entre contas</button>` : ''}
      <div class="err" id="fErr"></div>
      <div class="actions"><span class="grow"></span><button type="button" class="btn cancel" data-close>Cancelar</button><button type="submit" class="btn save" id="fSave">Salvar</button></div></form>`, m => {
      const list = m.querySelector('#accList');
      m.querySelector('#accTransfer')?.addEventListener('click', () => { if (modalDirty && !confirm('Descartar as mudanças nos saldos?')) return; openTransfer(); });
      const total = () => {
        const t = draft.reduce((s, a) => s + (a.neg ? -a.abs : a.abs), 0);
        const el = m.querySelector('#accTotal');
        el.textContent = (t < 0 ? '–' : '') + brl.format(Math.abs(t) / 100);
        el.style.color = t < 0 ? 'var(--red)' : '';
      };
      const draw = focusIdx => {
        list.innerHTML = draft.length ? draft.map((a, i) => `<div class="acc ${a.neg ? 'neg' : ''}" data-i="${i}">
          <button type="button" class="logo-btn" data-icon title="Trocar ícone (usar uma imagem sua)">${logoHtml(a)}</button>
          <input class="input" data-name value="${esc(a.name)}" maxlength="30" placeholder="Nome da conta" aria-label="Nome da conta" />
          <div class="money"><button type="button" class="sign" data-sign tabindex="-1" title="Tocar para marcar como negativo (cheque especial)">${a.neg ? '–R$' : 'R$'}</button>
            <input inputmode="numeric" data-money value="${centsText(a.abs)}" data-cents="${a.abs}" aria-label="Saldo" /></div>
          <button type="button" class="x" data-rm aria-label="Remover conta">${ico('x')}</button></div>
          ${a.moves && a.moves.length ? `<details class="acc-note"><summary>Atualizado sozinho: ${brl.format(a.balance / 100)} informado em ${dm(a.updatedAt)} ${a.moves.reduce((s, x) => s + x.amount, 0) < 0 ? '−' : '+'} ${brl.format(Math.abs(a.moves.reduce((s, x) => s + x.amount, 0)) / 100)} em ${a.moves.length} lançamento${a.moves.length > 1 ? 's' : ''} <span class="acc-more">ver</span></summary>
            <ul>${a.moves.slice(-30).reverse().map(x => `<li><span>${dm(x.date)} · ${esc(x.label)}</span><b class="${x.amount < 0 ? '' : 'in'}">${x.amount < 0 ? '−' : '+'}${brl.format(Math.abs(x.amount) / 100)}</b></li>`).join('')}</ul></details>` : ''}`).join('')
          : `<p class="acc-empty">Nenhuma conta ainda. Escolha um banco abaixo.</p>`;
        list.querySelectorAll('[data-money]').forEach(inp => {
          const i = +inp.closest('.acc').dataset.i;
          bindMoney(inp, c => { draft[i].abs = c; total(); });
        });
        const used = new Set(draft.map(a => a.brand));
        m.querySelector('#bankChips').innerHTML = BANK_KEYS.filter(k => !used.has(k))
          .map(k => `<button type="button" data-bank="${k}">${logoHtml({ brand: k }, 'sm')}${esc(BRANDS[k].name)}</button>`).join('')
          + `<button type="button" data-bank="" data-color="${PALETTE[draft.length % PALETTE.length]}">${ico('plus', 'width:12px;height:12px')}Outra</button>`;
        total();
        if (focusIdx != null) {
          const row = list.querySelector(`[data-i="${focusIdx}"]`);
          const target = row && (draft[focusIdx].name ? row.querySelector('[data-money]') : row.querySelector('[data-name]'));
          if (target) target.focus();
        }
      };
      list.addEventListener('input', e => {
        if (!e.target.matches('[data-name]')) return;
        const row = e.target.closest('.acc'); const a = draft[+row.dataset.i];
        a.name = e.target.value;
        // Nome digitado igual a um banco conhecido ganha o logo dele
        if (!a.brand || BRANDS[a.brand]?.name !== a.name.trim()) a.brand = brandByName(a.name) || '';
        row.querySelector('[data-icon]').innerHTML = logoHtml(a);
      });
      list.addEventListener('click', e => {
        const row = e.target.closest('.acc'); if (!row) return;
        const i = +row.dataset.i;
        if (e.target.closest('[data-rm]')) { draft.splice(i, 1); draw(); }
        if (e.target.closest('[data-sign]')) { draft[i].neg = !draft[i].neg; draw(); }
        if (e.target.closest('[data-icon]')) pickIcon().then(icon => { if (icon) { draft[i].icon = icon; draw(); } });
      });
      m.querySelector('#bankChips').addEventListener('click', e => {
        const b = e.target.closest('[data-bank]'); if (!b) return;
        const k = b.dataset.bank;
        draft.push({ id: uid(), brand: k, name: k ? BRANDS[k].name : '', color: k ? BRANDS[k].color : PALETTE[draft.length % PALETTE.length], abs: 0, neg: false, balance: 0 });
        draw(draft.length - 1);
      });
      draw();
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        if (draft.some(a => !a.name.trim())) return showErr('Dê um nome para todas as contas.');
        state.accounts = draft.map(a => {
          const typed = a.neg ? -a.abs : a.abs;
          const old = state.accounts.find(x => x.id === a.id);
          // Se o valor não mudou, mantém o ponto de partida (os lançamentos continuam atualizando); se mudou, recomeça daqui
          const keep = old && typed === accBalance(old);
          return { id: a.id, name: a.name.trim(), brand: a.brand || '', icon: a.icon || '', color: a.color,
            balance: keep ? old.balance : typed, updatedAt: keep ? old.updatedAt : todayIso, ...(keep ? (old.balanceAt ? { balanceAt: old.balanceAt } : {}) : { balanceAt: Date.now() }) };
        });
        undoToast('Saldo das contas atualizado', undoSnap);
        commit();
      });
    });
  }

  // Transferência entre as suas contas (ex.: Nubank → Mercado Pago). Guardada em state.transfers (campo opcional).
  function openTransfer() {
    const accs = state.accounts, opts = sel => accs.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
    const recent = (state.transfers || []).filter(t => !t.inv).slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
    const name = id => esc(accs.find(a => a.id === id)?.name || 'conta removida');
    openModal(`<form id="f">${modalHead('Transferir entre contas', 'Move dinheiro de uma conta sua para outra. Não conta como receita nem como despesa.')}

        <div><label class="fl" for="tTo">Para</label><select class="select" id="tTo">${opts(accs[1].id)}</select></div></div>
      ${moneyField('fAmount', 0)}
      <div class="two"><div><label class="fl" for="tDate">Data</label><input type="date" class="input" id="tDate" value="${todayIso}" /></div>
        <div><label class="fl" for="tDesc">Descrição <span style="color:var(--muted);font-weight:500">(opcional)</span></label><input class="input" id="tDesc" maxlength="40" placeholder="Ex.: guardar na reserva" /></div></div>
      ${recent.length ? `<p class="fl">Últimas transferências</p><div id="tList">${recent.map(t => `<div class="last-hint" style="margin-top:4px"><span>${dm(t.date)} · ${name(t.from)} → ${name(t.to)} · ${brl.format(t.amount / 100)}${t.desc ? ` · ${esc(t.desc)}` : ''}</span><button type="button" class="link" data-tdel="${t.id}" style="color:var(--red)">Excluir</button></div>`).join('')}</div>` : ''}
      ${footer(false).replace('>Adicionar<', '>Transferir<')}</form>`, m => {
      bindMoney(m.querySelector('#fAmount'));
      m.querySelector('#tList')?.addEventListener('click', e => {

        const undoSnap = JSON.stringify(state);
        state.transfers = state.transfers.filter(t => t.id !== b.dataset.tdel);
        closeModal(); commit(); undoToast('Transferência excluída', undoSnap);
      });
      m.querySelector('#f').addEventListener('submit', e => {
