:root {
  --font: "Urbanist";
  --bg: #eef0f2;
  --card: #ffffff;
  --ink: #14171c;
  --ink-2: #3b414b;
  --muted: #737a84;
  --line: #eef0f3;
  --field: #f7f8f9;
  --field-line: #e7e9ed;
  --green: #16956a;
  --green-soft: #e3f4ec;
  --blue: #1d5fd6;
  --blue-soft: #e6eefc;
  --red: #d0343c;
  --red-soft: #fce9ea;
  --amber: #c98a12;
  --amber-soft: #fbf1dc;
  --shadow: 0 1px 2px rgba(20, 23, 28, .04), 0 6px 20px rgba(20, 23, 28, .05);
  --shadow-lg: 0 20px 60px rgba(20, 23, 28, .18);
  --r: 16px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1114;
  --card: #181b20;
  --ink: #eef0f3;
  --ink-2: #c5cad2;
  --muted: #868e9a;
  --line: #22262d;
  --field: #1f2329;
  --field-line: #2b3038;
  --green: #34c38f;
  --green-soft: #173229;
  --blue: #5b93f5;
  --blue-soft: #1a2640;
  --red: #f0636a;
  --red-soft: #3a1c1f;
  --amber: #e5b04a;
  --amber-soft: #3a2e14;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* arrastar para os lados troca o mês: não deixa o navegador entender como "voltar página" */
html, body { overscroll-behavior-x: none; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font-family: var(--font), system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 1240px; margin: 0 auto; padding: 28px 28px 60px; }

/* Cabeçalho */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.hello { font-size: .8rem; color: var(--muted); margin: 0 0 2px; }
.title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; }
.ghost-ico { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.ghost-ico:hover { background: var(--card); color: var(--ink); }
.top-right { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; }

/* Botão de tema: sol e lua se alternam girando */
.theme-btn { position: relative; width: 30px; height: 30px; overflow: hidden; }
.theme-btn svg.i { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  transition: transform .5s cubic-bezier(.34, 1.4, .5, 1), opacity .35s ease; }
.theme-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
.theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }
:root[data-theme="dark"] .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
:root[data-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(90deg) scale(.4); }
.theme-btn:hover .moon { transform: rotate(-15deg) scale(1.05); }
:root[data-theme="dark"] .theme-btn:hover .sun { transform: rotate(45deg) scale(1.05); }
:root[data-theme="dark"] .theme-btn:hover .moon { transform: rotate(90deg) scale(.4); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; animation-timing-function: ease; }
.theme-anim, .theme-anim *, .theme-anim *::before { transition: background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease, fill .45s ease, stroke .45s ease !important; }
.theme-anim .theme-btn svg.i { transition: transform .5s cubic-bezier(.34, 1.4, .5, 1), opacity .35s ease !important; }
.bell .dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); }
.month {
  display: flex; align-items: center; gap: 4px;
  background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 4px;
}
.month button { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 6px; display: grid; place-items: center; }
.month button:hover { background: var(--field); color: var(--ink); }
.month .label { min-width: 130px; text-align: center; font-size: .85rem; font-weight: 600; color: var(--ink); cursor: pointer; }
.month .label.away::after { content: "hoje"; display: block; font-size: .62rem; font-weight: 700; color: var(--green); line-height: 1; margin-top: 1px; }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 26px; }
.kpi { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px 20px; min-width: 0; }
.kpi-head { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.kpi-ico { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; }
.kpi-ico svg.i { width: 14px; height: 14px; }
.kpi-label { font-size: .68rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.kpi-value { margin-top: 10px; font-size: 1.45rem; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.receita .kpi-ico { background: var(--green-soft); color: var(--green); } .kpi.receita .kpi-value { color: var(--green); }
.kpi.investir .kpi-ico { background: var(--blue-soft); color: var(--blue); } .kpi.investir .kpi-value { color: var(--blue); }
.kpi.despesas .kpi-ico { background: var(--red-soft); color: var(--red); } .kpi.despesas .kpi-value { color: var(--red); }
.kpi.saldo .kpi-ico { background: var(--field); color: var(--ink-2); }
.kpi.saldo .kpi-value.neg { color: var(--red); }
.kpi-sub { margin-top: 4px; font-size: .75rem; color: var(--muted); }
.adjust {
  margin-left: auto; border: 0; border-radius: 999px;
  background: var(--blue); color: #fff; font-size: .72rem; font-weight: 700;
  padding: 5px 10px; display: inline-flex; align-items: center; gap: 5px;
  box-shadow: 0 4px 10px rgba(29, 95, 214, .25);
}
.adjust svg.i { width: 12px; height: 12px; }
.adjust.dark { background: var(--ink); color: var(--card); box-shadow: 0 4px 10px rgba(20, 23, 28, .18); }

/* Logos */
.logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; overflow: hidden; font-weight: 800; font-size: .72rem; letter-spacing: -.02em; color: #fff; }
.logo svg { width: 58%; height: 58%; fill: currentColor; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.logo.tile { background: #fff; box-shadow: inset 0 0 0 1px rgba(20, 23, 28, .09); }
.logo.tile img { object-fit: contain; box-sizing: border-box; }
.logo.tile svg { width: 60%; height: 60%; color: var(--c); }
/* Tema escuro: quadrado escuro; "dk-inv" = logo preto que vira branco; "dk-keep" = logo que só fica legível no branco */
:root[data-theme="dark"] .logo.tile { background: #262a31; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07); }
:root[data-theme="dark"] .logo.tile.dk-inv svg { color: #fff; }
:root[data-theme="dark"] .logo.tile.dk-inv img { filter: invert(1) hue-rotate(180deg); }
:root[data-theme="dark"] .logo.tile.dk-keep { background: #fff; }
.logo.lg { width: 40px; height: 40px; border-radius: 11px; font-size: .85rem; }
.logo.sm { width: 18px; height: 18px; border-radius: 5px; font-size: .5rem; }
.logo-stack { display: inline-flex; vertical-align: middle; margin-right: 6px; }
.logo-stack .logo { border: 2px solid var(--card); margin-left: -5px; }
.logo-stack .logo:first-child { margin-left: 0; }
.logo-btn { border: 0; padding: 0; background: none; border-radius: 10px; position: relative; }
.logo-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(0,0,0,.35) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z%27/%3E%3C/svg%3E") center / 45% no-repeat; opacity: 0; transition: opacity .15s; }
.logo-btn:hover::after, .logo-btn:focus-visible::after { opacity: 1; }
.row .date .logo { width: 30px; height: 30px; }

/* Assinaturas */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; max-height: 214px; overflow-y: auto; padding: 2px; margin: 0 -2px; }
.svc { display: grid; justify-items: center; gap: 6px; border: 1.5px solid transparent; background: var(--field); border-radius: 12px; padding: 10px 4px 8px; font-size: .7rem; font-weight: 600; color: var(--ink-2); text-align: center; line-height: 1.15; }
.svc:hover { border-color: var(--field-line); }
.svc.on { border-color: var(--green); background: var(--green-soft); }
.svc span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.svc-search { margin-bottom: 8px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.two > div, .three > div { min-width: 0; }
.input[type=month], .input[type=date] { min-width: 0; }
.seg2 button.on[data-src], .seg2 button.on[data-cy] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.picked { display: flex; align-items: center; gap: 12px; background: var(--field); border-radius: 14px; padding: 10px 12px; }
.picked .input { background: var(--card); }
.picked .grow { flex: 1; min-width: 0; }
.link { border: 0; background: none; color: var(--green); font-weight: 700; font-size: .78rem; padding: 4px 0; }

/* Cartões */
.flag { display: inline-block; width: 30px; height: 19px; border-radius: 4px; overflow: hidden; vertical-align: middle; flex: none; box-shadow: 0 0 0 1px rgba(20, 23, 28, .08); background: #fff; }
.flag img { width: 100%; height: 100%; display: block; }
.card-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 3px; white-space: normal; color: var(--muted); font-size: .75rem; font-weight: 500; }
.card-sub .flag { width: 24px; height: 15px; }
.cc-preview { position: relative; aspect-ratio: 1.586; max-width: 300px; margin: 4px auto 6px; border-radius: 16px; padding: 16px 18px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: 0 12px 30px rgba(20, 23, 28, .22); transition: background .3s; }
.cc-preview::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.cc-top, .cc-bottom { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
.cc-name { font-weight: 700; font-size: .95rem; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.cc-num { font-size: .95rem; letter-spacing: .12em; font-variant-numeric: tabular-nums; opacity: .95; }
.cc-chip { width: 34px; height: 25px; border-radius: 6px; background: linear-gradient(135deg, #f6e27a, #cfa93a); position: relative; z-index: 1; }

.flag-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.flag-pick button { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--field-line); background: var(--field); border-radius: 10px; padding: 6px 10px 6px 6px; font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.flag-pick button.on, .bank-chips button.on { border-color: var(--green); background: var(--green-soft); color: var(--ink); }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.status.none { background: var(--field); color: var(--muted); }
.status.open { background: var(--blue-soft); color: var(--blue); }
.status.late { background: var(--red-soft); color: var(--red); }
.fnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--field); border-radius: 12px; padding: 6px; margin-bottom: 10px; }
.fnav button { border: 0; background: var(--card); border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink-2); }
.fnav div { text-align: center; font-size: .8rem; }
.fnav strong { display: block; font-size: .9rem; }
.fnav small { color: var(--muted); }
.movebox { margin-top: 12px; border: 1.5px solid var(--amber-soft); background: color-mix(in srgb, var(--amber-soft) 50%, transparent); border-radius: 12px; padding: 10px 12px; font-size: .8rem; line-height: 1.45; }
.movebox .btn-soft { margin-top: 8px; }
.last-hint { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: .76rem; color: var(--muted); }
@media (max-width: 640px) { .three { grid-template-columns: 1fr 1fr; } .three > :first-child { grid-column: 1 / -1; } }

/* Pago com cartão */
.via { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: .72rem; font-weight: 600; color: var(--muted); vertical-align: middle; white-space: nowrap; }
.via .logo { width: 16px; height: 16px; border-radius: 4px; }
.val.absorbed { color: var(--muted); font-weight: 500; }
.val.absorbed small { display: block; font-size: .68rem; font-weight: 500; }
.pay-pick button .i { width: 14px; height: 14px; }
.inside { margin-top: 12px; background: var(--field); border-radius: 12px; padding: 10px 12px; font-size: .8rem; }
.inside .it { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.inside .it span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inside .it .logo { width: 20px; height: 20px; border-radius: 6px; font-size: .55rem; }
.inside .sum { display: flex; justify-content: space-between; border-top: 1px solid var(--field-line); margin-top: 6px; padding-top: 8px; font-weight: 700; }
.inside .warn { color: var(--amber); font-weight: 600; margin-top: 6px; }

/* Metas e medidores */
.meter { height: 8px; border-radius: 99px; background: var(--field); overflow: hidden; margin-top: 7px; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--green); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.meter.warn i { background: var(--amber); }
.meter.over i { background: var(--red); }
.meter.info i { background: var(--blue); }
.goal-emoji { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--field); font-size: 1.05rem; }
.goal-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: .74rem; color: var(--muted); font-weight: 500; white-space: normal; }
.goal-meta b { color: var(--ink-2); font-weight: 700; }
.row.goal { grid-template-columns: 60px minmax(0, 1fr) 150px 34px; }
.row.goal .name { white-space: normal; }
.emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.emoji-pick button { width: 40px; height: 40px; border-radius: 11px; border: 1.5px solid var(--field-line); background: var(--field); font-size: 1.15rem; }
.emoji-pick button.on { border-color: var(--green); background: var(--green-soft); }
.stat-hero { text-align: center; padding: 8px 0 4px; }
.stat-hero small { display: block; font-size: .78rem; color: var(--muted); }
.stat-hero strong { display: block; font-size: 2rem; font-weight: 800; letter-spacing: -.02em; margin: 2px 0; }
.stat-rows { display: grid; gap: 8px; margin-top: 14px; font-size: .84rem; }
.stat-rows div { display: flex; justify-content: space-between; gap: 10px; }
.stat-rows span { color: var(--muted); }
@media (max-width: 640px) { .row.goal { grid-template-columns: 44px minmax(0, 1fr) 28px; } .row.goal .val { grid-column: 2; text-align: left; } }

.limits { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.limits-h { font-size: .85rem; font-weight: 700; }
.limit-top { display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; }
.limit-top > span:first-child { display: inline-flex; align-items: center; gap: 7px; }
.limit-top .ldot { width: 8px; height: 8px; border-radius: 50%; }
.limit-top small { color: var(--muted); font-weight: 500; }
.limit-sub { font-size: .72rem; color: var(--muted); margin-top: 4px; }
.cat-edit .money { width: 150px; flex: none; padding: 0 10px; }
.cat-edit .money input { padding: 8px 0; }
@media (max-width: 640px) {
  /* celular: cor · nome · excluir na primeira linha, limite embaixo (o ✕ fica junto da categoria dele) */
  .cat-edit { flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .cat-edit:last-child { border-bottom: 0; }
  .cat-edit .input { flex: 1; min-width: 0; }
  .cat-edit .x { order: 1; }
  .cat-edit .money { order: 2; width: calc(100% - 42px); margin-left: 42px; }
}

/* Evolução */
.evo { margin-top: 22px; padding: 18px 20px 20px; position: relative; }
.evo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.evo-head h2 { margin: 0; font-size: .95rem; font-weight: 700; }
.evo-ctl { display: flex; gap: 8px; align-items: center; }
.pills { display: inline-flex; background: var(--field); border-radius: 10px; padding: 3px; }
.pills button { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.pills button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.evo-body { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.evo-legend { display: flex; gap: 16px; font-size: .78rem; color: var(--ink-2); margin-bottom: 6px; }
.evo-legend span { display: inline-flex; align-items: center; gap: 6px; }
.evo-legend i { width: 10px; height: 10px; border-radius: 3px; }
.evo-chart { position: relative; }
.evo-chart svg { display: block; width: 100%; overflow: visible; }
.evo-chart .grid-line { stroke: var(--line); stroke-width: 1; }
.evo-chart .tick { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.evo-chart .xl { fill: var(--muted); font-size: 11px; }
.evo-chart .xl.cur { fill: var(--ink); font-weight: 700; }
.evo-chart .hit { fill: transparent; cursor: pointer; }
.evo-chart .band { fill: var(--ink); opacity: 0; transition: opacity .12s; }
.evo-chart g.m:hover .band, .evo-chart g.m:focus .band { opacity: .04; }
.evo-chart g.m:focus { outline: none; }
.evo-tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-lg); border-radius: 10px; padding: 8px 10px; font-size: .78rem; min-width: 150px; opacity: 0; z-index: 5; }
.evo-tip.on { opacity: 1; }
.evo-tip .tt { font-weight: 700; margin-bottom: 4px; }
.evo-tip div.r { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.evo-tip div.r span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.evo-tip div.r span i { width: 12px; height: 2px; border-radius: 2px; }
.evo-tip b { font-variant-numeric: tabular-nums; }
.insights { display: grid; gap: 10px; }
.ins { display: flex; gap: 10px; align-items: flex-start; font-size: .84rem; line-height: 1.4; background: var(--field); border-radius: 12px; padding: 10px 12px; }
.ins .ic { font-size: 1rem; line-height: 1.3; }
.ins b { font-weight: 700; }
.ins small { display: block; color: var(--muted); font-size: .75rem; }
.evo-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.evo-table th, .evo-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.evo-table th:first-child, .evo-table td:first-child { text-align: left; }
.evo-table th { color: var(--muted); font-weight: 600; }
@media (max-width: 980px) { .evo-body { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .evo { padding: 14px 12px 16px; } }

/* Escolha de conta/cartão */
.bank-chips.pay-pick { display: block; }
.pay-pick > .pay-sec:first-child { margin-bottom: 2px; }
.pay-h { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 6px; }
.pay-sec { display: flex; flex-wrap: wrap; gap: 6px; }
.pay-sec.cc { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.bank-chips .cc-btn { border-radius: 12px; padding: 7px 10px 7px 7px; gap: 10px; text-align: left; min-width: 0; }
.mini-cc { position: relative; width: 50px; height: 32px; border-radius: 6px; flex: none; box-shadow: 0 2px 5px rgba(0, 0, 0, .18); }
.mini-cc .logo { position: absolute; left: 4px; top: 4px; width: 14px; height: 14px; border-radius: 4px; }
.mini-cc .flag { position: absolute; right: 3px; bottom: 3px; width: 20px; height: 13px; border-radius: 3px; }
.cc-txt { display: grid; min-width: 0; line-height: 1.2; }
.cc-txt b { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-txt small { font-size: .7rem; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.via .flag { width: 20px; height: 13px; border-radius: 3px; margin-left: 2px; }

/* Visão geral */
.overview { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.overview[hidden], #mainGrid[hidden] { display: none; }
.ov { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px 20px; min-width: 0; position: relative; }
.ov h3 { margin: 0 0 2px; font-size: .95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.ov .ov-sub { margin: 0 0 12px; font-size: .78rem; color: var(--muted); }
.ov-forecast { grid-column: span 8; }
.ov-cal { grid-column: span 4; }
.ov-where { grid-column: span 4; }
.ov-cards { grid-column: span 4; }
.ov-goals { grid-column: span 4; }
.ov-link { border: 0; background: none; color: var(--green); font-weight: 700; font-size: .78rem; padding: 0; margin-left: auto; }
.fc-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 10px; }
.fc-stats div small { display: block; font-size: .72rem; color: var(--muted); }
.fc-stats div b { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
.fc-alert { display: flex; gap: 8px; align-items: flex-start; font-size: .82rem; background: var(--red-soft); color: var(--ink); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
.fc-alert.ok { background: var(--green-soft); }
.fc-chart { position: relative; }
.fc-chart svg { display: block; width: 100%; overflow: visible; }
.fc-chart .grid-line { stroke: var(--line); stroke-width: 1; }
.fc-chart .zero { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.fc-chart .tick, .fc-chart .xl { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.fc-chart .cross { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.fc-chart .dot { opacity: 0; }
.fc-tip { position: absolute; top: 0; pointer-events: none; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-lg); border-radius: 10px; padding: 8px 10px; font-size: .78rem; min-width: 170px; max-width: 240px; display: none; z-index: 5; }
.fc-tip .tt { font-weight: 700; margin-bottom: 3px; }
.fc-tip .ev { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); }
.fc-tip .ev b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .wd { font-size: .64rem; font-weight: 700; color: var(--muted); text-align: center; padding-bottom: 4px; text-transform: uppercase; }
.cal button { border: 0; background: transparent; border-radius: 9px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .78rem; color: var(--ink-2); padding: 0; position: relative; }
.cal button:hover { background: var(--field); }
.cal button.today { background: var(--ink); color: var(--card); font-weight: 700; }
.cal button.sel { box-shadow: inset 0 0 0 1.5px var(--green); }
.cal button.other { visibility: hidden; }
/* calendário largo (tablet): dias com altura fixa em vez de quadrados enormes */
@media (min-width: 560px) and (max-width: 980px) { .cal button { aspect-ratio: auto; height: 50px; } }
.cal .dots { display: flex; gap: 2px; height: 5px; }
.cal .dots i { width: 5px; height: 5px; border-radius: 50%; }
.cal-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 7px; max-height: 190px; overflow-y: auto; }
.cal-list .ev { display: flex; align-items: center; gap: 8px; font-size: .8rem; }

.cal-list .ev .logo, .cal-list .ev .ic { width: 22px; height: 22px; border-radius: 6px; font-size: .62rem; flex: none; }
.cal-list .ev .ic { display: grid; place-items: center; background: var(--field); }
.cal-list .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.cal-list .v.in { color: var(--green); }
.cal-legend { display: flex; gap: 12px; font-size: .7rem; color: var(--muted); margin-top: 8px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
.cal-legend i { width: 7px; height: 7px; border-radius: 50%; }
.ov .donut { width: 170px; height: 170px; }
.ov-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .84rem; }
.ov-row:last-child { border-bottom: 0; }
.ov-row .grow { flex: 1; min-width: 0; }
.ov-row .grow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-row .grow small { color: var(--muted); font-size: .72rem; }
.ov-row .meter { margin-top: 5px; height: 6px; }
.ov-row .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-empty { color: var(--muted); font-size: .82rem; padding: 18px 0; text-align: center; }
@media (max-width: 980px) { .ov-forecast, .ov-cal, .ov-where, .ov-cards, .ov-goals { grid-column: span 12; } }
@media (min-width: 981px) and (max-width: 1180px) { .ov-where, .ov-cards, .ov-goals { grid-column: span 6; } .ov-goals { grid-column: span 12; } }

/* Lançamento rápido */
.fab { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 20; width: 58px; height: 58px; border: 0; border-radius: 18px; background: var(--green); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 28px rgba(22, 149, 106, .38); transition: transform .15s; }
.fab:hover { transform: translateY(-2px); }
.fab:active { transform: scale(.95); }
.fab svg.i { width: 26px; height: 26px; stroke-width: 2.4; }
.qa-input { font-size: 1.05rem; padding: 14px 15px; }
.qa-preview { margin-top: 10px; background: var(--field); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; font-size: .84rem; min-height: 44px; }
.qa-preview .l { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.qa-preview .l span:first-child { color: var(--muted); }
.qa-preview .l b { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.qa-preview .big { font-size: 1.3rem; font-weight: 800; }
.qa-hint { font-size: .74rem; color: var(--muted); margin-top: 6px; line-height: 1.45; }
.qa-hint code { background: var(--field); padding: 1px 5px; border-radius: 5px; font-family: inherit; font-weight: 600; color: var(--ink-2); }
.favs { display: flex; flex-wrap: wrap; gap: 6px; }
.fav { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--field-line); background: var(--card); border-radius: 999px; padding: 6px 6px 6px 12px; font-size: .8rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.fav:hover { border-color: var(--green); }
.fav .x { padding: 2px; }
.fav .x svg.i { width: 12px; height: 12px; }
@media (max-width: 640px) { .fab { width: 56px; height: 56px; } .app { padding-bottom: 96px; } }

/* Tela de bloqueio */
html.locked .app, html.locked .fab, html.locked #overlay, html.locked .toast { visibility: hidden; }
.lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; place-items: center; padding: 24px; }
html.locked .lock { display: grid; }
.lock-box { width: 100%; max-width: 300px; text-align: center; margin: auto; }
/* tela baixa (celular deitado, celular pequeno): rola e o teclado fica menor, pra alcançar o 0 e o apagar */
html.locked .lock { place-items: normal; overflow-y: auto; }
.lock-box img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 14px; }
.lock-box h2 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 700; }
.lock-box p { margin: 0; color: var(--muted); font-size: .85rem; min-height: 1.3em; }
.lock-box p.err { color: var(--red); }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 22px 0 26px; }
.pin-dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--muted); transition: background .1s, border-color .1s; }
.pin-dots i.on { background: var(--ink); border-color: var(--ink); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; justify-content: center; }
.keypad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); font-size: 1.5rem; font-weight: 600; color: var(--ink); display: grid; place-items: center; }
.keypad button:active { transform: scale(.94); background: var(--field); }
.keypad button.ghost { background: transparent; box-shadow: none; font-size: 1rem; color: var(--muted); }
.keypad button svg.i { width: 26px; height: 26px; }
.lock-forgot { margin-top: 22px; border: 0; background: none; color: var(--muted); font-size: .8rem; text-decoration: underline; }
@media (max-height: 620px) {
  .pin-dots { margin: 14px 0 16px; }
  .lock-box img { width: 44px; height: 44px; margin-bottom: 8px; }
  .keypad { grid-template-columns: repeat(3, 58px); gap: 10px; }
  .keypad button { width: 58px; height: 58px; font-size: 1.25rem; }
}
/* celular deitado: informações à esquerda, teclado à direita */
@media (max-height: 460px) and (orientation: landscape) {
  .lock-box { max-width: 560px; display: grid; grid-template-columns: 1fr auto; column-gap: 32px; align-items: center; align-content: center; }
  .lock-box > * { grid-column: 1; }
  .lock-box .keypad { grid-column: 2; grid-row: 1 / span 6; }
  .lock-box img { justify-self: center; }
}
.pin-input { letter-spacing: .5em; text-align: center; font-size: 1.3rem; }

/* Contas */
.acc { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 30px; gap: 8px; align-items: center; margin-top: 8px; }
.acc .logo { width: 34px; height: 34px; }
.acc .input { padding: 9px 11px; }
.acc .money { padding: 0 10px 0 4px; }
.acc .money input { padding: 9px 0; text-align: right; }
.sign { border: 0; background: transparent; color: var(--muted); font-size: .8rem; font-weight: 700; padding: 6px; border-radius: 8px; white-space: nowrap; }
.sign:hover { background: var(--card); color: var(--ink); }
.acc.neg .sign, .acc.neg .money input { color: var(--red); }
.bank-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bank-chips button { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--field-line); background: var(--field); border-radius: 999px; padding: 6px 11px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.bank-chips button:hover { border-color: var(--muted); }
.bank-chips .logo { margin-left: -5px; }
.acc-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.acc-total span { color: var(--muted); font-size: .85rem; }
.acc-total strong { font-size: 1.3rem; font-weight: 800; }
.acc-note { grid-column: 1 / -1; margin: 2px 0 4px 42px; font-size: .72rem; color: var(--muted); }
.acc-note summary { cursor: pointer; list-style: none; }
.acc-note summary::-webkit-details-marker { display: none; }
.acc-note .acc-more { color: var(--green); font-weight: 700; margin-left: 4px; }
.acc-note[open] .acc-more { display: none; }
.acc-note ul { list-style: none; margin: 6px 0 2px; padding: 0; display: grid; gap: 3px; max-height: 180px; overflow-y: auto; }
.acc-note li { display: flex; justify-content: space-between; gap: 10px; }
.acc-note li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-note li b { font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; flex: none; }
.acc-note li b.in { color: var(--green); }
.acc-empty { color: var(--muted); font-size: .85rem; padding: 6px 0 4px; }
@media (max-width: 640px) { .acc { grid-template-columns: 30px minmax(0, 1fr) 120px 26px; gap: 6px; } .acc .logo { width: 30px; height: 30px; } .row .date .logo { width: 28px; height: 28px; } }

/* Abas */
.tabs { display: inline-flex; gap: 4px; margin-bottom: 18px; }
.tabs button {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 10px;
  font-size: .85rem; font-weight: 600; color: var(--muted);
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }

/* Tabela */
.table-card { padding: 18px 20px 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; position: relative; }
.card-head h2 { margin: 0; font-size: .95rem; font-weight: 700; }
.head-actions { display: flex; gap: 8px; }
.btn-soft {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 7px 12px; font-size: .82rem; font-weight: 600; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
}
.btn-soft:hover { background: var(--field); }
.btn-soft.on { border-color: var(--green); color: var(--green); }

.row {
  display: grid; grid-template-columns: 60px minmax(0, 1fr) 120px 130px 34px;
  gap: 12px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--line);
  font-size: .88rem;
}
.row.head { font-size: .72rem; color: var(--muted); font-weight: 600; padding-top: 4px; padding-bottom: 8px; }
.row.head .sort { border: 0; background: none; padding: 0; color: inherit; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.row .date { color: var(--muted); font-size: .8rem; }
.row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.legend li[data-catpick] { cursor: pointer; border-radius: 8px; transition: opacity .15s; }
.legend li[data-catpick]:hover { background: var(--field); }
.legend li.dim { opacity: .4; }
.legend li.on .lname { font-weight: 700; }
/* nome + selo do cartão/conta em até 2 linhas, sem esconder o selo com "…" */
.row .name > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; white-space: normal; overflow-wrap: anywhere; }
.row .val { text-align: right; font-weight: 600; white-space: nowrap; }
.row.head .val { font-weight: 600; }
.row .edit { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; display: grid; place-items: center; }
.row .edit:hover { background: var(--field); color: var(--ink); }
.row:not(.head):hover { background: color-mix(in srgb, var(--field) 60%, transparent); }
.row .tag-m { display: none; }

.tag {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
  padding: 3px 9px; border-radius: 7px; font-size: .74rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.status { border: 0; cursor: pointer; }
.status.paid { background: var(--green-soft); color: var(--green); }
.status.pending { background: var(--amber-soft); color: var(--amber); }

.total { display: flex; justify-content: flex-end; align-items: baseline; gap: 10px; padding: 14px 6px 2px; }
.total span { font-size: .78rem; color: var(--muted); }
.total strong { font-size: 1.15rem; font-weight: 800; }
.pos { color: var(--green); } .negc { color: var(--red); }

.empty { text-align: center; color: var(--muted); font-size: .85rem; padding: 22px 0 14px; }
.empty .btn-soft { margin-top: 10px; }

/* Rosca */
.chart-card { padding: 22px 20px; }
.donut-wrap { display: grid; place-items: center; padding: 6px 0 14px; position: relative; }
.donut { width: 210px; height: 210px; transform: rotate(-90deg); }
.donut circle { transition: stroke-dasharray .5s ease, stroke-dashoffset .5s ease; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center small { font-size: .72rem; color: var(--muted); }
.donut-center strong { font-size: 1.05rem; font-weight: 800; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: .85rem; min-width: 0; }
.legend .ldot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.legend .pct { font-size: .7rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; flex: none; }
.legend .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .lval { display: block; font-size: .7rem; color: var(--muted); font-weight: 500; line-height: 1.2; }
.chart-empty { display: grid; place-items: center; gap: 10px; color: var(--muted); font-size: .85rem; padding: 50px 0; text-align: center; }
.chart-empty svg.i { width: 22px; height: 22px; }
.manage { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 16px auto 0; border: 0; background: transparent; color: var(--ink-2); font-size: .82rem; font-weight: 600; padding: 8px 12px; border-radius: 10px; }
.manage:hover { background: var(--card); }
.manage[hidden], .pop[hidden] { display: none; }

/* Popovers */
.pop {
  position: absolute; z-index: 15; right: 0; top: calc(100% + 6px);
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lg);
  padding: 14px; width: 280px; border: 1px solid var(--line);
}
.pop[hidden] { display: none; }
.pop h4 { margin: 0 0 10px; font-size: .85rem; }
.note { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: .84rem; }
.note:first-of-type { border-top: 0; }
.note div { flex: 1; min-width: 0; }
.note small { display: block; color: var(--muted); font-size: .75rem; }
.note .mini { border: 0; background: var(--green-soft); color: var(--green); font-size: .72rem; font-weight: 700; padding: 5px 8px; border-radius: 8px; white-space: nowrap; }

/* Modal */
.overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(40, 46, 54, .45); backdrop-filter: blur(2px);
  display: grid; place-items: center; padding: 16px;
  animation: fade .15s ease;
}
.overlay[hidden] { display: none; }
.modal {
  width: 100%; max-width: 440px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow-lg);
  padding: 22px 24px 20px; animation: pop .18s cubic-bezier(.2, .9, .3, 1.2);
}
.modal.wide { max-width: 760px; }
.imp-top { display: grid; gap: 8px; margin-bottom: 10px; }
.imp-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); margin: 8px 0; }
.imp-sum b { color: var(--ink); }
.imp-list { max-height: 46vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
.imp-row { display: grid; grid-template-columns: 26px 52px minmax(0, 1fr) 150px 110px; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: .82rem; }
.imp-row:last-child { border-bottom: 0; }
/* extratos grandes: o navegador só desenha as linhas que estão aparecendo */
.imp-row { content-visibility: auto; contain-intrinsic-size: auto 49px; }
@media (max-width: 640px) { .imp-row { contain-intrinsic-size: auto 84px; } }
.imp-row.off { opacity: .45; }
/* ===== Resumo do mês (impressão / PDF) ===== */
#report { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  :root, :root[data-theme="dark"] { color-scheme: light !important; background: #fff !important; }
  html, body { background: #fff !important; }
  body > *:not(#report) { display: none !important; }
  #report { display: block !important; visibility: visible !important; }
}
#report { color: #111827; font-size: 10pt; line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
#report * { box-sizing: border-box; }
.r-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #111827; padding-bottom: 8px; margin-bottom: 14px; }
.r-head p { margin: 0; font-size: 9pt; color: #6b7280; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.r-head h1 { margin: 2px 0 0; font-size: 20pt; font-weight: 700; letter-spacing: -.01em; }

.r-head small { color: #6b7280; font-size: 8.5pt; }
.r-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.r-kpis-3 { grid-template-columns: repeat(3, 1fr); margin: 0 0 8px; }
.r-kpi { border: 1px solid #e5e7eb; border-radius: 10px; padding: 9px 11px; break-inside: avoid; }
.r-kpi span { display: block; font-size: 8pt; color: #6b7280; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.r-kpi strong { display: block; font-size: 14pt; font-weight: 700; margin: 2px 0 1px; font-variant-numeric: tabular-nums; }
.r-kpi small { display: block; font-size: 7.5pt; color: #6b7280; }
.r-kpi small.up { color: #15803d; } .r-kpi small.down { color: #b91c1c; }
.r-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.r-grid.r-top { grid-template-columns: 1.12fr .88fr; }
.r-sec { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; break-inside: avoid; }
.r-sec h2 { margin: 0 0 8px; font-size: 10.5pt; font-weight: 700; }
.r-where { display: flex; gap: 12px; align-items: center; }
.r-donut { width: 104px; height: 104px; flex: none; }
.r-dl { font-size: 3px; fill: #6b7280; } .r-dv { font-size: 3.6px; font-weight: 700; fill: #111827; }
.r-cats { flex: 1; min-width: 0; }
.r-cat { display: grid; grid-template-columns: 8px minmax(0, 1fr) 28px 64px; gap: 6px; align-items: center; font-size: 8.5pt; padding: 2px 0; }
.r-cat .dot { width: 8px; height: 8px; border-radius: 50%; }
.r-cat .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-cat .p { color: #6b7280; text-align: right; }
.r-cat b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: #f3f4f6; border-radius: 3px; overflow: hidden; display: block; }
.bar i { display: block; height: 100%; border-radius: 3px; background: #15803d; }
.r-evo { display: flex; gap: 10px; height: 110px; align-items: stretch; border-bottom: 1px solid #e5e7eb; }
.r-evo .col { flex: 1; display: flex; flex-direction: column; align-items: center; }
.r-evo .bars { flex: 1; width: 100%; display: flex; gap: 2px; align-items: flex-end; justify-content: center; }
.r-evo .bars i { width: 12px; border-radius: 3px 3px 0 0; min-height: 1px; }
.r-evo i.in, .r-leg i.in { background: #16a34a; } .r-evo i.out, .r-leg i.out { background: #dc2626; }
.r-evo .col:not(.cur) i { opacity: .45; }
.r-evo span { font-size: 7.5pt; color: #6b7280; padding-top: 3px; }
.r-evo .cur span { color: #111827; font-weight: 700; }
.r-leg { display: flex; gap: 10px; font-size: 7.5pt; color: #6b7280; margin-top: 6px; }
.r-leg .grow { flex: 1; }
.r-leg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.r-tips { margin-top: 8px; }
.r-tips .ins { font-size: 8.5pt; padding: 4px 0; margin: 0; border: 0; border-top: 1px solid #f3f4f6; border-radius: 0; background: none; color: #111827; display: block; }
.r-tips .ins b { color: #111827; }
.r-tips .ins small { display: block; color: #6b7280; font-size: 7.5pt; }
#report table { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
#report td { padding: 4px 4px; border-top: 1px solid #f3f4f6; vertical-align: baseline; }

@media (max-width: 640px) {

.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

.money { display: flex; align-items: center; gap: 8px; background: var(--field); border: 1.5px solid var(--field-line); border-radius: 12px; padding: 0 13px; transition: border-color .15s, box-shadow .15s; }

.check {
  display: flex; gap: 12px; align-items: flex-start; margin-top: 12px;

}
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--field-line); background: var(--card); flex: none; margin-top: 1px; display: grid; place-items: center; transition: all .15s; }
