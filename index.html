  const brandByName = name => Object.keys(BRANDS).find(k => BRANDS[k].name.toLowerCase() === String(name || '').trim().toLowerCase());
  function lightColor(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.72;
  }
  // item: { brand?, icon? (imagem própria), name, color? }
  const DARK_LOGO = { chatgpt: 'inv', uber: 'inv', c6: 'inv', disney: 'keep', btg: 'keep', bb: 'keep' };
  function logoHtml(item, cls = '') {
    if (item.icon) return `<span class="logo ${cls}"><img src="${item.icon}" alt="" /></span>`;
    const b = BRANDS[item.brand] || BRANDS[brandByName(item.name)];
    const color = b ? b.color : (item.color || '#64748b');
    const fg = lightColor(color) ? '#14171c' : '#fff';
    // Logo colorido oficial num quadrado branco, como ícone de app
    // No tema escuro o quadrado fica escuro; DARK_LOGO diz quais logos precisam de ajuste (ver CSS)
    const key = b && Object.keys(BRANDS).find(k => BRANDS[k] === b);
    const dk = DARK_LOGO[key] ? ' dk-' + DARK_LOGO[key] : '';
    if (b && b.img) return `<span class="logo tile${dk} ${cls}"><img src="${b.img}" alt="" style="padding:${b.full ? 0 : b.pad * 100}%" /></span>`;
    // Ícone de uma cor só: desenhado na cor da marca; marcas pretas viram brancas no tema escuro
    if (b && b.path) {
      const c = lightColor(color) ? '#14171c' : color;
      const isDark = parseInt(c.slice(1, 3), 16) + parseInt(c.slice(3, 5), 16) + parseInt(c.slice(5, 7), 16) < 150;
      return `<span class="logo tile${isDark ? ' dk-inv' : dk} ${cls}" style="--c:${c}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${b.path}"/></svg></span>`;
    }
    const txt = b ? b.mono : (String(item.name || '?').trim().charAt(0).toUpperCase() || '?');
    return `<span class="logo ${cls}" style="background:${color};color:${fg}">${esc(txt)}</span>`;
  }
  // Escolhe uma imagem e devolve como data URL quadrada de 96px (pra caber no armazenamento do navegador)
  function pickIcon() {
    return new Promise(resolve => {
      const input = $('#iconFile');
      input.value = '';
      input.onchange = () => {
        const file = input.files[0]; if (!file) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas'); c.width = c.height = 96;
          const side = Math.min(img.width, img.height);
          c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 96, 96);
          URL.revokeObjectURL(img.src);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = () => { toast('Não consegui abrir essa imagem'); resolve(null); };
        img.src = URL.createObjectURL(file);
      };
      input.click();
    });
  }

  const FONTS = ['Urbanist', 'Outfit', 'Sora', 'Parkinsans', 'Syne'];
  const PALETTE = ['#2fa3dc', '#c1262f', '#2a34b5', '#35c46a', '#f0a02f', '#8b5cf6', '#e0529a', '#12a89a', '#f26b1d', '#64748b'];

  const DEFAULT_CATEGORIES = [
    { id: 'r-salario', kind: 'receita', name: 'Salário', color: '#16956a' },
    { id: 'r-extra', kind: 'receita', name: 'Renda extra', color: '#2fa3dc' },
    { id: 'r-rend', kind: 'receita', name: 'Rendimentos', color: '#2a34b5' },
    { id: 'r-outros', kind: 'receita', name: 'Outros', color: '#64748b' },
    { id: 'd-mercado', kind: 'despesa', name: 'Mercado', color: '#2fa3dc' },
    { id: 'd-contas', kind: 'despesa', name: 'Contas', color: '#2a34b5' },
    { id: 'd-carro', kind: 'despesa', name: 'Carro', color: '#c1262f' },
    { id: 'd-saude', kind: 'despesa', name: 'Saúde', color: '#35c46a' },
    { id: 'd-comida', kind: 'despesa', name: 'Comida', color: '#f26b1d' },
    { id: 'd-lazer', kind: 'despesa', name: 'Lazer', color: '#f0a02f' },
    { id: 'd-casa', kind: 'despesa', name: 'Casa', color: '#8b5cf6' },
    { id: 'd-outros', kind: 'despesa', name: 'Outros', color: '#64748b' },
  ];

  // ================= Dados =================
  const KEY = 'orcamento:v2';
  const UI_KEY = 'orcamento:ui';

  function blank() {
    return { categories: DEFAULT_CATEGORIES.map(c => ({ ...c })), receitas: [], variaveis: [], fixas: [], invest: {}, paid: {}, investments: [], accounts: [], assinaturas: [], cards: [], faturas: {}, metas: [], cdi: { rate: 14.9, date: '', source: 'padrao' } };
  }

  // Conserta dados antigos ou incompletos (backup velho, sincronização, versões anteriores) sem jogar nada fora:
  // listas que viraram null voltam a ser listas, datas/valores inválidos ganham um valor seguro, itens sem id ganham um.
  function normalize(raw) {
    const b = blank();
    const s = { ...b, ...(raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}) };
    const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
    for (const k of ['categories', 'receitas', 'variaveis', 'fixas', 'investments', 'accounts', 'assinaturas', 'cards', 'metas'])
      s[k] = Array.isArray(s[k]) ? s[k].filter(isObj) : b[k];
    for (const k of ['invest', 'paid', 'faturas']) if (!isObj(s[k])) s[k] = {};
    s.cdi = { ...b.cdi, ...(isObj(s.cdi) ? s.cdi : {}) };
    if (!(+s.cdi.rate > 0)) s.cdi.rate = b.cdi.rate; else s.cdi.rate = +s.cdi.rate;
    const num = v => Number.isFinite(+v) ? Math.round(+v) : 0;
    const day = (v, d = 1) => Math.min(31, Math.max(1, Math.round(+v) || d));
    const fixIso = v => {
      const m = typeof v === 'string' && v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : null;
    };
    const isKey = v => typeof v === 'string' && /^\d{4}-\d{2}$/.test(v);
    const createdKey = x => x.created && isFinite(new Date(x.created)) ? monthOf(isoOf(new Date(x.created))) : curKeyNow();
    const withId = x => { if (x.id === undefined || x.id === null || x.id === '') x.id = uid(); else x.id = String(x.id); };
    [...s.receitas, ...s.variaveis].forEach(x => {
      withId(x); x.amount = num(x.amount);
      if (x.skip !== undefined) x.skip = Array.isArray(x.skip) ? x.skip.filter(isKey) : [];
      x.date = fixIso(x.date) || (x.created && isFinite(new Date(x.created)) ? isoOf(new Date(x.created)) : todayIso);
    });
    [...s.fixas, ...s.assinaturas, ...s.cards].forEach(x => {
      withId(x);
      if (!isKey(x.start)) x.start = createdKey(x);
      if (x.end !== undefined && !isKey(x.end)) delete x.end;
      if (x.skip !== undefined) x.skip = Array.isArray(x.skip) ? x.skip.filter(isKey) : [];
    });
    s.fixas.forEach(x => { x.amount = num(x.amount); x.day = day(x.day); x.desc = String(x.desc ?? ''); });
    s.assinaturas.forEach(x => { x.amount = num(x.amount); x.day = day(x.day); x.month = Math.min(12, Math.max(1, Math.round(+x.month) || 1)); x.name = String(x.name ?? ''); });
    s.cards.forEach(x => { x.closeDay = day(x.closeDay, 3); x.dueDay = day(x.dueDay, 10); x.limit = num(x.limit); x.name = String(x.name ?? 'Cartão'); });
    s.accounts.forEach(x => { withId(x); x.balance = num(x.balance); x.name = String(x.name ?? 'Conta'); if (x.updatedAt && !fixIso(x.updatedAt)) delete x.updatedAt; });
    s.investments.forEach(x => { withId(x); x.balance = num(x.balance); x.rate = +x.rate >= 0 ? +x.rate : 0; x.name = String(x.name ?? 'Investimento');
      if (!['cdi', 'pre', 'none'].includes(x.type)) x.type = 'none'; x.updatedAt = fixIso(x.updatedAt) || todayIso; });
    s.metas.forEach(x => { withId(x); x.target = num(x.target); x.saved = num(x.saved); x.name = String(x.name ?? 'Meta');
      if (!Array.isArray(x.investments)) x.investments = []; if (x.deadline && !isKey(x.deadline)) delete x.deadline; });
    s.categories.forEach(x => { withId(x); if (!['receita', 'despesa'].includes(x.kind)) x.kind = 'despesa'; x.name = String(x.name ?? 'Categoria');
      if (!/^#[0-9a-f]{6}$/i.test(x.color || '')) x.color = '#64748b'; });
    for (const k of Object.keys(s.paid)) if (!Array.isArray(s.paid[k])) s.paid[k] = [];
    for (const k of Object.keys(s.invest)) s.invest[k] = Math.min(100, Math.max(0, +s.invest[k] || 0));
    for (const [id, fs] of Object.entries(s.faturas)) {
      if (!isObj(fs)) { delete s.faturas[id]; continue; }
      for (const [k, f] of Object.entries(fs)) { if (!isObj(f)) delete fs[k]; else f.amount = num(f.amount); }
    }
    if (s.favorites !== undefined && !Array.isArray(s.favorites)) s.favorites = [];
    if (s.transfers !== undefined) s.transfers = (Array.isArray(s.transfers) ? s.transfers.filter(isObj) : [])
      .map(t => ({ ...t, id: String(t.id || uid()), amount: Math.abs(num(t.amount)), date: fixIso(t.date) || todayIso }));
    if (s.subIgnore !== undefined && !Array.isArray(s.subIgnore)) s.subIgnore = [];
    for (const k of ['snapshots', 'received', 'subPrice']) if (s[k] !== undefined && !isObj(s[k])) delete s[k];
    return s;
  }
  function curKeyNow() { return monthOf(todayIso); }

  function load() {
    let raw = null;
    try {
      raw = localStorage.getItem(KEY);
      if (raw) return normalize(JSON.parse(raw));
      // Migra dados da primeira versão do app, se existirem
      const old = JSON.parse(localStorage.getItem('grana:v1') || 'null');
      if (old && Array.isArray(old.transactions) && old.transactions.length) return migrate(old);
    } catch (_) {
      // Dados ilegíveis: guarda uma cópia antes de começar do zero, pra não perder nada de vez
      if (raw) { try { localStorage.setItem(KEY + ':corrompido', raw); loadWarning = true; } catch (_) {} }
    }
    return blank();
  }
  let loadWarning = false;

  function migrate(old) {
    const s = blank();
    const byName = (kind, name) => {
      let c = s.categories.find(x => x.kind === kind && x.name.toLowerCase() === name.toLowerCase());
      if (!c) { c = { id: uid(), kind, name, color: PALETTE[s.categories.length % PALETTE.length] }; s.categories.push(c); }
      return c.id;
    };
    const names = { mercado: 'Mercado', comida: 'Comida', casa: 'Casa', transporte: 'Transporte', contas: 'Contas', saude: 'Saúde', lazer: 'Lazer', compras: 'Compras', educacao: 'Educação', outros: 'Outros', salario: 'Salário', extra: 'Renda extra', investimentos: 'Rendimentos', presente: 'Presente', 'outros-in': 'Outros' };
    old.transactions.forEach(t => {
      const item = { id: t.id || uid(), date: t.date, amount: t.amount, desc: t.desc || names[t.category] || '' };
      if (t.type === 'in') s.receitas.push({ ...item, category: byName('receita', names[t.category] || 'Outros') });
      else s.variaveis.push({ ...item, category: byName('despesa', names[t.category] || 'Outros') });
    });
    return s;
  }

  let state = load();
  let applyingRemote = false;
  // quiet = dado calculado pelo próprio app (retrato do patrimônio, taxa do CDI): salva aqui, mas não conta como
  // mudança sua. Senão, só de abrir o app num dia novo este aparelho pareceria "mais novo" que a nuvem e
  // mandaria os dados antigos por cima do que você lançou no outro aparelho.
  function save(quiet = false) {
    if (!applyingRemote && !quiet) state.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (_) { toast('Não foi possível salvar neste navegador'); }
    if (!applyingRemote && !quiet && typeof scheduleSync === 'function') scheduleSync();
  }

  let ui = { tab: 'geral', hidden: false, theme: null, sortAsc: false, font: 'Urbanist' };
  try { ui = { ...ui, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}') }; } catch (_) {}
  // preferências de uma versão antiga/estranha voltam ao padrão (aba que não existe, tema inválido…)
  if (!['geral', 'receita', 'fixa', 'variavel', 'assin', 'cartoes', 'invest', 'metas'].includes(ui.tab)) ui.tab = 'geral';
  if (!['light', 'dark'].includes(ui.theme)) ui.theme = null;
  if (![6, 12].includes(ui.evoRange)) delete ui.evoRange;
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (_) {} };

  let view = { month: mkey(today.getFullYear(), today.getMonth()), query: '', cat: '', allMonths: false };

  const cat = id => state.categories.find(c => c.id === id);
  const catsOf = kind => state.categories.filter(c => c.kind === kind);
  const money = c => ui.hidden ? 'R$ •••••' : brl.format(c / 100);

  // ================= Itens do mês =================
  const activeIn = (item, key) => item.start <= key && (!item.end || key <= item.end);

  // Cache de cálculos válido só durante um desenho da tela (render): a mesma conta (ex.: gastos de um mês) é pedida
  // dezenas de vezes por tela; fora do render nada fica guardado, então nunca fica desatualizado.
  let memo = null;
  const cached = (k, compute) => {
    if (!memo) return compute();
    if (memo.has(k)) return memo.get(k);
    const v = compute(); memo.set(k, v); return v;
  };
  const withMemo = fn => (...args) => { if (memo) return fn(...args); memo = new Map(); try { return fn(...args); } finally { memo = null; } };

  function receitasOf(key) { return cached('r' + key, () => receitasOfRaw(key)); }
  function receitasOfRaw(key) {
    return state.receitas
      .filter(r => r.recurring ? activeIn({ start: monthOf(r.date), end: r.end }, key) && !(r.skip || []).includes(key) : monthOf(r.date) === key)
      .map(r => ({ ...r, shownDate: r.recurring ? dateIn(key, +r.date.slice(8)) : r.date,
        // recorrente "a receber": cada mês é marcado como recebido separadamente (state.received[mês])
        pending: r.pending && !(r.recurring && ((state.received || {})[key] || []).includes(r.id)) }));
  }
  const variaveisOf = key => cached('v' + key, () => {
    // durante o render, separa os gastos por mês uma vez só em vez de varrer a lista inteira a cada mês pedido
    const list = memo ? (cached('vidx', () => { const m = new Map(); for (const v of state.variaveis) { const k = monthOf(v.date); if (!m.has(k)) m.set(k, []); m.get(k).push(v); } return m; }).get(key) || [])
      : state.variaveis.filter(v => monthOf(v.date) === key);
    return list.map(v => ({ ...v, shownDate: v.date }));
  });
  // Despesa fixa pertence ao mês "key" (conta nas despesas dele); se "vence no mês seguinte", a data de pagamento é no próximo mês
  const fixasOf = key => cached('f' + key, () => state.fixas.filter(f => activeIn(f, key) && !(f.skip || []).includes(key))
    .map(f => ({ ...f, key, shownDate: dateIn(f.dueNext ? addMonths(key, 1) : key, f.day), paid: !!(state.paid[key] || []).includes(f.id) })));
  const daysUntil = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(todayIso + 'T12:00:00')) / 864e5);
  // Situação da despesa fixa: no cartão (já está na fatura), paga, a vencer ou atrasada
  const fixaState = f => f.payCard && payCardOf(f) ? 'card' : f.paid ? 'paid' : daysUntil(f.shownDate) < 0 ? 'late' : 'due';

  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  // Assinaturas ativas no mês; as anuais só são cobradas no mês de renovação
  const assinaturasOf = key => cached('a' + key, () => state.assinaturas.filter(a => activeIn(a, key) && !(a.skip || []).includes(key) && (a.cycle !== 'anual' || a.month === +key.slice(5)))
    .map(a => ({ ...a, shownDate: dateIn(key, a.day) })));
  const perMonth = a => a.cycle === 'anual' ? Math.round(a.amount / 12) : a.amount;

  // Cartões ativos no mês, com a fatura daquele mês (vence no dia de vencimento do cartão)
  const cardsOf = key => state.cards.filter(c => activeIn(c, key))
    .map(c => ({ ...c, fatura: (state.faturas[c.id] || {})[key] || null, shownDate: dateIn(key, c.dueDay) }));

  function investPct(key) {
    const keys = Object.keys(state.invest).filter(k => k <= key).sort();
    return keys.length ? state.invest[keys[keys.length - 1]] : 0;
  }

  // ----- Saldo das contas -----
  // Saldo atual = saldo informado + movimentos ligados à conta depois da data informada (até hoje):
  // receitas recebidas nela, gastos pagos com ela (Pix/débito/boleto) e faturas pagas com ela
  function accountMoves(acc) { return cached('am' + acc.id + acc.updatedAt + acc.balance, () => accountMovesRaw(acc)); }
  function accountMovesRaw(acc) {
    const from = acc.updatedAt || todayIso, out = [];
    if (from > todayIso) return out;
    // Conta o que aconteceu depois do saldo informado. No mesmo dia, só o que foi lançado depois do momento em que você
    // informou o saldo (balanceAt); sem esse horário (dados antigos), o mesmo dia fica de fora, como antes.
    const inRange = (iso, ts) => iso <= todayIso && (iso > from || (iso === from && !!acc.balanceAt && !!ts && ts > acc.balanceAt));
    for (let k = addMonths(monthOf(from), -1); k <= curKey(); k = addMonths(k, 1)) {
      receitasOf(k).filter(r => r.payAccount === acc.id && !r.pending && inRange(r.shownDate, !r.imported && r.created))
        .forEach(r => out.push({ date: r.shownDate, amount: r.amount, label: r.desc || 'Receita' }));
      [...variaveisOf(k).map(i => [i, i.desc || cat(i.category)?.name]), ...fixasOf(k).map(i => [i, i.desc]), ...assinaturasOf(k).map(i => [i, i.name])]
        .filter(([i]) => i.payAccount === acc.id && !i.payCard && inRange(i.shownDate, !i.imported && i.created))
        .forEach(([i, label]) => out.push({ date: i.shownDate, amount: -i.amount, label: label || 'Despesa' }));
    }
    for (const card of state.cards) for (const [k, f] of Object.entries(state.faturas[card.id] || {}))
      if (f.paid && f.payAccount === acc.id && f.paidAt && inRange(f.paidAt, f.paidTs)) out.push({ date: f.paidAt, amount: -f.amount, label: `Fatura ${card.name} (${monthName(k)})` });
    // transferências entre as suas contas: saem de uma e entram na outra (não são receita nem despesa)
    const accName = id => state.accounts.find(a => a.id === id)?.name || 'outra conta';
    for (const t of state.transfers || []) if (inRange(t.date, t.created)) {
      if (t.from === acc.id) out.push({ date: t.date, amount: -t.amount, label: t.inv ? t.desc : `Transferência para ${accName(t.to)}` });
      if (t.to === acc.id) out.push({ date: t.date, amount: t.amount, label: t.inv ? t.desc : `Transferência de ${accName(t.from)}` });
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
  const accBalance = acc => acc.balance + accountMoves(acc).reduce((s, m) => s + m.amount, 0);

  // ----- Datas da fatura -----
  // Cada fatura é guardada pelo mês em que VENCE. Se o fechamento é antes do vencimento no mês, fecha no mesmo mês;
  // senão (ex.: fecha 26, vence 5) fecha no mês anterior.
  function faturaDates(card, key) {
    const due = dateIn(key, card.dueDay);
    const close = card.closeDay < card.dueDay ? dateIn(key, card.closeDay) : dateIn(addMonths(key, -1), card.closeDay);
    return { close, due };
  }
  // Em qual fatura (mês de vencimento) cai uma compra feita em "iso": compra até o dia do fechamento entra na fatura
  // que fecha naquele mês; depois do fechamento, na do mês seguinte
  function faturaKeyFor(card, iso) {
    let closeMonth = monthOf(iso);
    if (+iso.slice(8) > Math.min(card.closeDay, daysIn(closeMonth))) closeMonth = addMonths(closeMonth, 1);
    return card.closeDay < card.dueDay ? closeMonth : addMonths(closeMonth, 1);
  }
  // Situação pelas datas: aberta (ainda juntando compras), fechada (a pagar), vencida ou paga
  function faturaState(card, key, f) {
    if (f && f.paid) return 'paid';
    const { close, due } = faturaDates(card, key);
    if (todayIso <= close) return 'open';
    if (todayIso <= due) return 'closed';
    return 'late';
  }
  const FSTATE = { paid: ['paid', 'Paga'], open: ['open', 'Aberta'], closed: ['pending', 'A pagar'], late: ['late', 'Vencida'] };
  const dm = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
  const curKey = () => monthOf(todayIso);
  // Qual fatura mostrar no mês visto. No mês atual, mostra a fatura "da vez": a deste mês se ainda não venceu
  // ou está vencida sem pagar; se já foi paga (ou nem foi lançada e já venceu), a próxima.
  function focusKey(card, key) {
    if (key !== curKey()) return key;
    const f = (state.faturas[card.id] || {})[key];
    if (todayIso <= faturaDates(card, key).due) return key;
    if (f && !f.paid) return key;
    return addMonths(key, 1);
  }

  // Item pago com cartão (assinatura, despesa fixa ou variável): entra na fatura em que a data cai. Se essa fatura
  // já foi lançada (e o cartão conta nas despesas), o valor já está dentro dela e não soma de novo.
  const payCardOf = item => item.payCard ? state.cards.find(c => c.id === item.payCard) : null;
  function inFatura(item, key) {
    const c = payCardOf(item);
    if (!c || !activeIn(c, key) || c.count === false) return false;
    const f = (state.faturas[c.id] || {})[faturaKeyFor(c, item.shownDate)];
    return !!(f && f.amount > 0);
  }
  // Itens pagos no cartão que caem na fatura que vence em "key": cobrados neste mês, no anterior ou até dois meses antes
  // (cartão que fecha depois do dia do vencimento, ex.: fecha 26 e vence 5: compra de 28/12 vai para a fatura de fevereiro)
  function itemsOnCard(cardId, key) { return cached('ic' + cardId + key, () => itemsOnCardRaw(cardId, key)); }
  function itemsOnCardRaw(cardId, key) {
    const card = state.cards.find(c => c.id === cardId);
    const out = [];
    for (const k of [addMonths(key, -2), addMonths(key, -1), key]) out.push(
      ...fixasOf(k).map(i => ({ ...i, kind: 'Despesa fixa', label: i.desc })),
      ...assinaturasOf(k).map(i => ({ ...i, kind: 'Assinatura', label: i.name })),
      ...variaveisOf(k).map(i => ({ ...i, kind: i.installment ? `Parcela ${i.installment.i}/${i.installment.n}` : 'Despesa variável', label: (i.desc || cat(i.category)?.name || 'Despesa') + (i.installment ? ` (${i.installment.i}/${i.installment.n})` : '') })));
    return out.filter(i => i.payCard === cardId && card && faturaKeyFor(card, i.shownDate) === key);
  }
  // Prévia da fatura: soma do que já caiu nela (compras até hoje e parcelas)
  const faturaPreview = (cardId, key) => itemsOnCard(cardId, key).filter(i => i.shownDate <= todayIso || i.installment).reduce((s, i) => s + i.amount, 0);
  // Quanto do limite está comprometido: faturas lançadas e não pagas + compras/parcelas que ainda vão entrar em faturas não lançadas
  function cardUsed(card) {
    let used = 0;
    for (let i = 0, k = focusKey(card, curKey()); i < 48; i++, k = addMonths(k, 1)) {
      const f = (state.faturas[card.id] || {})[k];
      used += f ? (f.paid ? 0 : f.amount) : faturaPreview(card.id, k);
    }
    return used;
  }
  const countable = key => i => !inFatura(i, key);

  function totals(key) { return cached('t' + key, () => totalsRaw(key)); }
  function totalsRaw(key) {
    const rec = receitasOf(key);
    const receita = rec.filter(r => !r.pending).reduce((s, r) => s + r.amount, 0);
    const aReceber = rec.filter(r => r.pending).reduce((s, r) => s + r.amount, 0);
    const fixas = fixasOf(key).filter(countable(key)).reduce((s, f) => s + f.amount, 0);
    const variaveis = variaveisOf(key).filter(countable(key)).reduce((s, v) => s + v.amount, 0);
    const assinaturas = assinaturasOf(key).filter(countable(key)).reduce((s, a) => s + a.amount, 0);
    const faturas = cardsOf(key).filter(c => c.count !== false).reduce((s, c) => s + (c.fatura ? c.fatura.amount : 0), 0);
    const pct = investPct(key);
    const investir = Math.round(receita * pct / 100);
    const despesas = fixas + variaveis + assinaturas + faturas;
    return { receita, aReceber, fixas, variaveis, assinaturas, faturas, despesas, pct, investir, saldo: receita - investir - despesas };
  }

  // ================= Render =================
  const render = withMemo(renderNow);
  function renderNow() {
    const [y, m] = view.month.split('-').map(Number);
    const lbl = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    $('#monthLabel').textContent = lbl.charAt(0).toUpperCase() + lbl.slice(1);
    // fora do mês atual: mostra "hoje" (tocar no nome do mês volta pro mês atual)
    const away = view.month !== curKey();
    $('#monthLabel').classList.toggle('away', away);
    $('#monthLabel').title = away ? 'Voltar para o mês atual' : '';
    $('#monthLabel').setAttribute('aria-label', `${$('#monthLabel').textContent}${away ? ' (tocar volta para o mês atual)' : ''}`);

    const t = totals(view.month);
    $('#kReceita').textContent = money(t.receita);
    $('#kReceitaSub').textContent = t.aReceber ? `+ ${money(t.aReceber)} a receber` : '';
    $('#kInvestir').textContent = money(t.investir);
    $('#kInvestirSub').textContent = t.pct ? `${fmtPct(t.pct)} da receita` : 'Quanto guardar este mês';
    $('#kDespesas').textContent = money(t.despesas);
    // cada "rótulo valor" fica junto na mesma linha
    $('#kDespesasSub').innerHTML = [['Fixas', t.fixas], ['Variáveis', t.variaveis], ['Assinaturas', t.assinaturas], ['Faturas', t.faturas]]
      .filter(([, v]) => v).map(([n, v]) => `<span style="display:inline-block">${n} <span style="white-space:nowrap">${esc(money(v))}</span></span>`).join(' · ');
    const signed = c => (c < 0 && !ui.hidden ? '–' : '') + money(Math.abs(c));
    if (state.accounts.length) {
      // Com contas cadastradas, o saldo é o dinheiro real somado de todas elas
      const total = state.accounts.reduce((s, a) => s + accBalance(a), 0);
      $('#kSaldo').textContent = signed(total);
      $('#kSaldo').classList.toggle('neg', total < 0);
      $('#kSaldo').title = state.accounts.map(a => `${a.name}: ${brl.format(accBalance(a) / 100)}`).join('\n');
      $('#kSaldoSub').innerHTML = `<span class="logo-stack">${state.accounts.slice(0, 5).map(a => logoHtml(a, 'sm')).join('')}</span>sobra do mês <span style="white-space:nowrap">${esc(signed(t.saldo))}</span>`;
    } else {
      $('#kSaldo').textContent = signed(t.saldo);
      $('#kSaldo').classList.toggle('neg', t.saldo < 0);
      $('#kSaldo').title = '';
      $('#kSaldoSub').textContent = t.saldo < 0 ? 'Gastos acima da receita' : t.receita ? 'Livre para usar' : 'Toque em Contas para somar seus bancos';
    }

    $('#eyeBtn').innerHTML = ico(ui.hidden ? 'eye-off' : 'eye');
    document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('active', b.dataset.tab === ui.tab); b.setAttribute('aria-selected', b.dataset.tab === ui.tab); });
    // celular: a barra de abas rola até a aba ativa (ex.: ao ir para Metas pelo link da Visão geral)
    { const strip = $('#tabs'), act = strip.querySelector('.active');
      if (act && strip.scrollWidth > strip.clientWidth) {
        const sr = strip.getBoundingClientRect(), ar = act.getBoundingClientRect();
        const dx = ar.left < sr.left ? ar.left - sr.left - 12 : ar.right > sr.right ? ar.right - sr.right + 12 : 0;
        if (dx) strip.scrollBy({ left: dx, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      } }
    $('#manageBtn').hidden = ['fixa', 'assin', 'cartoes', 'metas'].includes(ui.tab);
    $('#manageBtn').innerHTML = ui.tab === 'invest'
      ? `${ico('invest')}CDI ${fmtRate(state.cdi.rate)} ao ano${state.cdi.date ? ` · ${state.cdi.date}` : ''} ${ico('pencil', 'width:12px;height:12px')}`
      : `${ico('tag')}Gerenciar categorias`;
    $('#filterBtn').classList.toggle('on', !!(view.query || view.cat));

    const geral = ui.tab === 'geral';
    $('#overview').hidden = !geral;
    $('#mainGrid').hidden = geral;
    // a Evolução mede a largura do gráfico: desenhando antes da tabela, o navegador não precisa calcular o layout duas vezes
    renderEvo();
    if (geral) renderOverview(); else { renderTable(); renderChart(); }
    renderBell();
  }

  const fmtPct = p => (Math.round(p * 10) / 10).toLocaleString('pt-BR') + '%';

  // Busca em todos os meses (Receita e Despesa variável): com texto ou categoria no filtro e a opção marcada
  const searchAll = () => view.allMonths && !!(view.query.trim() || view.cat) && ['receita', 'variavel'].includes(ui.tab);
  function rowsForTab() {
    const q = view.query.trim().toLowerCase();
    let rows = searchAll() ? (ui.tab === 'receita' ? state.receitas : state.variaveis).map(r => ({ ...r, shownDate: r.date }))
      : ui.tab === 'receita' ? receitasOf(view.month) : ui.tab === 'fixa' ? fixasOf(view.month) : variaveisOf(view.month);
    if (q) rows = rows.filter(r => (r.desc || '').toLowerCase().includes(q));
    if (view.cat && ui.tab !== 'fixa') rows = rows.filter(r => r.category === view.cat);
    const dir = ui.sortAsc ? 1 : -1;
    return rows.sort((a, b) => dir * (a.shownDate.localeCompare(b.shownDate) || (a.created || 0) - (b.created || 0)));
  }

  function tagHtml(c) {
    if (!c) return `<span class="tag" style="background:var(--field);color:var(--muted)">Sem categoria</span>`;
    return `<span class="tag" style="background:${c.color}1f;color:${c.color}">${esc(c.name)}</span>`;
  }

  function renderTable() {
    if (ui.tab === 'invest') return renderInvestTable();
    if (ui.tab === 'assin') return renderAssinTable();
    if (ui.tab === 'cartoes') return renderCardsTable();
    if (ui.tab === 'metas') return renderMetasTable();
    const titles = { receita: 'Receita', fixa: 'Despesas fixas', variavel: 'Despesas variáveis' };
    $('#tableTitle').textContent = titles[ui.tab];
    const all = searchAll();
    const found = rowsForTab(), rows = all ? found.slice(0, 300) : found;
    const filtered = !!(view.query || view.cat);
    if (all) $('#tableTitle').textContent += ' · todos os meses';

    if (!rows.length) {
      const msg = filtered ? 'Nada encontrado com esse filtro.'
        : { receita: 'Sem receita no período.', fixa: 'Nenhuma despesa fixa cadastrada.', variavel: 'Sem despesas variáveis no período.' }[ui.tab];
      $('#table').innerHTML = `<div class="empty">${msg}${filtered ? '' : `<br><button class="btn-soft" data-add>${ico('plus')}Adicionar</button>`}</div>`;
      return;
    }

    const isFixa = ui.tab === 'fixa';
    const head = `<div class="row head">
      <button class="sort" id="sortBtn" title="Ordenar por data">${isFixa ? 'Venc.' : 'Data'} ${ico('sort', 'width:11px;height:11px')}</button>
      <span>Nome</span><span class="cat">${isFixa ? 'Status' : 'Categoria'}</span><span class="val">Valor</span><span></span></div>`;

    const body = rows.map(r => {
      let label, extra = '';
      if (isFixa && fixaState(r) === 'card') {
        label = `<span class="tag status paid" title="Paga no cartão: já está na fatura">No cartão</span>`;
      } else if (isFixa) {
        const st = { paid: ['paid', 'Paga'], due: ['open', 'A vencer'], late: ['late', 'Atrasada'] }[fixaState(r)];
        label = `<button class="tag status ${st[0]}" data-pay="${r.id}" title="${r.paid ? 'Marcar como não paga' : 'Marcar como paga'}">${st[1]}</button>`;
      } else if (ui.tab === 'receita' && r.pending) {
        label = `<button class="tag status pending" data-receive="${r.id}" title="Marcar como recebido">A receber</button>`;
      } else {
        label = tagHtml(cat(r.category));
      }
      if (r.installment) extra = `<small>${r.installment.i}/${r.installment.n}</small>`;
      if (r.recurring) extra = `<small>↻ mensal</small>`;
      extra += viaHtml(r);
      const sign = ui.tab === 'receita' ? '+ ' : '- ';
      const cls = ui.tab === 'receita' ? (r.pending ? '' : 'pos') : '';
      return `<div class="row">
        <span class="date num">${isFixa ? (r.dueNext ? `${ddmm(r.shownDate)}<small style="display:block;font-size:.66rem">mês seguinte</small>` : 'Dia ' + pad(r.day)) : ddmm(r.shownDate)}${all ? `<small style="display:block;font-size:.66rem">${r.shownDate.slice(0, 4)}</small>` : ''}</span>
        <div class="name"><span>${esc(r.desc || cat(r.category)?.name || '—')}${extra}</span><div class="tag-m">${label}</div></div>
        <span class="cat">${label}</span>
        ${ui.tab === 'receita' ? `<span class="val num ${cls}">${ui.hidden ? '' : sign}${money(r.amount)}</span>` : valHtml(r, view.month, (ui.hidden ? '' : sign) + money(r.amount))}
        <button class="edit" data-edit="${r.id}" aria-label="Editar">${ico('pencil', 'width:14px;height:14px')}</button>
      </div>`;
    }).join('');

    const sum = found.filter(r => !r.pending).reduce((s, r) => s + r.amount, 0);
    const inside = ui.tab === 'receita' || all ? 0 : rows.filter(r => inFatura(r, view.month)).reduce((s, r) => s + r.amount, 0);
    const foot = (all && found.length > rows.length ? `<div class="yield"><span>Mostrando os ${rows.length} mais recentes de ${found.length} encontrados</span></div>` : '')
      + `<div class="total"><span>Total${filtered ? ' filtrado' : ''}${all ? ` (${found.length} em todos os meses)` : ''}</span>
      <strong class="num ${ui.tab === 'receita' ? 'pos' : 'negc'}">${ui.hidden ? '' : ui.tab === 'receita' ? '+ ' : '- '}${money(sum)}</strong></div>`
      + (inside ? `<div class="yield"><span>Já dentro das faturas dos cartões (não soma de novo)</span><span class="num">${money(inside)}</span></div>` : '')
      + (isFixa && !filtered ? (() => {
        // quanto das contas fixas do mês já foi pago (ou está no cartão) e quanto falta
        const left = rows.filter(r => ['due', 'late'].includes(fixaState(r))).reduce((s, r) => s + r.amount, 0);
        return `<div class="yield"><span>Já pago ${money(sum - left)}</span><span>${left ? `Falta pagar <strong class="num" style="color:var(--amber)">${money(left)}</strong>` : 'Tudo pago ✓'}</span></div>`;
      })() : '');
    $('#table').innerHTML = head + body + foot;
  }

  function renderChart() {
    if (ui.tab === 'invest') return renderInvestChart();
    if (ui.tab === 'assin') return renderAssinChart();
    if (ui.tab === 'cartoes') return renderCardsChart();
    if (ui.tab === 'metas') return renderMetasChart();
    let groups = [];
    const key = view.month;
    if (ui.tab === 'fixa') {
      groups = fixasOf(key).map((f, i) => ({ name: f.desc || 'Sem nome', color: PALETTE[i % PALETTE.length], value: f.amount }));
    } else {
      const src = ui.tab === 'receita' ? receitasOf(key).filter(r => !r.pending) : variaveisOf(key);
      const sums = new Map();
      src.forEach(r => sums.set(r.category, (sums.get(r.category) || 0) + r.amount));
      groups = [...sums].map(([id, value]) => { const c = cat(id); return { id: id || '', name: c?.name || 'Sem categoria', color: c?.color || '#94a3b8', value }; });
    }
    groups = groups.filter(g => g.value > 0).sort((a, b) => b.value - a.value);
    const total = groups.reduce((s, g) => s + g.value, 0);

    const extra = ui.tab === 'variavel' ? limitsHtml(key) : '';
    if (!total) {
      const msg = { receita: 'Sem receita neste mês ainda', fixa: 'Sem despesas fixas ainda', variavel: 'Sem despesas neste mês ainda' }[ui.tab];
      $('#chart').innerHTML = `<div class="chart-empty">${ico('pie')}<span>${msg}</span></div>` + extra;
      return;
    }

    const label = { receita: 'Receita', fixa: 'Fixas', variavel: 'Variáveis' }[ui.tab];
    $('#chart').innerHTML = donutHtml(groups, total, label) + extra;
  }

  function donutHtml(groups, total, label) {
    const gap = groups.length > 1 ? 0.8 : 0;
    let offset = 0;
    const arcs = groups.map(g => {
      const len = g.value / total * 100;
      const arc = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${g.color}" stroke-width="5.2"
        stroke-dasharray="${Math.max(len - gap, 0.01)} ${100 - Math.max(len - gap, 0.01)}" stroke-dashoffset="${-offset}"><title>${esc(g.name)}: ${brl.format(g.value / 100)}</title></circle>`;
      offset += len;
      return arc;
    }).join('');

    return `
      <div class="donut-wrap">
        <svg class="donut" viewBox="0 0 42 42">${arcs}</svg>
        <div class="donut-center"><small>${label}</small><strong class="num">${money(total)}</strong></div>
      </div>
      <ul class="legend">${groups.map(g => {
        const pct = Math.round(g.value / total * 100);
        // com id de categoria: tocar filtra a lista por ela (tocar de novo tira o filtro)
        const pick = g.id !== undefined && g.id !== '' ? ` data-catpick="${esc(g.id)}" role="button" tabindex="0" title="Filtrar por ${esc(g.name)}" class="${view.cat === g.id ? 'on' : view.cat ? 'dim' : ''}"`
          : g.go ? ` data-go="${g.go}" data-catpick="" role="button" tabindex="0" title="Ver ${esc(g.name)}"` : '';
        return `<li${pick}><span class="ldot" style="background:${g.color}"></span><span class="pct" style="background:${g.color}1f;color:${g.color}">${pct}%</span><span class="lname" title="${esc(g.name)}">${esc(g.name)}<small class="lval num">${money(g.value)}</small></span></li>`;
      }).join('')}</ul>`;
  }

  // ================= Visão geral =================
  // Eventos do mês (entradas e saídas com data): usados no calendário e na previsão
  function monthEvents(key) {
    const ev = [];
    const cardLogo = c => logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color });
    receitasOf(key).forEach(r => ev.push({ date: r.shownDate, amount: r.amount, dir: 'in', label: r.desc || cat(r.category)?.name || 'Receita', icon: '💰', done: !r.pending && r.shownDate <= todayIso, ref: 'r:' + r.id }));
    fixasOf(key).filter(f => fixaState(f) !== 'card').forEach(f => ev.push({ date: f.shownDate, amount: f.amount, dir: 'out', label: f.desc, icon: '📌', done: f.paid, ref: 'f:' + f.id }));
    assinaturasOf(key).filter(a => !a.payCard).forEach(a => ev.push({ date: a.shownDate, amount: a.amount, dir: 'out', label: a.name, logo: logoHtml(a), done: a.shownDate <= todayIso, ref: 'a:' + a.id }));
    variaveisOf(key).filter(v => !v.payCard).forEach(v => ev.push({ date: v.shownDate, amount: v.amount, dir: 'out', label: v.desc || cat(v.category)?.name || 'Despesa', icon: '🧾', done: v.shownDate <= todayIso, ref: 'v:' + v.id }));
    cardsOf(key).filter(c => c.fatura).forEach(c => ev.push({ date: c.shownDate, amount: c.fatura.amount, dir: 'out', label: `Fatura ${c.name}`, logo: cardLogo(c), done: c.fatura.paid, fatura: true, ref: 'c:' + c.id + ':' + key }));
    return ev;
  }

  // Previsão: saldo das contas hoje + o que ainda vai entrar/sair nos próximos 30 dias
  function forecast() {
    const start = state.accounts.reduce((s, a) => s + accBalance(a), 0);
    const end = (() => { const d = new Date(todayIso + 'T12:00:00'); d.setDate(d.getDate() + 30); return isoOf(d); })();
    const evs = [curKey(), addMonths(curKey(), 1), addMonths(curKey(), -1)].flatMap(monthEvents)
      .filter(e => e.date > todayIso && e.date <= end);
    // contas atrasadas e ainda não pagas saem "hoje" (as ligadas a uma conta já saíram do saldo na data delas)
    const lateFixas = [addMonths(curKey(), -1), curKey()].flatMap(fixasOf).filter(f => fixaState(f) === 'late' && !f.payAccount)
      .map(f => ({ date: todayIso, amount: f.amount, dir: 'out', label: f.desc + ' (atrasada)', icon: '📌' }));
    const lateFat = [addMonths(curKey(), -1), curKey()].flatMap(k => cardsOf(k).filter(c => c.fatura && !c.fatura.paid && c.shownDate <= todayIso))
      .map(c => ({ date: todayIso, amount: c.fatura.amount, dir: 'out', label: `Fatura ${c.name} (vencida)`, logo: logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color }) }));
    // Faturas que vencem na janela e ainda não foram lançadas: entra a prévia (o que já está no cartão)
    const prevFat = [curKey(), addMonths(curKey(), 1), addMonths(curKey(), 2)].flatMap(k => cardsOf(k).filter(c => !c.fatura)
      .map(c => ({ c, k, due: faturaDates(c, k).due, amount: faturaPreview(c.id, k) })))
      .filter(x => x.amount > 0 && x.due > todayIso && x.due <= end)
      .map(({ c, due, amount }) => ({ date: due, amount, dir: 'out', label: `Fatura ${c.name} (prévia)`, logo: logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color }) }));
    const all = [...lateFixas, ...lateFat, ...prevFat, ...evs];
    const days = [];
    let bal = start;
    for (let d = new Date(todayIso + 'T12:00:00'), i = 0; i <= 30; i++, d.setDate(d.getDate() + 1)) {
      const iso = isoOf(d);
      const todays = all.filter(e => e.date === iso);
      bal += todays.reduce((s, e) => s + (e.dir === 'in' ? e.amount : -e.amount), 0);
      days.push({ iso, bal, events: todays });
    }
    return { start, days };
  }

  function renderOverview() {
    const el = $('#overview');
    el.innerHTML = `
      <div class="ov ov-forecast" id="ovForecast"></div>
      <div class="ov ov-cal" id="ovCal"></div>
      <div class="ov ov-where" id="ovWhere"></div>
      <div class="ov ov-cards" id="ovCards"></div>
      <div class="ov ov-goals" id="ovGoals"></div>`;
    renderForecast(); renderCalendar(); renderWhere(); renderOvCards(); renderOvGoals();
    el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { ui.tab = b.dataset.go; view.cat = ''; saveUi(); fillFilter(); render(); }));
    // categoria no gráfico "Para onde vai": abre Despesa variável filtrada por ela
    el.querySelectorAll('#ovWhere [data-catpick]:not([data-go])').forEach(li => li.addEventListener('click', () => {
      ui.tab = 'variavel'; saveUi(); fillFilter(); view.cat = li.dataset.catpick; $('#fCat').value = view.cat; render(); scrollTo({ top: $('#tabs').offsetTop - 10, behavior: 'smooth' });
    }));
    el.querySelector('[data-pdf]')?.addEventListener('click', () => printReport());
  }

  function renderForecast() {
    const box = $('#ovForecast');
    if (!state.accounts.length) {
      box.innerHTML = `<h3>Próximos 30 dias</h3><p class="ov-sub">Previsão do saldo dia a dia</p>
        <div class="ov-empty">Cadastre suas contas em <b>Saldo → Contas</b> pra ver quanto vai ter em cada dia.<br><button class="btn-soft" id="fcAcc" style="margin-top:10px">Cadastrar contas</button></div>`;
      box.querySelector('#fcAcc').onclick = openAccounts;
      return;
    }
    const { start, days } = forecast();
    const endBal = days[days.length - 1].bal;
    const min = days.reduce((m, d) => d.bal < m.bal ? d : m, days[0]);
    const firstNeg = days.find(d => d.bal < 0);
    const sgn = c => (c < 0 && !ui.hidden ? '–' : '') + money(Math.abs(c));
    box.innerHTML = `<h3>Próximos 30 dias</h3><p class="ov-sub">Saldo das contas com o que ainda vai entrar e sair</p>
      <div class="fc-stats"><div><small>Hoje</small><b class="num">${sgn(start)}</b></div><div><small>Em ${dm(days[days.length - 1].iso)}</small><b class="num" style="color:${endBal < 0 ? 'var(--red)' : 'inherit'}">${sgn(endBal)}</b></div>
        <div><small>Menor saldo</small><b class="num" style="color:${min.bal < 0 ? 'var(--red)' : 'inherit'}">${sgn(min.bal)}</b> <small style="display:inline">em ${dm(min.iso)}</small></div></div>
      ${firstNeg ? `<div class="fc-alert">⚠️ <span>Em <b>${dm(firstNeg.iso)}</b> o saldo fica negativo${firstNeg.events.length ? ` (${esc(firstNeg.events.filter(e => e.dir === 'out').map(e => e.label).slice(0, 2).join(', '))})` : ''}. Vale adiantar uma entrada ou adiar um gasto.</span></div>`
        : `<div class="fc-alert ok">✓ <span>Seu saldo não fica negativo nos próximos 30 dias.</span></div>`}
      <div class="fc-chart" id="fcChart"></div>`;
    drawForecast(days);
  }

  function drawForecast(days) {
    const wrap = $('#fcChart');
    const W = Math.max(wrap.clientWidth, 280), H = wrap.clientWidth > 600 ? 260 : 190, padL = 46, padB = 22, padT = 10;
    const plotW = W - padL, plotH = H - padB - padT;
    const vals = days.map(d => d.bal);
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    const { step } = niceScale(Math.max(hi - lo, 1));
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step || step;
    const x = i => padL + i / (days.length - 1) * plotW, y = v => padT + (hi - v) / (hi - lo) * plotH;
    const pts = days.map((d, i) => `${x(i).toFixed(1)},${y(d.bal).toFixed(1)}`);
    const ticks = []; for (let t = lo; t <= hi + 1; t += step) ticks.push(t);
    const neg = vals.some(v => v < 0);
    const color = neg ? 'var(--red)' : 'var(--green)';
    const xl = [0, 10, 20, 30].map(i => `<text class="xl" x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === 30 ? 'end' : 'middle'}">${i === 0 ? 'hoje' : dm(days[i].iso)}</text>`).join('');
    // pontos dos dias com movimento (≥ 8px, anel na cor do fundo)
    const marks = days.map((d, i) => d.events.length ? `<circle cx="${x(i)}" cy="${y(d.bal)}" r="3.5" fill="${d.bal < 0 ? 'var(--red)' : color}" stroke="var(--card)" stroke-width="2"/>` : '').join('');
    wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Previsão do saldo nos próximos 30 dias">
      ${ticks.map(t => `<line class="${t === 0 ? 'zero' : 'grid-line'}" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${padL - 8}" y="${y(t) + 3.5}" text-anchor="end">${ui.hidden ? '•' : (t < 0 ? '–' : '') + compact(Math.abs(t))}</text>`).join('')}
      <path d="M${pts[0]} L${pts.join(' L')} L${x(days.length - 1)},${y(Math.max(lo, 0))} L${x(0)},${y(Math.max(lo, 0))} Z" fill="${color}" opacity=".1"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${marks}${xl}
      <line class="cross" id="fcCross" x1="0" x2="0" y1="${padT}" y2="${padT + plotH}"/>
      <circle class="dot" id="fcDot" r="4.5" fill="${color}" stroke="var(--card)" stroke-width="2"/>
      <rect x="${padL}" y="0" width="${plotW}" height="${H}" fill="transparent" id="fcHit" tabindex="0" aria-label="Passe o mouse para ver cada dia"/></svg>
      <div class="fc-tip" id="fcTip"></div>`;
    const hit = wrap.querySelector('#fcHit'), tip = wrap.querySelector('#fcTip'), cross = wrap.querySelector('#fcCross'), dot = wrap.querySelector('#fcDot');
    const show = i => {
      const d = days[i], k = wrap.clientWidth / W;
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.opacity = .6;
      dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(d.bal)); dot.style.opacity = 1;
      tip.innerHTML = `<div class="tt">${new Date(d.iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' })} · <span class="num" style="color:${d.bal < 0 ? 'var(--red)' : 'inherit'}">${(d.bal < 0 && !ui.hidden ? '–' : '') + money(Math.abs(d.bal))}</span></div>`
        + (d.events.length ? d.events.map(e => `<div class="ev"><span>${esc(e.label)}</span><b style="color:${e.dir === 'in' ? 'var(--green)' : 'inherit'}">${e.dir === 'in' ? '+' : '–'}${money(e.amount)}</b></div>`).join('') : '<div class="ev"><span>Sem movimentos</span></div>');
      tip.style.display = 'block';
      const px = x(i) * k, tw = tip.offsetWidth;
      tip.style.left = (px + 12 + tw < wrap.clientWidth ? px + 12 : Math.max(px - tw - 12, 0)) + 'px';
    };
    const hide = () => { tip.style.display = 'none'; cross.style.opacity = 0; dot.style.opacity = 0; };
    const idxAt = ev => { const r = hit.getBoundingClientRect(); return Math.round(Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1) * (days.length - 1)); };
    let cur = 0;
    hit.addEventListener('pointermove', ev => show(cur = idxAt(ev)));
    // toque: mostra o dia tocado (toque não gera "pointermove") e deixa a dica aberta até tocar fora
    hit.addEventListener('pointerdown', ev => show(cur = idxAt(ev)));
    hit.addEventListener('pointerleave', ev => { if (ev.pointerType !== 'touch') hide(); });
    hit.style.touchAction = 'pan-y';   // arrastar o dedo para os lados percorre os dias; para cima/baixo rola a página
    hit.addEventListener('focus', () => show(cur));
    hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') show(cur = Math.min(cur + 1, 30)); if (ev.key === 'ArrowLeft') show(cur = Math.max(cur - 1, 0)); });
  }

      if (k === 'f') { const f = state.fixas.find(x => x.id === id); if (f) openFixa(f); }

          <div class="meter ${i.done ? '' : i.late ? 'over' : 'info'}"><i style="width:${i.pct * 100}%"></i></div></div><span class="amt">${Math.round(i.pct * 100)}%</span></div>`;
