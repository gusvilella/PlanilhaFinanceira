  // CDI: tenta buscar a taxa anual no Banco Central (série 4389 do SGS); se falhar, fica o valor salvo
  async function fetchCdi() {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json', { signal: ctrl.signal });
      const [last] = await res.json();
      const rate = parseFloat(String(last.valor).replace(',', '.'));
      if (!(rate > 0 && rate < 100)) throw new Error('valor');
      state.cdi = { rate, date: last.data.slice(0, 5), source: 'bcb', checked: todayIso };
      save(true); render();
      return true;
    } catch (_) { return false; }
    finally { clearTimeout(timer); }
  }

  function openCdi() {
    const src = state.cdi.source === 'bcb' ? `Buscado no Banco Central em ${state.cdi.date}.` : state.cdi.source === 'manual' ? 'Valor informado por você.' : 'Valor aproximado. Confira e ajuste se precisar.';
    openModal(`<form id="f">${modalHead('Taxa do CDI', 'Usada para estimar quanto seus investimentos rendem.')}
      <label class="fl" for="fCdi">CDI ao ano</label>
      <div class="suffix"><input class="input num" id="fCdi" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="${state.cdi.rate}" /><span>% a.a.</span></div>
      <p class="help" id="cdiHelp">${src}</p>
      <button type="button" class="btn-soft" id="fFetch" style="margin-top:12px">${ico('invest')}Buscar no Banco Central</button>
      ${footer(false).replace('>Adicionar<', '>Salvar<')}</form>`, m => {
      m.querySelector('#fFetch').addEventListener('click', async e => {
        const b = e.currentTarget; b.disabled = true; b.lastChild.textContent = 'Buscando…';
        const ok = await fetchCdi();
        b.disabled = false; b.lastChild.textContent = 'Buscar no Banco Central';
        if (ok) { m.querySelector('#fCdi').value = state.cdi.rate; m.querySelector('#cdiHelp').textContent = `Buscado no Banco Central (${state.cdi.date}).`; }
        else m.querySelector('#cdiHelp').textContent = 'Não consegui acessar o Banco Central agora. Digite a taxa manualmente.';
      });
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const rate = parseFloat(m.querySelector('#fCdi').value);
        if (!(rate > 0 && rate < 100)) return showErr('Digite uma taxa válida, ex.: 14,90.');
        if (rate !== state.cdi.rate) state.cdi = { rate, date: todayIso.slice(8) + '/' + todayIso.slice(5, 7), source: 'manual', checked: todayIso };
        commit(); toast('CDI atualizado');
      });
    });
  }

  // Contas fixas vencendo nos próximos 3 dias (ou vencidas); olha o mês seguinte também, pra virada do mês
  function dueSoon() {
    return [addMonths(curKey(), -1), curKey(), addMonths(curKey(), 1)].flatMap(fixasOf)
      .filter(f => ['due', 'late'].includes(fixaState(f)) && daysUntil(f.shownDate) <= 3)
      .sort((a, b) => a.shownDate.localeCompare(b.shownDate));
  }
  // Assinaturas cobradas hoje ou nos próximos 3 dias (inclusive as do começo do mês seguinte)
  function renewSoon() {
    return [curKey(), addMonths(curKey(), 1)].flatMap(assinaturasOf).map(a => ({ ...a, diff: daysUntil(a.shownDate) }))
      .filter(a => a.diff >= 0 && a.diff <= 3).sort((a, b) => a.diff - b.diff);
  }
  function renderBell() {
    const list = dueSoon();
    const renew = renewSoon();
    const faturasDue = (() => {
      // Faturas lançadas, fechadas e não pagas: vencidas ou vencendo em até 3 dias (olha este mês e o próximo)
      const out = [];
      const dayDiff = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(todayIso + 'T12:00:00')) / 864e5);
      for (const k of [addMonths(curKey(), -1), curKey(), addMonths(curKey(), 1)]) for (const c of cardsOf(k)) {
        if (!c.fatura || c.fatura.paid) continue;
        const st = faturaState(c, k, c.fatura), diff = dayDiff(faturaDates(c, k).due);
        if (st === 'late' || (st === 'closed' && diff <= 3)) out.push({ ...c, fk: k, diff });
      }
      return out.sort((a, b) => a.diff - b.diff);
    })();
    const limAlert = limitsOf(curKey()).filter(l => l.state !== 'ok');
    const found = detectSubs(), prices = priceChanges();
    // Lembrete de backup: dados só neste navegador (sem sincronização) e mais de 30 dias sem backup
    const hasData = state.receitas.length + state.variaveis.length + state.fixas.length > 5;
    if (!ui.firstSeen) { ui.firstSeen = todayIso; saveUi(); }
    const backupDays = -daysUntil(ui.lastBackup || ui.firstSeen);
    const needBackup = !sync && hasData && backupDays > 30;
    // sincronização ligada mas falhando (token vencido, senha trocada…): avisa, senão os aparelhos param de conversar sem ninguém ver
    const syncErr = sync && syncState.error ? syncState.error : '';
    $('#bellDot').hidden = !list.length && !renew.length && !faturasDue.length && !limAlert.length && !found.length && !prices.length && !needBackup && !syncErr;
    const whenTxt = diff => diff < 0 ? `Venceu há ${-diff} dia${diff === -1 ? '' : 's'}` : diff === 0 ? 'Vence hoje' : `Vence em ${diff} dia${diff === 1 ? '' : 's'}`;
    const faturasHtml = faturasDue.length ? `<h4 style="margin-top:12px">Faturas do cartão</h4>` + faturasDue.map(c =>
      `<div class="note" data-bellopen="${c.id}" data-key="${c.fk}" style="cursor:pointer" title="Abrir fatura">${logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color }, 'sm')}<div><strong>${esc(c.name)} · ${monthName(c.fk)}</strong><small style="color:${c.diff < 0 ? 'var(--red)' : ''}">${whenTxt(c.diff)} · ${money(c.fatura.amount)}</small></div><button class="mini" data-bellfat="${c.id}" data-key="${c.fk}">Paguei</button></div>`).join('') : '';
    const limHtml = limAlert.length ? `<h4 style="margin-top:12px">Limites de gastos</h4>` + limAlert.map(l =>
      `<div class="note"><span class="ldot" style="background:${l.color};width:10px;height:10px;border-radius:50%;flex:none"></span><div><strong>${esc(l.name)}</strong><small style="color:${l.state === 'over' ? 'var(--red)' : 'var(--amber)'}">${l.state === 'over' ? `⛔ Passou ${money(l.spent - l.limit)}` : `⚠️ ${Math.round(l.pct * 100)}% usado`} · ${money(l.spent)} de ${money(l.limit)}</small></div></div>`).join('') : '';
    const renewHtml = renew.length ? `<h4 style="margin-top:12px">Assinaturas renovando</h4>` + renew.map(a =>
      `<div class="note">${logoHtml(a, 'sm')}<div><strong>${esc(a.name)}</strong><small>${a.diff === 0 ? 'Cobra hoje' : `Cobra em ${a.diff} dia${a.diff === 1 ? '' : 's'}`} · ${money(a.amount)}</small></div></div>`).join('') : '';
    $('#bellPop').innerHTML = (syncErr ? `<div class="note"><span class="det-ic">☁️</span><div style="flex:1"><strong>Sincronização parada</strong><small style="color:var(--red)">${esc(syncErr)}</small></div><button class="mini" data-bellsync>Tentar</button></div>` : '')
      + (needBackup ? `<div class="note"><span class="det-ic">💾</span><div style="flex:1"><strong>Faça um backup</strong><small>${ui.lastBackup ? `O último foi há ${backupDays} dias.` : 'Seus dados ficam só neste navegador.'} Ou ligue a sincronização.</small></div><button class="mini" data-bellbackup>Backup</button></div>` : '')
      + `<h4${needBackup ? ' style="margin-top:12px"' : ''}>Contas a vencer</h4>` + (list.length ? list.map(f => {
      const diff = daysUntil(f.shownDate);
      const when = diff < 0 ? `Venceu há ${-diff} dia${diff === -1 ? '' : 's'}` : diff === 0 ? 'Vence hoje' : `Vence em ${diff} dia${diff === 1 ? '' : 's'}`;
      return `<div class="note"><div><strong>${esc(f.desc)}</strong><small style="color:${diff < 0 ? 'var(--red)' : ''}">${when} · ${money(f.amount)}</small></div><button class="mini" data-bellpay="${f.id}" data-key="${f.key}">Paguei</button></div>`;
    }).join('') : `<p class="empty" style="padding:6px 0">${faturasDue.length ? 'Nenhuma conta fixa pendente' : 'Tudo em dia por aqui ✓'}</p>`) + faturasHtml + limHtml + renewHtml
      + (found.length || prices.length ? `<h4 style="margin-top:12px">Assinaturas</h4>` : '')
      + (found.length ? `<div class="note"><span class="det-ic">${ico('spark')}</span><div style="flex:1"><strong>${found.length === 1 ? '1 possível assinatura' : `${found.length} possíveis assinaturas`}</strong><small>${esc(found.slice(0, 3).map(d => d.name).join(', '))}</small></div><button class="mini" data-detect>Revisar</button></div>` : '')
      + prices.map(p => `<div class="note">${logoHtml(p.sub, 'sm')}<div style="flex:1"><strong>${esc(p.sub.name)}</strong><small>${priceText(p)}</small></div><button class="mini" data-subprice="${p.sub.id}" data-ok="1">Atualizar</button></div>`).join('');
  }

  // ================= Modal genérico =================
  let onModalClose = null, modalOpener = null, modalDirty = false;
  function openModal(html, setup) {
    // guarda quem abriu a janela, pra devolver o foco a ele ao fechar (teclado e leitor de tela)
    if ($('#overlay').hidden) modalOpener = document.activeElement;
    $('#modal').innerHTML = html;
    modalDirty = false;
    const h = $('#modal').querySelector('h3');
    if (h) { h.id = 'modalTitle'; $('#modal').setAttribute('aria-labelledby', 'modalTitle'); } else $('#modal').removeAttribute('aria-labelledby');
    $('#overlay').hidden = false;
    onModalClose = null;
    setup && setup($('#modal'));
    const first = $('#modal').querySelector('[autofocus]') || $('#modal').querySelector('input:not([type=checkbox]):not([type=date]), select');
    // Foca o primeiro campo, a menos que a pessoa já tenha clicado em outro
    if (first && matchMedia('(pointer: fine)').matches) setTimeout(() => { if (!$('#modal').contains(document.activeElement)) first.focus(); }, 30);
  }
  function closeModal() {
    if ($('#overlay').hidden) return;
    $('#overlay').hidden = true;
    onModalClose && onModalClose();
    if (modalOpener && document.contains(modalOpener) && $('#overlay').hidden) modalOpener.focus({ preventScroll: true });
    modalOpener = null;
  }
  // Formulário com algo digitado: toque fora da janela ou Esc pergunta antes de descartar (Cancelar/✕ fecham direto)
  $('#modal').addEventListener('input', e => { if (e.target.closest('form')) modalDirty = true; });
  const closeModalSafe = () => { if (modalDirty && $('#modal').querySelector('form') && !confirm('Descartar o que você preencheu?')) return; closeModal(); };
  $('#overlay').addEventListener('mousedown', e => { if (e.target === e.currentTarget) closeModalSafe(); });
  // Tab fica dentro da janela aberta (não vai para a página por trás)
  $('#overlay').addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const items = [...$('#modal').querySelectorAll('button, [href], input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled && el.offsetParent !== null && getComputedStyle(el).visibility !== 'hidden');
    const cbs = [...$('#modal').querySelectorAll('.check input')];   // caixinhas escondidas visualmente, mas focáveis
    const list = [...new Set([...items, ...cbs])].sort((a, b) => a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1);
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  $('#modal').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

  const modalHead = (title, sub) => `<div class="modal-head"><div><h3>${title}</h3><p class="sub">${sub}</p></div>
    <button class="x" type="button" data-close aria-label="Fechar">${ico('x')}</button></div>`;
  const moneyField = (id, cents, label = 'Valor') => `<label class="fl" for="${id}">${label}</label>
    <div class="money"><span>R$</span><input id="${id}" inputmode="numeric" value="${centsText(cents || 0)}" data-cents="${cents || 0}" autocomplete="off" /></div>`;
  const checkField = (id, title, text, checked) => `<label class="check"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''}/>
    <span class="box">${ico('check')}</span><span><strong>${title}</strong>${text ? `<small>${text}</small>` : ''}</span></label>`;
  const catSelect = (kind, selected, label) => `<label class="fl" for="fCategory">${label}</label>
    <select class="select" id="fCategory"><option value="">Selecione…</option>${catsOf(kind).map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    <option value="__new">+ Nova categoria…</option></select>`;
  const footer = (editing, dup) => `<div class="err" id="fErr"></div><div class="actions">
    ${editing ? `<button type="button" class="btn del" id="fDelete">Excluir</button>` : ''}${editing && dup ? `<button type="button" class="link" id="fDup" style="margin-left:10px" title="Criar um novo lançamento igual a este, com a data de hoje">Duplicar</button>` : ''}<span class="grow"></span>
    <button type="button" class="btn cancel" data-close>Cancelar</button>
    <button type="submit" class="btn save" id="fSave">${editing ? 'Salvar' : 'Adicionar'}</button></div>`;

  // Campo de valor no estilo app de banco: dígitos entram pelos centavos
  function bindMoney(input, onChange) {
    const set = c => { input.dataset.cents = c; input.value = centsText(c); if (input.closest('#modal form')) modalDirty = true; onChange && onChange(c); };
    // Trata cada tecla direto no valor, sem depender de onde o cursor está
    input.addEventListener('beforeinput', e => {
      const all = input.selectionStart === 0 && input.selectionEnd === input.value.length && input.value.length > 0;
      const base = all ? 0 : cents(input);
      if (e.inputType === 'insertText' && /^\d+$/.test(e.data || '')) {
        e.preventDefault();
        const next = Number(String(base) + e.data);
        set(next > 99999999999 ? base : next);
      } else if (e.inputType.startsWith('delete')) {
        e.preventDefault();
        set(all ? 0 : Math.floor(base / 10));
      } else if (e.inputType === 'insertText') {
        e.preventDefault();
        // Texto com pontuação (ex.: "1.234,56" colado ou preenchido): usa os dígitos; só letras são ignoradas
        const digits = (e.data || '').replace(/\D/g, '');
        if (digits.length > 1) set(Number(digits.slice(0, 11)));
      }
    });
    // Reserva (colar, teclados que não enviam beforeinput): lê só os dígitos
    input.addEventListener('input', () => set(Number(input.value.replace(/\D/g, '').slice(0, 11)) || 0));
    // Ao entrar no campo, seleciona tudo: o primeiro número digitado substitui o valor (bom pra corrigir saldos)
    input.addEventListener('focus', () => setTimeout(() => { if (document.activeElement === input) input.select(); }, 0));
    return set;
  }
  const cents = input => Number(input.dataset.cents) || 0;

  function bindNewCategory(m, kind) {
    const sel = m.querySelector('#fCategory');
    let prev = sel.value;
    sel.addEventListener('change', () => {
      if (sel.value !== '__new') { prev = sel.value; return; }
      const name = (prompt('Nome da nova categoria:') || '').trim();
      if (!name) { sel.value = prev; return; }
      const c = { id: uid(), kind, name, color: PALETTE[state.categories.filter(x => x.kind === kind).length % PALETTE.length] };
      state.categories.push(c); save();
      sel.insertBefore(new Option(name, c.id), sel.querySelector('[value="__new"]'));
      sel.value = prev = c.id;
    });
  }

  // Sugere a categoria enquanto você digita a descrição (pelo que você já lançou antes e por palavras como iFood,
  // posto, farmácia), só enquanto você não escolheu uma categoria na mão
  function bindCatSuggest(m, kind) {
    const sel = m.querySelector('#fCategory'), desc = m.querySelector('#fDesc');
    let auto = !sel.value;
    sel.addEventListener('change', () => { auto = false; });
    desc.addEventListener('input', () => {
      if (!auto) return;
      const id = desc.value.trim().length >= 3 ? suggestCategory(desc.value, kind) : '';
      const outros = catsOf(kind).find(c => norm(c.name) === 'outros')?.id;
      sel.value = id && id !== outros ? id : '';   // "Outros" é o chute padrão: melhor deixar você escolher
    });
  }

  function defaultDate() {
    return view.month === monthOf(todayIso) ? todayIso : `${view.month}-01`;
  }

  // ---------- Receita ----------
  // prefill: valores de um lançamento duplicado (novo lançamento já preenchido)
  function openReceita(item, prefill) {
    const editing = !!item;
    const r = item || { date: defaultDate(), amount: 0, desc: '', category: '', recurring: false, pending: false, ...prefill };
    openModal(`<form id="f">${modalHead(editing ? 'Editar Receita' : 'Nova Receita', r.recurring ? 'Se repete todo mês.' : 'Lançamento deste mês.')}
      <label class="fl" for="fDate">Data</label><input type="date" class="input" id="fDate" value="${r.date}" required />
      ${checkField('fPending', 'Recebimento futuro', 'Não conta na sua receita até você marcar como recebido.', r.pending)}
      ${moneyField('fAmount', r.amount)}
      <label class="fl" for="fDesc">Descrição</label><input class="input" id="fDesc" maxlength="60" placeholder="Ex.: Salário, Freela…" value="${esc(r.desc)}" />
      ${catSelect('receita', r.category, 'Tipo de renda')}
      ${payField(item || prefill ? r : null, true)}
      ${checkField('fRecurring', 'Receita recorrente', 'Repete todo mês, como o salário.', r.recurring)}
      ${footer(editing, true)}</form>`, m => {
      m.querySelector('#fDup')?.addEventListener('click', () => openReceita(null, { amount: item.amount, desc: item.desc, category: item.category, payAccount: item.payAccount || '', payCard: '' }));
      bindMoney(m.querySelector('#fAmount'));
      bindNewCategory(m, 'receita');
      if (!editing) bindCatSuggest(m, 'receita');
      bindPay(m);
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const data = {
          date: m.querySelector('#fDate').value, amount: cents(m.querySelector('#fAmount')),
          desc: m.querySelector('#fDesc').value.trim(), category: m.querySelector('#fCategory').value,
          pending: m.querySelector('#fPending').checked, recurring: m.querySelector('#fRecurring').checked,
          payAccount: readPay(m).payAccount,
        };
        if (!data.date) return showErr('Escolha a data.');
        if (!data.amount) return showErr('Digite o valor.');
        if (data.category === '__new') data.category = '';
        upsertRecurringAware(state.receitas, item, data, 'recurring');
        undoToast(editing ? 'Receita atualizada' : 'Receita adicionada', undoSnap);
        goToMonthOf(data.date, item);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => removeRecurringAware('receitas', item, item.recurring));
    });
  }

  // ---------- Despesa variável ----------
  function openVariavel(item, prefill) {
    const editing = !!item;
    const v = item || { date: defaultDate(), amount: 0, desc: '', category: '', ...prefill };
    openModal(`<form id="f">${modalHead(editing ? 'Editar Despesa Variável' : 'Nova Despesa Variável', v.installment ? `Parcela ${v.installment.i} de ${v.installment.n}.` : 'Lançamento deste mês.')}
      <label class="fl" for="fDate">Data</label><input type="date" class="input" id="fDate" value="${v.date}" required />
      ${moneyField('fAmount', v.amount)}
      ${editing ? '' : checkField('fInst', 'Parcelado', 'Divide o valor total nos próximos meses.', false) +
        `<div class="inline" id="instBox" hidden><input type="number" class="input" id="fN" min="2" max="48" value="2" /><span id="instHint"></span></div>`}
      <label class="fl" for="fDesc">Descrição</label><input class="input" id="fDesc" maxlength="60" placeholder="Ex.: Mercado, Gasolina…" value="${esc(v.desc)}" />
      ${catSelect('despesa', v.category, 'Categoria')}
      ${payField(item || prefill ? v : null)}
      ${editing && v.installment ? checkField('fAllParc', `Aplicar a todas as ${v.installment.n} parcelas`, 'Descrição, categoria e forma de pagamento. Data e valor mudam só nesta parcela.', true) : ''}
      ${footer(editing, true)}</form>`, m => {
      m.querySelector('#fDup')?.addEventListener('click', () => openVariavel(null, { amount: item.amount, desc: item.desc, category: item.category, payCard: item.payCard || '', payAccount: item.payAccount || '' }));
      const amount = m.querySelector('#fAmount');
      const hint = () => {
        if (editing) return;
        const n = Math.max(2, Math.min(48, +m.querySelector('#fN').value || 2));
        m.querySelector('#instHint').textContent = `parcelas de ${brl.format(Math.floor(cents(amount) / n) / 100)}`;
      };
      const limitHint = () => {
        const c = cat(m.querySelector('#fCategory').value);
        let box = m.querySelector('#limHint');
        if (!box) { box = document.createElement('p'); box.className = 'help'; box.id = 'limHint'; m.querySelector('#fCategory').after(box); }
        if (!c || !c.limit) { box.textContent = ''; return; }
        const key = monthOf(m.querySelector('#fDate').value || todayIso);
        const spent = spentIn(c.id, key) - (editing && item.category === c.id && monthOf(item.date) === key ? item.amount : 0);
        const after = spent + cents(amount), left = c.limit - after;
        box.textContent = `${c.name}: ${brl.format(after / 100)} de ${brl.format(c.limit / 100)} no mês com este gasto` + (left < 0 ? ` ⛔ passa ${brl.format(-left / 100)} do limite` : after >= c.limit * 0.8 ? ` ⚠️ sobra ${brl.format(left / 100)}` : ` · sobra ${brl.format(left / 100)}`);
      };
      bindMoney(amount, () => { hint(); limitHint(); });
      bindNewCategory(m, 'despesa');
      if (!editing) { bindCatSuggest(m, 'despesa'); m.querySelector('#fDesc').addEventListener('input', limitHint); }
      m.querySelector('#fCategory').addEventListener('change', limitHint);
      m.querySelector('#fDate').addEventListener('change', limitHint);
      limitHint();
      bindPay(m);
      if (!editing) {
        m.querySelector('#fInst').addEventListener('change', e => {
          m.querySelector('#instBox').hidden = !e.target.checked;
          m.querySelector('label[for=fAmount]').textContent = e.target.checked ? 'Valor total' : 'Valor';
          hint();
        });
        m.querySelector('#fN').addEventListener('input', hint);
        if (prefill?.parcelas) { m.querySelector('#fInst').checked = true; m.querySelector('#fN').value = prefill.parcelas; m.querySelector('#fInst').dispatchEvent(new Event('change')); }
      }
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const data = {
          date: m.querySelector('#fDate').value, amount: cents(amount),
          desc: m.querySelector('#fDesc').value.trim(), category: m.querySelector('#fCategory').value, ...readPay(m),
        };
        if (!data.date) return showErr('Escolha a data.');
        if (!data.amount) return showErr('Digite o valor.');
        if (data.category === '__new') data.category = '';
        if (editing) {
          Object.assign(state.variaveis.find(x => x.id === item.id), data);
          if (item.installment && m.querySelector('#fAllParc')?.checked)
            state.variaveis.filter(x => x.installment?.group === item.installment.group)
              .forEach(x => Object.assign(x, { desc: data.desc, category: data.category, payCard: data.payCard, payAccount: data.payAccount }));
          undoToast('Despesa atualizada', undoSnap);
        } else if (m.querySelector('#fInst').checked) {
          const n = Math.max(2, Math.min(48, +m.querySelector('#fN').value || 2));
          const group = uid(), base = Math.floor(data.amount / n), rest = data.amount - base * n;
          for (let i = 0; i < n; i++) {
            const key = addMonths(monthOf(data.date), i);
            state.variaveis.push({ ...data, id: uid(), created: Date.now() + i, date: dateIn(key, +data.date.slice(8)),
              amount: base + (i === 0 ? rest : 0), installment: { group, i: i + 1, n } });
          }
          undoToast(`Parcelado em ${n}x`, undoSnap);
        } else {
          state.variaveis.push({ ...data, id: uid(), created: Date.now() });
          undoToast('Despesa adicionada', undoSnap);
        }
        goToMonthOf(data.date, item);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => {
        const snapshot = JSON.stringify(state.variaveis);
        const done = msg => { closeModal(); commit(); toast(msg, 'Desfazer', () => { state.variaveis = JSON.parse(snapshot); commit(); }); };
        if (item.installment) {
          // parcela: pergunta se é só esta ou a compra inteira
          const box = m.querySelector('#fErr');
          box.innerHTML = `<div class="movebox" style="color:var(--ink)">Excluir só esta parcela (${item.installment.i}/${item.installment.n}) ou a compra inteira?
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button type="button" class="btn-soft" id="delOne">Só esta parcela</button>
            <button type="button" class="btn-soft" id="delAll" style="color:var(--red)">Todas as ${item.installment.n} parcelas</button></div></div>`;
          box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          box.querySelector('#delOne').onclick = () => { state.variaveis = state.variaveis.filter(x => x.id !== item.id); done('Parcela excluída'); };
          box.querySelector('#delAll').onclick = () => { state.variaveis = state.variaveis.filter(x => x.installment?.group !== item.installment.group); done(`${item.installment.n} parcelas excluídas`); };
          return;
        }
        state.variaveis = state.variaveis.filter(x => x.id !== item.id);
        done('Despesa excluída');
      });
    });
  }

  // ---------- Despesa fixa ----------
  function openFixa(item) {
    const editing = !!item;
    const f = item || { amount: 0, desc: '', day: +defaultDate().slice(8) };
    openModal(`<form id="f">${modalHead(editing ? 'Editar Despesa Fixa' : 'Nova Despesa Fixa', 'Vale deste mês em diante.')}
      ${moneyField('fAmount', f.amount)}
      <label class="fl" for="fDesc">Descrição</label><input class="input" id="fDesc" maxlength="60" placeholder="Ex.: Aluguel, Internet…" value="${esc(f.desc)}" />
      <label class="fl" for="fDay">Vencimento (dia do mês)</label>
      <select class="select" id="fDay">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${i + 1 === f.day ? 'selected' : ''}>Todo dia ${pad(i + 1)}</option>`).join('')}</select>
      ${checkField('fDueNext', 'Vence no mês seguinte', 'Ex.: o plano de saúde de setembro que você paga dia 5 de outubro. Conta nas despesas de setembro e vence em outubro.', f.dueNext)}
      ${editing ? '' : `<div id="paidNowBox" hidden>${checkField('fPaidNow', 'Já paguei a deste mês', 'O vencimento deste mês já passou. Desmarque se ainda não pagou.', true)}</div>`}
      ${payField(item ? f : null)}
      ${footer(editing)}</form>`, m => {
      bindMoney(m.querySelector('#fAmount'));
      bindPay(m);
      // Conta nova com o vencimento deste mês já passado: pergunta se já foi paga, pra não nascer "Atrasada"
      const paidNow = () => {
        const box = m.querySelector('#paidNowBox'); if (!box) return;
        const due = dateIn(m.querySelector('#fDueNext').checked ? addMonths(view.month, 1) : view.month, +m.querySelector('#fDay').value);
        box.hidden = daysUntil(due) >= 0;
      };
      if (!editing) { m.querySelector('#fDay').addEventListener('change', paidNow); m.querySelector('#fDueNext').addEventListener('change', paidNow); paidNow(); }
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const undoSnap = JSON.stringify(state);
        const data = { amount: cents(m.querySelector('#fAmount')), desc: m.querySelector('#fDesc').value.trim(), day: +m.querySelector('#fDay').value, dueNext: m.querySelector('#fDueNext').checked, ...readPay(m) };
        if (!data.amount) return showErr('Digite o valor.');
        if (!data.desc) return showErr('Dê um nome, ex.: Aluguel.');
        if (!editing) {
          const id = uid();
          state.fixas.push({ ...data, id, created: Date.now(), start: view.month });
          if (!m.querySelector('#paidNowBox').hidden && m.querySelector('#fPaidNow').checked) (state.paid[view.month] ||= []).push(id);
        } else if (item.start < view.month && (item.amount !== data.amount || item.day !== data.day || item.desc !== data.desc || !!item.dueNext !== data.dueNext
          || (item.payCard || '') !== data.payCard || (item.payAccount || '') !== data.payAccount)) {
          // Mudou no meio do caminho: encerra a antiga no mês anterior e cria a nova a partir deste mês
          const old = state.fixas.find(x => x.id === item.id);
          const end = old.end;
          old.end = addMonths(view.month, -1);
          const nf = { ...data, id: uid(), created: old.created, start: view.month, end };
          state.fixas.push(nf);
          if ((state.paid[view.month] || []).includes(old.id)) state.paid[view.month].push(nf.id);
        } else {
          Object.assign(state.fixas.find(x => x.id === item.id), data);
        }
        undoToast(editing ? 'Despesa fixa atualizada' : 'Despesa fixa adicionada', undoSnap);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => removeRecurringAware('fixas', item, true));
    });
  }

  // item: { payCard?, payAccount? }. Novo lançamento sem escolha usa a última forma de pagamento usada.
  // Botão de cartão: mini cartão (cor do banco + bandeira) e texto que diferencia cartões do mesmo banco
  function cardChipHtml(c) {
    const b = BRANDS[c.bank], color = b ? b.color : (c.color || '#3b414b');
    const sub = [FLAGS[c.flag]?.name, c.last4 ? '•' + esc(c.last4) : '', 'vence dia ' + pad(c.dueDay)].filter(Boolean).join(' · ');
    return `<span class="mini-cc" style="background:linear-gradient(135deg, ${color}, color-mix(in srgb, ${color} 60%, #000))">${logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color }, 'sm')}${flagHtml(c.flag)}</span>
      <span class="cc-txt"><b>${esc(c.name)}</b><small>${sub}</small></span>`;
  }
  // Opções agrupadas: Dinheiro/outro · Contas · Cartões de crédito
  function payOptionsHtml(sel, { receita = false, attr = 'data-card', noneLabel } = {}) {
    const cards = receita ? [] : state.cards.filter(c => activeIn(c, view.month));
    const btn = (v, inner, cls = '') => `<button type="button" ${attr}="${v}" class="${cls} ${v === sel ? 'on' : ''}">${inner}</button>`;
    return `<div class="pay-sec">${btn('', ico('wallet') + (noneLabel || (receita ? 'Não informar' : 'Dinheiro / outro')))}</div>
      ${state.accounts.length ? `<div class="pay-h">${receita ? 'Conta' : 'Conta · Pix, débito ou boleto'}</div>
        <div class="pay-sec">${state.accounts.map(a => btn('acc:' + a.id, logoHtml(a, 'sm') + esc(a.name))).join('')}</div>` : ''}
      ${cards.length ? `<div class="pay-h">Cartão de crédito</div>
        <div class="pay-sec cc">${cards.map(c => btn('card:' + c.id, cardChipHtml(c), 'cc-btn')).join('')}</div>` : ''}`;
  }
  function payField(item, receita = false) {
    const cards = receita ? [] : state.cards.filter(c => activeIn(c, view.month));
    if (!cards.length && !state.accounts.length) return '';
    const isNew = !item || item.payCard === undefined && item.payAccount === undefined;
    const sel = isNew ? (receita ? ui.lastIn : ui.lastPay) || '' : item.payCard ? 'card:' + item.payCard : item.payAccount ? 'acc:' + item.payAccount : '';
    const valid = [...state.accounts.map(a => 'acc:' + a.id), ...cards.map(c => 'card:' + c.id)].includes(sel) ? sel : '';
    return `<label class="fl">${receita ? 'Recebido em' : 'Pago com'}</label>
      <div class="bank-chips pay-pick" id="fPay" data-receita="${receita ? 1 : ''}">${payOptionsHtml(valid, { receita })}</div>
      <p class="help" id="payHelp"></p>`;
  }
  function bindPay(m) {
    const box = m.querySelector('#fPay'); if (!box) return;
    const help = () => {
      const v = box.querySelector('.on')?.dataset.card || '';
      m.querySelector('#payHelp').textContent = v.startsWith('card:') ? 'Entra na fatura do cartão. Quando a fatura for lançada, passa a contar só dentro dela (não soma duas vezes).'
        : v.startsWith('acc:') ? (box.dataset.receita ? 'Soma no saldo dessa conta na data do recebimento.' : 'Sai do saldo dessa conta na data do pagamento.') : '';
    };
    box.addEventListener('click', e => {
      const b = e.target.closest('[data-card]'); if (!b) return;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); help();
    });
    help();
  }
  // Devolve { payCard, payAccount } e lembra a escolha para o próximo lançamento
  function readPay(m) {
    const box = m.querySelector('#fPay');
    if (!box) return { payCard: '', payAccount: '' };
    const v = box.querySelector('.on')?.dataset.card || '';
    if (box.dataset.receita) ui.lastIn = v; else ui.lastPay = v;
    saveUi();
    return { payCard: v.startsWith('card:') ? v.slice(5) : '', payAccount: v.startsWith('acc:') ? v.slice(4) : '' };
  }
  // Selo "no cartão" ao lado do nome
  function viaHtml(item) {
    const c = payCardOf(item);
    if (c) return `<span class="via" title="Cartão ${esc(c.name)} ${FLAGS[c.flag]?.name || ''}${c.last4 ? ' •' + esc(c.last4) : ''}">${logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color })}${esc(c.name)}${c.last4 ? ' •' + esc(c.last4) : ''}${flagHtml(c.flag)}</span>`;
    const a = item.payAccount && state.accounts.find(x => x.id === item.payAccount);
    return a ? `<span class="via" title="Conta ${esc(a.name)}">${logoHtml(a)}${esc(a.name)}</span>` : '';
  }
  function valHtml(item, key, text) {
    if (!inFatura(item, key)) return `<span class="val num">${text}</span>`;
    return `<span class="val num absorbed" title="Já está dentro da fatura do ${esc(payCardOf(item).name)}">${text}<small>na fatura</small></span>`;
  }

  function showErr(msg) { $('#fErr').textContent = msg; }

  // Edição de receita recorrente: mudanças valem deste mês em diante
  function upsertRecurringAware(list, item, data) {
    if (!item) { list.push({ ...data, id: uid(), created: Date.now() }); return; }
    const old = list.find(x => x.id === item.id);
    const startKey = monthOf(old.date);
    if (old.recurring && startKey < view.month && data.recurring) {
      const changed = old.amount !== data.amount || old.desc !== data.desc || old.category !== data.category || +old.date.slice(8) !== +data.date.slice(8)
        || !!old.pending !== !!data.pending || (old.payAccount || '') !== (data.payAccount || '');
      if (changed) {
        const end = old.end;
        old.end = addMonths(view.month, -1);
        list.push({ ...data, id: uid(), created: old.created, date: dateIn(view.month, +data.date.slice(8)), end });
        return;
      }
      return;
    }
    // Deixou de ser recorrente num mês posterior: os meses anteriores continuam; este mês vira um lançamento avulso
    if (old.recurring && startKey < view.month && !data.recurring) {
      old.end = addMonths(view.month, -1);
      list.push({ ...data, id: uid(), created: Date.now() });
      return;
    }
    Object.assign(old, data);
    if (!data.recurring) delete old.end;
  }

  // Exclusão de algo recorrente: se já existia antes, para de repetir a partir deste mês
  function removeRecurringAware(listName, item, recurring, choice) {
    const snapshot = JSON.stringify(state[listName]);
    const list = state[listName];
    const obj = list.find(x => x.id === item.id);
    const startKey = obj.start ?? monthOf(obj.date);
    // recorrente (menos cartão): pergunta se é só este mês (pula o mês, guardado em skip) ou daqui em diante
    if (recurring && listName !== 'cards' && !choice) {
      const box = $('#modal #fErr'), mn = monthName(view.month);
      box.innerHTML = `<div class="movebox" style="color:var(--ink)">Remover só em ${mn} ou ${startKey < view.month ? `de ${mn} em diante` : 'de vez'}?
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button type="button" class="btn-soft" id="rmOne">Só em ${mn}</button>
        <button type="button" class="btn-soft" id="rmFwd" style="color:var(--red)">${startKey < view.month ? `De ${mn} em diante` : 'Excluir de vez'}</button></div></div>`;
      box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      box.querySelector('#rmOne').onclick = () => removeRecurringAware(listName, item, recurring, 'one');
      box.querySelector('#rmFwd').onclick = () => removeRecurringAware(listName, item, recurring, 'fwd');
      return;
    }
    if (choice === 'one') {
      obj.skip = [...new Set([...(obj.skip || []), view.month])];
      toast(`Pulada em ${monthName(view.month)}`, 'Desfazer', undo);
    } else if (recurring && startKey < view.month) {
      obj.end = addMonths(view.month, -1);
      toast('Removida deste mês em diante', 'Desfazer', undo);
    } else {
      state[listName] = list.filter(x => x.id !== item.id);
      toast('Excluída', 'Desfazer', undo);
    }
    function undo() { state[listName] = JSON.parse(snapshot); commit(); }
    closeModal(); commit();
  }

  function goToMonthOf(date, editingItem) {
    if (!editingItem) view.month = monthOf(date);
  }
  function commit() { save(); closeModal(); render(); }

  // ---------- Investir ----------
  function openInvest() {
    const t = totals(view.month);
    let pct = t.pct;
    openModal(`${modalHead('Investir', 'Quanto da sua receita você reserva pra investir.')}
      <div class="big-pct num" id="iPct"></div>
      <input type="range" class="range" id="iRange" min="0" max="100" step="1" aria-label="Percentual" />
      <div class="presets">${[10, 20, 30, 40, 50].map(p => `<button type="button" data-p="${p}">${p}%</button>`).join('')}</div>
      <div class="inv-label">Valor a investir</div>
      <div class="inv-value"><span>R$</span><input id="iVal" inputmode="numeric" aria-label="Valor a investir" /></div>
      <p class="hint">${t.receita ? 'Toque no valor pra digitar. O percentual se ajusta sozinho.' : 'Adicione uma receita neste mês para calcular o valor.'}</p>
      <div class="actions"><span class="grow"></span><button class="btn cancel" data-close>Cancelar</button><button class="btn save" id="iSave">Salvar</button></div>`, m => {
      const val = m.querySelector('#iVal'), range = m.querySelector('#iRange');
      const draw = (fromValue) => {
        m.querySelector('#iPct').textContent = fmtPct(pct);
        range.value = Math.round(pct);
        m.querySelectorAll('.presets button').forEach(b => b.classList.toggle('on', +b.dataset.p === Math.round(pct * 10) / 10));
        if (!fromValue) { const c = Math.round(t.receita * pct / 100); val.dataset.cents = c; val.value = centsText(c); }
        val.style.width = Math.max(val.value.length, 4) + 1 + 'ch';
      };
      bindMoney(val, c => {
        if (!t.receita) { pct = 0; return draw(false); }
        const cc = Math.min(c, t.receita);
        pct = Math.round(cc / t.receita * 1000) / 10;
        if (cc !== c) { val.dataset.cents = cc; val.value = centsText(cc); }
        draw(true);
      });
      range.addEventListener('input', () => { pct = +range.value; draw(false); });
      m.querySelector('.presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { pct = +b.dataset.p; draw(false); } });
      draw(false);
      m.querySelector('#iSave').addEventListener('click', () => {
        state.invest[view.month] = pct;
        commit(); toast('Meta de investimento salva');
      });
    });
  }

      m.querySelector('#catList').innerHTML = catsOf(kind).map(c => `<div class="cat-edit" data-id="${c.id}">

        if (used && !confirm(`${used} lançamento(s) usam esta categoria e ficarão "Sem categoria". Excluir mesmo assim?`)) return;
        const undoSnap = JSON.stringify(state), name = cat(id)?.name || 'Categoria';
        state.categories = state.categories.filter(c => c.id !== id);
        save(); draw(m);
        toast(`${name} excluída`, 'Desfazer', () => { state = normalize(JSON.parse(undoSnap)); save(); if (!$('#overlay').hidden) draw(m); fillFilter(); render(); });
      });
      m.querySelector('#catAdd').addEventListener('click', () => {
        state.categories.push({ id: uid(), kind, name: 'Nova categoria', color: PALETTE[catsOf(kind).length % PALETTE.length] });
        save(); draw(m);
        const inputs = m.querySelectorAll('[data-name]'); const last = inputs[inputs.length - 1];
        last.focus(); last.select();

      <p class="fl" style="margin-top:4px">Fonte</p>
      <div class="font-pick" id="mFonts">${FONTS.map(f => `<button type="button" data-font="${f}" style="font-family:'${f}'" class="${f === ui.font ? 'on' : ''}"><span>Aa</span>${f}</button>`).join('')}</div>

  // ================= Resumo do mês (PDF) =================
  // Monta uma página A4 só para impressão; o navegador salva como PDF em "Imprimir".
  function reportHtml(key) {
    const R = c => brl.format(c / 100);
    const t = totals(key), tp = totals(addMonths(key, -1)), prevName = monthName(addMonths(key, -1));
    const delta = (a, b, goodUp) => {
      if (!b) return '';
      const p = Math.round((a - b) / Math.abs(b) * 100);
      if (!p) return `<small>igual a ${prevName}</small>`;
      const good = goodUp ? p > 0 : p < 0;
      return `<small class="${good ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}% vs ${prevName}</small>`;
    };
    const kpi = (label, v, sub, color) => `<div class="r-kpi"><span>${label}</span><strong style="color:${color}">${v < 0 ? '–' : ''}${R(Math.abs(v))}</strong>${sub}</div>`;
    // Para onde foi o dinheiro
    const groups = new Map();
    const add = (name, color, v) => { if (!v) return; const g = groups.get(name) || { name, color, value: 0 }; g.value += v; groups.set(name, g); };
    variaveisOf(key).filter(countable(key)).forEach(v => { const c = cat(v.category); add(c?.name || 'Sem categoria', c?.color || '#94a3b8', v.amount); });
    add('Contas fixas', '#475569', t.fixas);
    add('Assinaturas', '#d97706', t.assinaturas);
    add('Faturas do cartão', '#1d4ed8', t.faturas);
    const cats = [...groups.values()].sort((a, b) => b.value - a.value), catTotal = cats.reduce((s, g) => s + g.value, 0);
    let off = 0;
    const donut = catTotal ? `<svg viewBox="0 0 42 42" class="r-donut"><g transform="rotate(-90 21 21)">${cats.map(g => {
      const len = g.value / catTotal * 100, gap = cats.length > 1 ? 0.8 : 0;
      const s = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${g.color}" stroke-width="5.2" stroke-dasharray="${Math.max(len - gap, 0.01)} ${100 - Math.max(len - gap, 0.01)}" stroke-dashoffset="${-off}"/>`;
      off += len; return s;
    }).join('')}</g><text x="21" y="20" text-anchor="middle" class="r-dl">Despesas</text><text x="21" y="24.5" text-anchor="middle" class="r-dv">${R(catTotal)}</text></svg>` : '';
    const catRows = cats.map(g => `<div class="r-cat"><span class="dot" style="background:${g.color}"></span><span class="n">${esc(g.name)}</span><span class="p">${Math.round(g.value / catTotal * 100)}%</span><b>${R(g.value)}</b></div>`).join('');
    // Últimos 6 meses
    const months = Array.from({ length: 6 }, (_, i) => addMonths(key, i - 5)), series = months.map(k => ({ k, ...totals(k) }));
    const top = niceScale(Math.max(...series.map(s => Math.max(s.receita, s.despesas)), 1)).max;
    const evo = `<div class="r-evo">${series.map(s => `<div class="col${s.k === key ? ' cur' : ''}"><div class="bars">
      <i class="in" style="height:${s.receita / top * 100}%"></i><i class="out" style="height:${s.despesas / top * 100}%"></i></div><span>${shortMonth(s.k)}</span></div>`).join('')}</div>
      <div class="r-leg"><span><i class="in"></i>Receita</span><span><i class="out"></i>Despesas</span><span class="grow"></span><span>escala até ${R(top)}</span></div>`;
    // Listas
    const table = (title, rows, empty, foot) => `<section class="r-sec"><h2>${title}</h2>${rows.length ? `<table>${rows.join('')}</table>${foot || ''}` : `<p class="r-empty">${empty}</p>`}</section>`;
    const tr = (...cells) => `<tr>${cells.map((c, i) => `<td${i === cells.length - 1 ? ' class="v"' : ''}>${c}</td>`).join('')}</tr>`;
    const topGastos = variaveisOf(key).sort((a, b) => b.amount - a.amount).slice(0, 10)
      .map(v => tr(ddmm(v.date), esc(v.desc || cat(v.category)?.name || 'Despesa') + (v.installment ? ` <small>(${v.installment.i}/${v.installment.n})</small>` : ''), `<small>${esc(cat(v.category)?.name || '')}</small>`, R(v.amount)));
    const FST = { card: 'no cartão', paid: 'paga', late: 'vencida', due: 'a pagar' };
    const fixas = fixasOf(key).sort((a, b) => a.shownDate.localeCompare(b.shownDate)).map(f => { const s = fixaState(f); return tr(ddmm(f.shownDate), esc(f.desc), `<small class="st st-${s}">${FST[s]}</small>`, R(f.amount)); });
    const subs = assinaturasOf(key).sort((a, b) => b.amount - a.amount).map(a => tr(`dia ${pad(a.day)}`, esc(a.name), `<small>${a.cycle === 'anual' ? 'anual' : 'mensal'}${a.payCard && payCardOf(a) ? ' · ' + esc(payCardOf(a).name) : ''}</small>`, R(a.amount)));
    const cards = cardsOf(key).map(c => { const f = c.fatura, prev = f ? 0 : faturaPreview(c.id, key);
      return tr(`vence ${dm(faturaDates(c, key).due)}`, esc(c.name) + (c.last4 ? ` <small>•${esc(c.last4)}</small>` : ''), `<small>${f ? FSTATE[faturaState(c, key, f)][1] : prev ? 'prévia' : 'sem fatura'}</small>`, f ? R(f.amount) : prev ? '≈ ' + R(prev) : '—'); });
    const recs = receitasOf(key).sort((a, b) => b.amount - a.amount).map(r => tr(ddmm(r.shownDate), esc(r.desc || cat(r.category)?.name || 'Receita'), `<small>${r.pending ? 'a receber' : esc(cat(r.category)?.name || '')}</small>`, R(r.amount)));
    const acc = state.accounts.reduce((s, a) => s + accBalance(a), 0), inv = state.investments.reduce((s, i) => s + estimate(i), 0);
    const goals = state.metas.map(g => { const i = goalInfo(g); return `<div class="r-goal"><span>${g.emoji || '🎯'} ${esc(g.name)}</span><span class="bar"><i style="width:${i.pct * 100}%"></i></span><b>${Math.round(i.pct * 100)}%</b></div>`; }).join('');
    const tips = insights().replace(/<span class="ic"[^>]*>.*?<\/span>/g, '');
    const lbl = new Date(+key.slice(0, 4), +key.slice(5) - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    return `<header class="r-head"><div><p>Orçamento</p><h1>Resumo de ${lbl}</h1></div><small>Gerado em ${new Date().toLocaleDateString('pt-BR')}</small></header>
      <div class="r-kpis">${kpi('Receita', t.receita, delta(t.receita, tp.receita, true) + (t.aReceber ? `<small>+ ${R(t.aReceber)} a receber</small>` : ''), '#15803d')}
        ${kpi('Despesas', t.despesas, delta(t.despesas, tp.despesas, false), '#b91c1c')}
        ${kpi('Investir', t.investir, t.pct ? `<small>${fmtPct(t.pct)} da receita</small>` : '', '#1d4ed8')}
        ${kpi('Saldo', t.saldo, t.receita ? `<small>${Math.round((t.receita - t.despesas) / t.receita * 100)}% da receita sobrou</small>` : '', t.saldo < 0 ? '#b91c1c' : '#111827')}</div>
      <div class="r-grid r-top">
        <section class="r-sec"><h2>Para onde foi o dinheiro</h2>${catTotal ? `<div class="r-where">${donut}<div class="r-cats">${catRows}</div></div>` : '<p class="r-empty">Sem despesas neste mês.</p>'}</section>
        <section class="r-sec"><h2>Últimos 6 meses</h2>${evo}<div class="r-tips">${tips}</div></section>
      </div>
      ${table('Maiores gastos', topGastos, 'Nenhuma despesa variável.')}
      <div class="r-grid">
        ${table('Contas fixas', fixas, 'Nenhuma conta fixa.', `<p class="r-foot">Total <b>${R(fixasOf(key).reduce((s, f) => s + f.amount, 0))}</b></p>`)}
        ${table('Assinaturas', subs, 'Nenhuma assinatura cobrada.', `<p class="r-foot">Total <b>${R(assinaturasOf(key).reduce((s, a) => s + a.amount, 0))}</b></p>`)}
      </div>
      <div class="r-grid">
        ${table('Cartões', cards, 'Nenhum cartão cadastrado.')}
        ${table('Receitas', recs, 'Nenhuma receita.')}
      </div>
      <section class="r-sec"><h2>Patrimônio e metas</h2><div class="r-kpis r-kpis-3">${kpi('Contas', acc, '', '#111827')}${kpi('Investimentos', inv, '', '#111827')}${kpi('Total', acc + inv, '', '#111827')}</div>${goals}</section>
      <p class="r-note">Itens pagos no cartão entram pelo valor da fatura, sem contar duas vezes.</p>`;
  }
  function printReport() {
    const wasHidden = ui.hidden; ui.hidden = false;
    let el = $('#report');
    if (!el) { el = document.createElement('div'); el.id = 'report'; document.body.appendChild(el); }
    try { el.innerHTML = reportHtml(view.month); } finally { ui.hidden = wasHidden; }
    closeModal();
    const title = document.title;
    document.title = `Resumo ${view.month}`;   // vira o nome sugerido do PDF
    const done = () => { document.title = title; el.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  }

  function download(name, content, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportCsv() {
    const key = view.month;
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const val = c => (c / 100).toFixed(2).replace('.', ',');
    const d = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
    const via = i => payCardOf(i)?.name || state.accounts.find(a => a.id === i.payAccount)?.name || '';
    const lines = [['Data', 'Tipo', 'Descrição', 'Categoria / Status', 'Pago com / Recebido em', 'Valor']];
    receitasOf(key).forEach(r => lines.push([d(r.shownDate), 'Receita', r.desc, r.pending ? 'A receber' : cat(r.category)?.name, via(r), val(r.amount)]));
    fixasOf(key).forEach(f => lines.push([d(f.shownDate), 'Despesa fixa', f.desc, { card: 'No cartão', paid: 'Pago', late: 'Atrasada', due: 'Pendente' }[fixaState(f)], via(f), val(-f.amount)]));
    variaveisOf(key).forEach(v => lines.push([d(v.shownDate), 'Despesa variável', v.desc + (v.installment ? ` (${v.installment.i}/${v.installment.n})` : ''), cat(v.category)?.name, via(v), val(-v.amount)]));
    const t = totals(key);
    assinaturasOf(key).forEach(a => lines.push([d(a.shownDate), 'Assinatura', a.name, a.cycle === 'anual' ? 'Anual' : 'Mensal', via(a), val(-a.amount)]));
    cardsOf(key).filter(c => c.fatura).forEach(c => lines.push([d(c.shownDate), 'Fatura do cartão', c.name + (FLAGS[c.flag] ? ` (${FLAGS[c.flag].name})` : ''), c.fatura.paid ? 'Paga' : 'Em aberto', '', val(-c.fatura.amount)]));
    state.accounts.forEach(a => lines.push([d(todayIso), 'Conta (saldo atual)', a.name, '', '', val(accBalance(a))]));
    state.investments.forEach(i => lines.push([d(todayIso), 'Investimento (saldo estimado)', i.name + (i.institution ? ` · ${i.institution}` : ''), rateText(i), '', val(estimate(i))]));
    lines.push([], ['', 'Receita', '', '', '', val(t.receita)], ['', 'Investir', '', fmtPct(t.pct), '', val(-t.investir)], ['', 'Despesas', '', '', '', val(-t.despesas)], ['', 'Saldo', '', '', '', val(t.saldo)]);
    download(`orcamento-${key}.csv`, '﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  }

  // Todos os meses, do primeiro lançamento até o mês atual (ou o último lançado), uma linha por lançamento com a coluna Mês
  function exportCsvAll() {
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const val = c => (c / 100).toFixed(2).replace('.', ',');
    const d = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
    const keys = [...state.receitas.map(r => monthOf(r.date)), ...state.variaveis.map(v => monthOf(v.date)), ...state.fixas.map(f => f.start),
      ...state.assinaturas.map(a => a.start), ...Object.values(state.faturas).flatMap(Object.keys)].filter(Boolean).sort();
    if (!keys.length) return toast('Nada para exportar ainda');
    const last = keys[keys.length - 1] > curKey() ? keys[keys.length - 1] : curKey();
    const lines = [['Mês', 'Data', 'Tipo', 'Descrição', 'Categoria / Status', 'Pago com / Recebido em', 'Valor']];
    const via = i => payCardOf(i)?.name || state.accounts.find(a => a.id === i.payAccount)?.name || '';
    for (let k = keys[0], n = 0; k <= last && n < 600; k = addMonths(k, 1), n++) {
      receitasOf(k).forEach(r => lines.push([k, d(r.shownDate), 'Receita', r.desc, r.pending ? 'A receber' : cat(r.category)?.name, via(r), val(r.amount)]));
      fixasOf(k).forEach(f => lines.push([k, d(f.shownDate), 'Despesa fixa', f.desc, { card: 'No cartão', paid: 'Pago', late: 'Atrasada', due: 'Pendente' }[fixaState(f)], via(f), val(-f.amount)]));
      variaveisOf(k).forEach(v => lines.push([k, d(v.shownDate), 'Despesa variável', v.desc + (v.installment ? ` (${v.installment.i}/${v.installment.n})` : ''), cat(v.category)?.name, via(v), val(-v.amount)]));
      assinaturasOf(k).forEach(a => lines.push([k, d(a.shownDate), 'Assinatura', a.name, a.cycle === 'anual' ? 'Anual' : 'Mensal', via(a), val(-a.amount)]));
      cardsOf(k).filter(c => c.fatura).forEach(c => lines.push([k, d(c.shownDate), 'Fatura do cartão', c.name, c.fatura.paid ? 'Paga' : 'Em aberto', '', val(-c.fatura.amount)]));
    }
    const accN = id => state.accounts.find(a => a.id === id)?.name || '';
    (state.transfers || []).slice().sort((a, b) => a.date.localeCompare(b.date))
      .forEach(t => lines.push([monthOf(t.date), d(t.date), t.inv ? (String(t.inv).startsWith('meta:') ? 'Meta' : 'Investimento') : 'Transferência entre contas', t.inv ? t.desc : `${accN(t.from)} → ${accN(t.to)}`, t.inv ? accN(t.from || t.to) : t.desc || '', '', val(t.amount)]));
    download(`orcamento-completo-${todayIso}.csv`, '\ufeff' + lines.map(l => l.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
    toast(`${lines.length - 1} lançamentos exportados`);
  }

  $('#importFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      let next;
      if (Array.isArray(data.receitas) && Array.isArray(data.variaveis)) next = normalize(data);
      else if (Array.isArray(data.transactions)) next = migrate(data);
      else throw new Error('formato');
      if (!confirm('Restaurar este backup? Os dados atuais serão substituídos.')) return;
      const undoSnap = JSON.stringify(state); state = next; commit(); fillFilter(); undoToast('Backup restaurado', undoSnap);
    } catch (_) { toast('Arquivo de backup inválido'); }
  });

  // ================= Eventos =================
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.tab = b.dataset.tab; view.cat = ''; saveUi();
    fillFilter(); render();
  });
  $('#prevMonth').addEventListener('click', () => { view.month = addMonths(view.month, -1); render(); });
  // Celular: arrastar o dedo para os lados troca o mês (para a esquerda = próximo, para a direita = anterior)
  let swipe = null;
  document.addEventListener('touchstart', e => {
    swipe = null;
    if (e.touches.length !== 1 || !$('#overlay').hidden || document.documentElement.classList.contains('locked')) return;
    if (e.target.closest('.tabs, .fc-chart, .evo-chart, input, select, textarea, .pop, .imp-list, .modal')) return;
    const t = e.touches[0];
    swipe = { x: t.clientX, y: t.clientY, at: Date.now() };
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!swipe) return;
    const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y, fast = Date.now() - swipe.at < 700;
    swipe = null;
    if (!fast || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
    view.month = addMonths(view.month, dx < 0 ? 1 : -1);
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const el = ui.tab === 'geral' ? $('#overview') : $('#mainGrid');
      el.animate?.([{ transform: `translateX(${dx < 0 ? 24 : -24}px)`, opacity: .35 }, { transform: 'none', opacity: 1 }], { duration: 200, easing: 'ease-out' });
    }
  }, { passive: true });
  $('#nextMonth').addEventListener('click', () => { view.month = addMonths(view.month, 1); render(); });
  $('#monthLabel').addEventListener('click', () => { view.month = monthOf(todayIso); render(); });
  $('#monthLabel').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); view.month = monthOf(todayIso); render(); } });
  $('#eyeBtn').addEventListener('click', () => { ui.hidden = !ui.hidden; saveUi(); render(); });
  $('#investBtn').addEventListener('click', openInvest);
  $('#accountsBtn').addEventListener('click', openAccounts);
  $('#manageBtn').addEventListener('click', () => ui.tab === 'invest' ? openCdi() : openCategories());
  $('#menuBtn').addEventListener('click', openMenu);
  $('#themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    const root = document.documentElement;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return applyTheme(next, true);
    // Navegadores modernos: o próprio navegador faz um fade entre o tema antigo e o novo
    if (document.startViewTransition) return document.startViewTransition(() => applyTheme(next, true));
    // Reserva: transição de cores só durante a troca, removida depois que tudo terminou
    root.classList.add('theme-anim');
    applyTheme(next, true);
    clearTimeout(themeTimer);
    themeTimer = setTimeout(() => root.classList.remove('theme-anim'), 900);
  });

  const openAdd = () => ({ receita: openReceita, fixa: openFixa, variavel: openVariavel, invest: openInvestment, assin: openAssinatura, cartoes: openCartao, metas: openMeta, geral: openVariavel })[ui.tab]();
  $('#addBtn').addEventListener('click', () => openAdd());

  $('#table').addEventListener('click', e => {
    if (e.target.closest('[data-add]')) return openAdd();
    if (e.target.closest('#sortBtn') && !['invest', 'assin', 'cartoes', 'metas'].includes(ui.tab)) { ui.sortAsc = !ui.sortAsc; saveUi(); return renderTable(); }
    const fpay = e.target.closest('[data-fpay]');
    if (fpay) return toggleFaturaPaid(fpay.dataset.fpay, fpay.dataset.key);
    const fat = e.target.closest('[data-fatura]');
    if (fat) return openFatura(state.cards.find(x => x.id === fat.dataset.fatura), fat.dataset.key);
    const pay = e.target.closest('[data-pay]');
    if (pay) return togglePaid(pay.dataset.pay, view.month);
    const rec = e.target.closest('[data-receive]');
    if (rec) {
      const r = state.receitas.find(x => x.id === rec.dataset.receive);
      const snap = JSON.stringify({ r: state.receitas, x: state.received || {} });
      if (r.recurring) ((state.received ||= {})[view.month] ||= []).push(r.id);   // só este mês
      else r.pending = false;
      save(); render(); toast('Marcado como recebido', 'Desfazer', () => { const o = JSON.parse(snap); state.receitas = o.r; state.received = o.x; commit(); });
