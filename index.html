:root {
  --font: "Urbanist";
  --bg: #eef0f2;
  --card: #ffffff;
  --ink: #14171c;
  --ink-2: #3b414b;
  --muted: #8d949e;
  --line: #eef0f3;
  --field: #f7f8f9;
  --field-line: #e7e9ed;
  --green: #16956a;
  --green-soft: #e3f4ec;
  --blue: #1d5fd6;
  --blue-soft: #e6eefc;
  --red: #d0343c;
  --red-soft: #fce9ea;
  --amber: #c98a12;
  --amber-soft: #fbf1dc;
  --shadow: 0 1px 2px rgba(20, 23, 28, .04), 0 6px 20px rgba(20, 23, 28, .05);
  --shadow-lg: 0 20px 60px rgba(20, 23, 28, .18);
  --r: 16px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1114;
  --card: #181b20;
  --ink: #eef0f3;
  --ink-2: #c5cad2;
  --muted: #7d8591;
  --line: #22262d;
  --field: #1f2329;
  --field-line: #2b3038;
  --green: #34c38f;
  --green-soft: #173229;
  --blue: #5b93f5;
  --blue-soft: #1a2640;
  --red: #f0636a;
  --red-soft: #3a1c1f;
  --amber: #e5b04a;
  --amber-soft: #3a2e14;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font-family: var(--font), system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 1240px; margin: 0 auto; padding: 28px 28px 60px; }

/* Cabeçalho */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.hello { font-size: .8rem; color: var(--muted); margin: 0 0 2px; }
.title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; }
.ghost-ico { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.ghost-ico:hover { background: var(--card); color: var(--ink); }
.top-right { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; }

/* Botão de tema: sol e lua se alternam girando */
.theme-btn { position: relative; width: 30px; height: 30px; overflow: hidden; }
.theme-btn svg.i { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  transition: transform .5s cubic-bezier(.34, 1.4, .5, 1), opacity .35s ease; }
.theme-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
.theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }
:root[data-theme="dark"] .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
:root[data-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(90deg) scale(.4); }
.theme-btn:hover .moon { transform: rotate(-15deg) scale(1.05); }
:root[data-theme="dark"] .theme-btn:hover .sun { transform: rotate(45deg) scale(1.05); }

.bell .dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); }

.kpi.investir .kpi-ico { background: var(--blue-soft); color: var(--blue); } .kpi.investir .kpi-value { color: var(--blue); }
.kpi.despesas .kpi-ico { background: var(--red-soft); color: var(--red); } .kpi.despesas .kpi-value { color: var(--red); }

.adjust {

.tabs { display: inline-flex; gap: 4px; margin-bottom: 18px; }

  font-size: .85rem; font-weight: 600; color: var(--muted);
}

.tabs button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }

/* Tabela */
.table-card { padding: 18px 20px 16px; }

        <p class="hello">Olá, você</p>
        <h1 class="title">Orçamento
          <button class="ghost-ico" id="eyeBtn" title="Esconder valores" aria-label="Esconder valores"><svg class="i"><use href="#i-eye"/></svg></button>
        </h1>
      </div>
      <div class="top-right">
        <div style="display:flex;gap:4px">
          <div class="bell" style="position:relative">
            <button class="ghost-ico" id="bellBtn" title="Contas a vencer" aria-label="Contas a vencer"><svg class="i" style="width:18px;height:18px"><use href="#i-bell"/></svg></button>
            <span class="dot" id="bellDot" hidden></span>
            <div class="pop" id="bellPop" hidden></div>
          </div>
          <button class="ghost-ico theme-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema claro/escuro">
            <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="i moon" viewBox="0 0 24 24"><path d="M20.99 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.78 9.79Z"/></svg>
          </button>
          <button class="ghost-ico" id="menuBtn" title="Configurações" aria-label="Configurações"><svg class="i" style="width:18px;height:18px"><use href="#i-gear"/></svg></button>
        </div>
        <div class="month">
          <button id="prevMonth" aria-label="Mês anterior"><svg class="i"><use href="#i-left"/></svg></button>
          <span class="label" id="monthLabel"></span>
          <button id="nextMonth" aria-label="Próximo mês"><svg class="i"><use href="#i-right"/></svg></button>
        </div>
      </div>
    </header>

    <section class="kpis">
      <div class="kpi receita">
        <div class="kpi-head"><span class="kpi-ico"><svg class="i"><use href="#i-dollar"/></svg></span><span class="kpi-label">Receita</span></div>
        <div class="kpi-value num" id="kReceita"></div>
        <div class="kpi-sub" id="kReceitaSub"></div>
      </div>
      <div class="kpi investir">
        <div class="kpi-head"><span class="kpi-ico"><svg class="i"><use href="#i-invest"/></svg></span><span class="kpi-label">Investir</span>
          <button class="adjust" id="investBtn"><span class="t">Ajustar</span><svg class="i"><use href="#i-pencil"/></svg></button>
        </div>
        <div class="kpi-value num" id="kInvestir"></div>
        <div class="kpi-sub" id="kInvestirSub"></div>
      </div>
      <div class="kpi despesas">
        <div class="kpi-head"><span class="kpi-ico"><svg class="i"><use href="#i-cal"/></svg></span><span class="kpi-label">Despesas</span></div>
        <div class="kpi-value num" id="kDespesas"></div>
        <div class="kpi-sub" id="kDespesasSub"></div>
      </div>
      <div class="kpi saldo">
        <div class="kpi-head"><span class="kpi-ico"><svg class="i"><use href="#i-scale"/></svg></span><span class="kpi-label">Saldo</span></div>
        <div class="kpi-value num" id="kSaldo"></div>
        <div class="kpi-sub" id="kSaldoSub"></div>
      </div>
    </section>

    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="receita">Receita</button>
      <button role="tab" data-tab="fixa">Despesa fixa</button>
      <button role="tab" data-tab="variavel">Despesa variável</button>
    </nav>

    <section class="grid">
      <div class="card table-card">
        <div class="card-head">
          <h2 id="tableTitle"></h2>
          <div class="head-actions">
            <button class="btn-soft" id="filterBtn"><svg class="i"><use href="#i-filter"/></svg><span class="t">Filtro</span></button>
            <button class="btn-soft" id="addBtn"><svg class="i"><use href="#i-plus"/></svg>Adicionar</button>
          </div>
          <div class="pop" id="filterPop" hidden>
            <h4>Filtrar</h4>
            <input class="input" id="fSearch" placeholder="Buscar pelo nome…" autocomplete="off" />
            <select class="select" id="fCat" style="margin-top:8px"></select>
            <button class="btn-soft" id="fClear" style="margin-top:10px;width:100%;justify-content:center">Limpar filtro</button>
          </div>
        </div>
        <div id="table"></div>
      </div>

      <div>
        <div class="card chart-card" id="chart"></div>
        <button class="manage" id="manageBtn"><svg class="i"><use href="#i-tag"/></svg>Gerenciar categorias</button>
      </div>
    </section>
  </div>

  <div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  'use strict';

  // ================= Utilidades =================
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2, '0');
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ico = (id, style = '') => `<svg class="i" ${style ? `style="${style}"` : ''}><use href="#i-${id}"/></svg>`;
  const centsText = c => (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const today = new Date();
  const todayIso = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
  const mkey = (y, m) => `${y}-${pad(m + 1)}`;               // m: 0-11
  const monthOf = iso => iso.slice(0, 7);
  const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return mkey(d.getFullYear(), d.getMonth()); };
  const daysIn = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  const dateIn = (key, day) => `${key}-${pad(Math.min(day, daysIn(key)))}`;
  const ddmm = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;

  const FONTS = ['Urbanist', 'Outfit', 'Sora', 'Parkinsans', 'Syne'];
  const PALETTE = ['#2fa3dc', '#c1262f', '#2a34b5', '#35c46a', '#f0a02f', '#8b5cf6', '#e0529a', '#12a89a', '#f26b1d', '#64748b'];

  const DEFAULT_CATEGORIES = [
    { id: 'r-salario', kind: 'receita', name: 'Salário', color: '#16956a' },
    { id: 'r-extra', kind: 'receita', name: 'Renda extra', color: '#2fa3dc' },
    { id: 'r-rend', kind: 'receita', name: 'Rendimentos', color: '#2a34b5' },
    { id: 'r-outros', kind: 'receita', name: 'Outros', color: '#64748b' },
    { id: 'd-mercado', kind: 'despesa', name: 'Mercado', color: '#2fa3dc' },
    { id: 'd-contas', kind: 'despesa', name: 'Contas', color: '#2a34b5' },
    { id: 'd-carro', kind: 'despesa', name: 'Carro', color: '#c1262f' },
    { id: 'd-saude', kind: 'despesa', name: 'Saúde', color: '#35c46a' },
    { id: 'd-comida', kind: 'despesa', name: 'Comida', color: '#f26b1d' },
    { id: 'd-lazer', kind: 'despesa', name: 'Lazer', color: '#f0a02f' },
    { id: 'd-casa', kind: 'despesa', name: 'Casa', color: '#8b5cf6' },
    { id: 'd-outros', kind: 'despesa', name: 'Outros', color: '#64748b' },
  ];

  // ================= Dados =================
  const KEY = 'orcamento:v2';
  const UI_KEY = 'orcamento:ui';

  function blank() {
    return { categories: DEFAULT_CATEGORIES.map(c => ({ ...c })), receitas: [], variaveis: [], fixas: [], invest: {}, paid: {} };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return { ...blank(), ...JSON.parse(raw) };
      // Migra dados da primeira versão do app, se existirem
      const old = JSON.parse(localStorage.getItem('grana:v1') || 'null');
      if (old && Array.isArray(old.transactions) && old.transactions.length) return migrate(old);
    } catch (_) { /* dados corrompidos: começa do zero */ }
    return blank();
  }

  function migrate(old) {
    const s = blank();
    const byName = (kind, name) => {
      let c = s.categories.find(x => x.kind === kind && x.name.toLowerCase() === name.toLowerCase());
      if (!c) { c = { id: uid(), kind, name, color: PALETTE[s.categories.length % PALETTE.length] }; s.categories.push(c); }
      return c.id;
    };
    const names = { mercado: 'Mercado', comida: 'Comida', casa: 'Casa', transporte: 'Transporte', contas: 'Contas', saude: 'Saúde', lazer: 'Lazer', compras: 'Compras', educacao: 'Educação', outros: 'Outros', salario: 'Salário', extra: 'Renda extra', investimentos: 'Rendimentos', presente: 'Presente', 'outros-in': 'Outros' };
    old.transactions.forEach(t => {
      const item = { id: t.id || uid(), date: t.date, amount: t.amount, desc: t.desc || names[t.category] || '' };
      if (t.type === 'in') s.receitas.push({ ...item, category: byName('receita', names[t.category] || 'Outros') });
      else s.variaveis.push({ ...item, category: byName('despesa', names[t.category] || 'Outros') });
    });
    return s;
  }

  let state = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (_) { toast('Não foi possível salvar neste navegador'); }
  }

  let ui = { tab: 'variavel', hidden: false, theme: null, sortAsc: false, font: 'Urbanist' };
  try { ui = { ...ui, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}') }; } catch (_) {}
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (_) {} };

  let view = { month: mkey(today.getFullYear(), today.getMonth()), query: '', cat: '' };

  const cat = id => state.categories.find(c => c.id === id);
  const catsOf = kind => state.categories.filter(c => c.kind === kind);
  const money = c => ui.hidden ? 'R$ •••••' : brl.format(c / 100);

  // ================= Itens do mês =================
  const activeIn = (item, key) => item.start <= key && (!item.end || key <= item.end);

  function receitasOf(key) {
    return state.receitas
      .filter(r => r.recurring ? activeIn({ start: monthOf(r.date), end: r.end }, key) : monthOf(r.date) === key)
      .map(r => ({ ...r, shownDate: r.recurring ? dateIn(key, +r.date.slice(8)) : r.date }));
  }
  const variaveisOf = key => state.variaveis.filter(v => monthOf(v.date) === key).map(v => ({ ...v, shownDate: v.date }));
  const fixasOf = key => state.fixas.filter(f => activeIn(f, key))
    .map(f => ({ ...f, shownDate: dateIn(key, f.day), paid: !!(state.paid[key] || []).includes(f.id) }));

  function investPct(key) {
    const keys = Object.keys(state.invest).filter(k => k <= key).sort();
    return keys.length ? state.invest[keys[keys.length - 1]] : 0;
  }

  function totals(key) {
    const rec = receitasOf(key);
    const receita = rec.filter(r => !r.pending).reduce((s, r) => s + r.amount, 0);
    const aReceber = rec.filter(r => r.pending).reduce((s, r) => s + r.amount, 0);
    const fixas = fixasOf(key).reduce((s, f) => s + f.amount, 0);
    const variaveis = variaveisOf(key).reduce((s, v) => s + v.amount, 0);
    const pct = investPct(key);
    const investir = Math.round(receita * pct / 100);
    return { receita, aReceber, fixas, variaveis, despesas: fixas + variaveis, pct, investir, saldo: receita - investir - fixas - variaveis };
  }

  // ================= Render =================
  function render() {
    const [y, m] = view.month.split('-').map(Number);
    const lbl = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    $('#monthLabel').textContent = lbl.charAt(0).toUpperCase() + lbl.slice(1);

    const t = totals(view.month);
    $('#kReceita').textContent = money(t.receita);
    $('#kReceitaSub').textContent = t.aReceber ? `+ ${money(t.aReceber)} a receber` : '';
    $('#kInvestir').textContent = money(t.investir);
    $('#kInvestirSub').textContent = t.pct ? `${fmtPct(t.pct)} da receita` : 'Quanto guardar este mês';
    $('#kDespesas').textContent = money(t.despesas);
    $('#kDespesasSub').textContent = t.despesas ? `Fixas ${money(t.fixas)} · Variáveis ${money(t.variaveis)}` : '';
    $('#kSaldo').textContent = (t.saldo < 0 && !ui.hidden ? '–' : '') + money(Math.abs(t.saldo));
    $('#kSaldo').classList.toggle('neg', t.saldo < 0);
    $('#kSaldoSub').textContent = t.saldo < 0 ? 'Gastos acima da receita' : t.receita ? 'Livre para usar' : '';

    $('#eyeBtn').innerHTML = ico(ui.hidden ? 'eye-off' : 'eye');
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
    $('#manageBtn').hidden = ui.tab === 'fixa';
    $('#filterBtn').classList.toggle('on', !!(view.query || view.cat));

    renderTable();
    renderChart();
    renderBell();
  }

  const fmtPct = p => (Math.round(p * 10) / 10).toLocaleString('pt-BR') + '%';

  function rowsForTab() {
    const q = view.query.trim().toLowerCase();
    let rows = ui.tab === 'receita' ? receitasOf(view.month) : ui.tab === 'fixa' ? fixasOf(view.month) : variaveisOf(view.month);
    if (q) rows = rows.filter(r => (r.desc || '').toLowerCase().includes(q));
    if (view.cat && ui.tab !== 'fixa') rows = rows.filter(r => r.category === view.cat);
    const dir = ui.sortAsc ? 1 : -1;
    return rows.sort((a, b) => dir * (a.shownDate.localeCompare(b.shownDate) || (a.created || 0) - (b.created || 0)));
  }

  function tagHtml(c) {
    if (!c) return `<span class="tag" style="background:var(--field);color:var(--muted)">Sem categoria</span>`;
    return `<span class="tag" style="background:${c.color}1f;color:${c.color}">${esc(c.name)}</span>`;
  }

  function renderTable() {
    const titles = { receita: 'Receita', fixa: 'Despesas fixas', variavel: 'Despesas variáveis' };
    $('#tableTitle').textContent = titles[ui.tab];
    const rows = rowsForTab();
    const filtered = !!(view.query || view.cat);

    if (!rows.length) {
      const msg = filtered ? 'Nada encontrado com esse filtro.'
        : { receita: 'Sem receita no período.', fixa: 'Nenhuma despesa fixa cadastrada.', variavel: 'Sem despesas variáveis no período.' }[ui.tab];
      $('#table').innerHTML = `<div class="empty">${msg}${filtered ? '' : `<br><button class="btn-soft" data-add>${ico('plus')}Adicionar</button>`}</div>`;
      return;
    }

    const isFixa = ui.tab === 'fixa';
    const head = `<div class="row head">
      <button class="sort" id="sortBtn" title="Ordenar por data">${isFixa ? 'Venc.' : 'Data'} ${ico('sort', 'width:11px;height:11px')}</button>
      <span>Nome</span><span class="cat">${isFixa ? 'Status' : 'Categoria'}</span><span class="val">Valor</span><span></span></div>`;

    const body = rows.map(r => {
      let label, extra = '';
      if (isFixa) {
        label = `<button class="tag status ${r.paid ? 'paid' : 'pending'}" data-pay="${r.id}" title="Marcar como ${r.paid ? 'pendente' : 'pago'}">${r.paid ? 'Pago' : 'Pendente'}</button>`;
      } else if (ui.tab === 'receita' && r.pending) {
        label = `<button class="tag status pending" data-receive="${r.id}" title="Marcar como recebido">A receber</button>`;
      } else {
        label = tagHtml(cat(r.category));
      }
      if (r.installment) extra = `<small>${r.installment.i}/${r.installment.n}</small>`;
      if (r.recurring) extra = `<small>↻ mensal</small>`;
      const sign = ui.tab === 'receita' ? '+ ' : '- ';
      const cls = ui.tab === 'receita' ? (r.pending ? '' : 'pos') : '';
      return `<div class="row">
        <span class="date num">${isFixa ? 'Dia ' + pad(r.day) : ddmm(r.shownDate)}</span>
        <div class="name"><span>${esc(r.desc || cat(r.category)?.name || '—')}${extra}</span><div class="tag-m">${label}</div></div>
        <span class="cat">${label}</span>
        <span class="val num ${cls}">${ui.hidden ? '' : sign}${money(r.amount)}</span>
        <button class="edit" data-edit="${r.id}" aria-label="Editar">${ico('pencil', 'width:14px;height:14px')}</button>
      </div>`;
    }).join('');

    const sum = rows.filter(r => !r.pending).reduce((s, r) => s + r.amount, 0);
    const foot = `<div class="total"><span>Total${filtered ? ' filtrado' : ''}</span>
      <strong class="num ${ui.tab === 'receita' ? 'pos' : 'negc'}">${ui.hidden ? '' : ui.tab === 'receita' ? '+ ' : '- '}${money(sum)}</strong></div>`;
    $('#table').innerHTML = head + body + foot;
  }

  function renderChart() {
    let groups = [];
    const key = view.month;
    if (ui.tab === 'fixa') {
      groups = fixasOf(key).map((f, i) => ({ name: f.desc || 'Sem nome', color: PALETTE[i % PALETTE.length], value: f.amount }));
    } else {
      const src = ui.tab === 'receita' ? receitasOf(key).filter(r => !r.pending) : variaveisOf(key);
      const sums = new Map();
      src.forEach(r => sums.set(r.category, (sums.get(r.category) || 0) + r.amount));
      groups = [...sums].map(([id, value]) => { const c = cat(id); return { name: c?.name || 'Sem categoria', color: c?.color || '#94a3b8', value }; });
    }
    groups = groups.filter(g => g.value > 0).sort((a, b) => b.value - a.value);
    const total = groups.reduce((s, g) => s + g.value, 0);

    if (!total) {
      const msg = { receita: 'Sem receita neste mês ainda', fixa: 'Sem despesas fixas ainda', variavel: 'Sem despesas neste mês ainda' }[ui.tab];
      $('#chart').innerHTML = `<div class="chart-empty">${ico('pie')}<span>${msg}</span></div>`;
      return;
    }

    const gap = groups.length > 1 ? 0.8 : 0;
    let offset = 0;
    const arcs = groups.map(g => {
      const len = g.value / total * 100;
      const arc = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${g.color}" stroke-width="5.2"
        stroke-dasharray="${Math.max(len - gap, 0.01)} ${100 - Math.max(len - gap, 0.01)}" stroke-dashoffset="${-offset}"><title>${esc(g.name)}: ${brl.format(g.value / 100)}</title></circle>`;
      offset += len;
      return arc;
    }).join('');

    const label = { receita: 'Receita', fixa: 'Fixas', variavel: 'Variáveis' }[ui.tab];
    $('#chart').innerHTML = `
      <div class="donut-wrap">
        <svg class="donut" viewBox="0 0 42 42">${arcs}</svg>
        <div class="donut-center"><small>${label}</small><strong class="num">${money(total)}</strong></div>
      </div>
      <ul class="legend">${groups.map(g => {
        const pct = Math.round(g.value / total * 100);
        return `<li><span class="ldot" style="background:${g.color}"></span><span class="pct" style="background:${g.color}1f;color:${g.color}">${pct}%</span><span class="lname" title="${esc(g.name)}">${esc(g.name)}</span></li>`;
      }).join('')}</ul>`;
  }

  // Contas fixas vencendo nos próximos 3 dias (ou vencidas) no mês atual
  function dueSoon() {
    const key = mkey(today.getFullYear(), today.getMonth());
    return fixasOf(key).filter(f => !f.paid && Math.min(f.day, daysIn(key)) - today.getDate() <= 3)
      .sort((a, b) => a.day - b.day);
  }
  function renderBell() {
    const list = dueSoon();
    $('#bellDot').hidden = !list.length;
    const key = mkey(today.getFullYear(), today.getMonth());
    $('#bellPop').innerHTML = `<h4>Contas a vencer</h4>` + (list.length ? list.map(f => {
      const diff = Math.min(f.day, daysIn(key)) - today.getDate();
      const when = diff < 0 ? `Venceu há ${-diff} dia${diff === -1 ? '' : 's'}` : diff === 0 ? 'Vence hoje' : `Vence em ${diff} dia${diff === 1 ? '' : 's'}`;
      return `<div class="note"><div><strong>${esc(f.desc)}</strong><small style="color:${diff < 0 ? 'var(--red)' : ''}">${when} · ${money(f.amount)}</small></div><button class="mini" data-bellpay="${f.id}">Paguei</button></div>`;
    }).join('') : `<p class="empty" style="padding:6px 0">Tudo em dia por aqui ✓</p>`);
  }

  // ================= Modal genérico =================
  let onModalClose = null;
  function openModal(html, setup) {
    $('#modal').innerHTML = html;
    $('#overlay').hidden = false;
    onModalClose = null;
    setup && setup($('#modal'));
    const first = $('#modal').querySelector('[autofocus]') || $('#modal').querySelector('input:not([type=checkbox]):not([type=date]), select');
    if (first && matchMedia('(pointer: fine)').matches) setTimeout(() => first.focus(), 30);
  }
  function closeModal() {
    if ($('#overlay').hidden) return;
    $('#overlay').hidden = true;
    onModalClose && onModalClose();
  }
  $('#overlay').addEventListener('mousedown', e => { if (e.target === e.currentTarget) closeModal(); });
  $('#modal').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

  const modalHead = (title, sub) => `<div class="modal-head"><div><h3>${title}</h3><p class="sub">${sub}</p></div>
    <button class="x" type="button" data-close aria-label="Fechar">${ico('x')}</button></div>`;
  const moneyField = (id, cents, label = 'Valor') => `<label class="fl" for="${id}">${label}</label>
    <div class="money"><span>R$</span><input id="${id}" inputmode="numeric" value="${centsText(cents || 0)}" data-cents="${cents || 0}" autocomplete="off" /></div>`;
  const checkField = (id, title, text, checked) => `<label class="check"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''}/>
    <span class="box">${ico('check')}</span><span><strong>${title}</strong>${text ? `<small>${text}</small>` : ''}</span></label>`;
  const catSelect = (kind, selected, label) => `<label class="fl" for="fCategory">${label}</label>
    <select class="select" id="fCategory"><option value="">Selecione…</option>${catsOf(kind).map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    <option value="__new">+ Nova categoria…</option></select>`;
  const footer = (editing) => `<div class="err" id="fErr"></div><div class="actions">
    ${editing ? `<button type="button" class="btn del" id="fDelete">Excluir</button>` : ''}<span class="grow"></span>
    <button type="button" class="btn cancel" data-close>Cancelar</button>
    <button type="submit" class="btn save" id="fSave">${editing ? 'Salvar' : 'Adicionar'}</button></div>`;

  // Campo de valor no estilo app de banco: dígitos entram pelos centavos
  function bindMoney(input, onChange) {
    const set = c => { input.dataset.cents = c; input.value = centsText(c); onChange && onChange(c); };
    input.addEventListener('input', () => set(Number(input.value.replace(/\D/g, '').slice(0, 11)) || 0));
    input.addEventListener('focus', () => setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0));
    return set;
  }
  const cents = input => Number(input.dataset.cents) || 0;

  function bindNewCategory(m, kind) {
    const sel = m.querySelector('#fCategory');
    let prev = sel.value;
    sel.addEventListener('change', () => {
      if (sel.value !== '__new') { prev = sel.value; return; }
      const name = (prompt('Nome da nova categoria:') || '').trim();
      if (!name) { sel.value = prev; return; }
      const c = { id: uid(), kind, name, color: PALETTE[state.categories.filter(x => x.kind === kind).length % PALETTE.length] };
      state.categories.push(c); save();
      sel.insertBefore(new Option(name, c.id), sel.querySelector('[value="__new"]'));
      sel.value = prev = c.id;
    });
  }

  function defaultDate() {
    return view.month === monthOf(todayIso) ? todayIso : `${view.month}-01`;
  }

  // ---------- Receita ----------
  function openReceita(item) {
    const editing = !!item;
    const r = item || { date: defaultDate(), amount: 0, desc: '', category: '', recurring: false, pending: false };
    openModal(`<form id="f">${modalHead(editing ? 'Editar Receita' : 'Nova Receita', r.recurring ? 'Se repete todo mês.' : 'Lançamento deste mês.')}
      <label class="fl" for="fDate">Data</label><input type="date" class="input" id="fDate" value="${r.date}" required />
      ${checkField('fPending', 'Recebimento futuro', 'Não conta na sua receita até você marcar como recebido.', r.pending)}
      ${moneyField('fAmount', r.amount)}
      <label class="fl" for="fDesc">Descrição</label><input class="input" id="fDesc" maxlength="60" placeholder="Ex.: Salário, Freela…" value="${esc(r.desc)}" />
      ${catSelect('receita', r.category, 'Tipo de renda')}
      ${checkField('fRecurring', 'Receita recorrente', 'Repete todo mês, como o salário.', r.recurring)}
      ${footer(editing)}</form>`, m => {
      bindMoney(m.querySelector('#fAmount'));
      bindNewCategory(m, 'receita');
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const data = {
          date: m.querySelector('#fDate').value, amount: cents(m.querySelector('#fAmount')),
          desc: m.querySelector('#fDesc').value.trim(), category: m.querySelector('#fCategory').value,
          pending: m.querySelector('#fPending').checked, recurring: m.querySelector('#fRecurring').checked,
        };
        if (!data.date) return showErr('Escolha a data.');
        if (!data.amount) return showErr('Digite o valor.');
        if (data.category === '__new') data.category = '';
        upsertRecurringAware(state.receitas, item, data, 'recurring');
        toast(editing ? 'Receita atualizada' : 'Receita adicionada');
        goToMonthOf(data.date, item);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => removeRecurringAware('receitas', item, item.recurring));
    });
  }

  // ---------- Despesa variável ----------
  function openVariavel(item) {
    const editing = !!item;
    const v = item || { date: defaultDate(), amount: 0, desc: '', category: '' };
    openModal(`<form id="f">${modalHead(editing ? 'Editar Despesa Variável' : 'Nova Despesa Variável', v.installment ? `Parcela ${v.installment.i} de ${v.installment.n}.` : 'Lançamento deste mês.')}
      <label class="fl" for="fDate">Data</label><input type="date" class="input" id="fDate" value="${v.date}" required />
      ${moneyField('fAmount', v.amount)}
      ${editing ? '' : checkField('fInst', 'Parcelado', 'Divide o valor total nos próximos meses.', false) +
        `<div class="inline" id="instBox" hidden><input type="number" class="input" id="fN" min="2" max="48" value="2" /><span id="instHint"></span></div>`}
      <label class="fl" for="fDesc">Descrição</label><input class="input" id="fDesc" maxlength="60" placeholder="Ex.: Mercado, Gasolina…" value="${esc(v.desc)}" />
      ${catSelect('despesa', v.category, 'Categoria')}
      ${footer(editing)}</form>`, m => {
      const amount = m.querySelector('#fAmount');
      const hint = () => {
        if (editing) return;
        const n = Math.max(2, Math.min(48, +m.querySelector('#fN').value || 2));
        m.querySelector('#instHint').textContent = `parcelas de ${brl.format(Math.floor(cents(amount) / n) / 100)}`;
      };
      bindMoney(amount, hint);
      bindNewCategory(m, 'despesa');
      if (!editing) {
        m.querySelector('#fInst').addEventListener('change', e => {
          m.querySelector('#instBox').hidden = !e.target.checked;
          m.querySelector('label[for=fAmount]').textContent = e.target.checked ? 'Valor total' : 'Valor';
          hint();
        });
        m.querySelector('#fN').addEventListener('input', hint);
      }
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const data = {
          date: m.querySelector('#fDate').value, amount: cents(amount),
          desc: m.querySelector('#fDesc').value.trim(), category: m.querySelector('#fCategory').value,
        };
        if (!data.date) return showErr('Escolha a data.');
        if (!data.amount) return showErr('Digite o valor.');
        if (data.category === '__new') data.category = '';
        if (editing) {
          Object.assign(state.variaveis.find(x => x.id === item.id), data);
          toast('Despesa atualizada');
        } else if (m.querySelector('#fInst').checked) {
          const n = Math.max(2, Math.min(48, +m.querySelector('#fN').value || 2));
          const group = uid(), base = Math.floor(data.amount / n), rest = data.amount - base * n;
          for (let i = 0; i < n; i++) {
            const key = addMonths(monthOf(data.date), i);
            state.variaveis.push({ ...data, id: uid(), created: Date.now() + i, date: dateIn(key, +data.date.slice(8)),
              amount: base + (i === 0 ? rest : 0), installment: { group, i: i + 1, n } });
          }
          toast(`Parcelado em ${n}x`);
        } else {
          state.variaveis.push({ ...data, id: uid(), created: Date.now() });
          toast('Despesa adicionada');
        }
        goToMonthOf(data.date, item);
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => {
        const snapshot = JSON.stringify(state.variaveis);
        if (item.installment) {
          if (!confirm(`Excluir todas as ${item.installment.n} parcelas de "${item.desc || 'despesa'}"?`)) return;
          state.variaveis = state.variaveis.filter(x => x.installment?.group !== item.installment.group);
        } else state.variaveis = state.variaveis.filter(x => x.id !== item.id);
        closeModal(); commit();
        toast('Despesa excluída', 'Desfazer', () => { state.variaveis = JSON.parse(snapshot); commit(); });
      });
    });
  }

  // ---------- Despesa fixa ----------
  function openFixa(item) {
    const editing = !!item;
    const f = item || { amount: 0, desc: '', day: +defaultDate().slice(8) };
    openModal(`<form id="f">${modalHead(editing ? 'Editar Despesa Fixa' : 'Nova Despesa Fixa', 'Vale deste mês em diante.')}
      ${moneyField('fAmount', f.amount)}
      <label class="fl" for="fDesc">Descrição</label><input class="input" id="fDesc" maxlength="60" placeholder="Ex.: Aluguel, Internet…" value="${esc(f.desc)}" />
      <label class="fl" for="fDay">Vencimento (dia do mês)</label>
      <select class="select" id="fDay">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${i + 1 === f.day ? 'selected' : ''}>Todo dia ${pad(i + 1)}</option>`).join('')}</select>
      ${footer(editing)}</form>`, m => {
      bindMoney(m.querySelector('#fAmount'));
      m.querySelector('#f').addEventListener('submit', e => {
        e.preventDefault();
        const data = { amount: cents(m.querySelector('#fAmount')), desc: m.querySelector('#fDesc').value.trim(), day: +m.querySelector('#fDay').value };
        if (!data.amount) return showErr('Digite o valor.');
        if (!data.desc) return showErr('Dê um nome, ex.: Aluguel.');
        if (!editing) {
          state.fixas.push({ ...data, id: uid(), created: Date.now(), start: view.month });
        } else if (item.start < view.month && (item.amount !== data.amount || item.day !== data.day || item.desc !== data.desc)) {
          // Mudou no meio do caminho: encerra a antiga no mês anterior e cria a nova a partir deste mês
          const old = state.fixas.find(x => x.id === item.id);
          const end = old.end;
          old.end = addMonths(view.month, -1);
          const nf = { ...data, id: uid(), created: old.created, start: view.month, end };
          state.fixas.push(nf);
          if ((state.paid[view.month] || []).includes(old.id)) state.paid[view.month].push(nf.id);
        } else {
          Object.assign(state.fixas.find(x => x.id === item.id), data);
        }
        toast(editing ? 'Despesa fixa atualizada' : 'Despesa fixa adicionada');
        commit();
      });
      if (editing) m.querySelector('#fDelete').addEventListener('click', () => removeRecurringAware('fixas', item, true));
    });
  }

  function showErr(msg) { $('#fErr').textContent = msg; }

  // Edição de receita recorrente: mudanças valem deste mês em diante
  function upsertRecurringAware(list, item, data) {
    if (!item) { list.push({ ...data, id: uid(), created: Date.now() }); return; }
    const old = list.find(x => x.id === item.id);
    const startKey = monthOf(old.date);
    if (old.recurring && startKey < view.month && data.recurring) {
      const changed = old.amount !== data.amount || old.desc !== data.desc || old.category !== data.category || +old.date.slice(8) !== +data.date.slice(8) || old.pending !== data.pending;
      if (changed) {
        const end = old.end;
        old.end = addMonths(view.month, -1);
        list.push({ ...data, id: uid(), created: old.created, date: dateIn(view.month, +data.date.slice(8)), end });
        return;
      }
      return;
    }
    Object.assign(old, data);
    if (!data.recurring) delete old.end;
  }

  // Exclusão de algo recorrente: se já existia antes, para de repetir a partir deste mês
  function removeRecurringAware(listName, item, recurring) {
    const snapshot = JSON.stringify(state[listName]);
    const list = state[listName];
    const obj = list.find(x => x.id === item.id);
    const startKey = listName === 'fixas' ? obj.start : monthOf(obj.date);
    if (recurring && startKey < view.month) {
      obj.end = addMonths(view.month, -1);
      toast('Removida deste mês em diante', 'Desfazer', undo);
    } else {
      state[listName] = list.filter(x => x.id !== item.id);
      toast('Excluída', 'Desfazer', undo);
    }
    function undo() { state[listName] = JSON.parse(snapshot); commit(); }
    closeModal(); commit();
  }

  function goToMonthOf(date, editingItem) {
    if (!editingItem) view.month = monthOf(date);
  }
  function commit() { save(); closeModal(); render(); }

  // ---------- Investir ----------
  function openInvest() {
    const t = totals(view.month);
    let pct = t.pct;
    openModal(`${modalHead('Investir', 'Quanto da sua receita você reserva pra investir.')}
      <div class="big-pct num" id="iPct"></div>
      <input type="range" class="range" id="iRange" min="0" max="100" step="1" aria-label="Percentual" />
      <div class="presets">${[10, 20, 30, 40, 50].map(p => `<button type="button" data-p="${p}">${p}%</button>`).join('')}</div>
      <div class="inv-label">Valor a investir</div>
      <div class="inv-value"><span>R$</span><input id="iVal" inputmode="numeric" aria-label="Valor a investir" /></div>
      <p class="hint">${t.receita ? 'Toque no valor pra digitar. O percentual se ajusta sozinho.' : 'Adicione uma receita neste mês para calcular o valor.'}</p>
      <div class="actions"><span class="grow"></span><button class="btn cancel" data-close>Cancelar</button><button class="btn save" id="iSave">Salvar</button></div>`, m => {
      const val = m.querySelector('#iVal'), range = m.querySelector('#iRange');
      const draw = (fromValue) => {
        m.querySelector('#iPct').textContent = fmtPct(pct);
        range.value = Math.round(pct);
        m.querySelectorAll('.presets button').forEach(b => b.classList.toggle('on', +b.dataset.p === Math.round(pct * 10) / 10));
        if (!fromValue) { const c = Math.round(t.receita * pct / 100); val.dataset.cents = c; val.value = centsText(c); }
        val.style.width = Math.max(val.value.length, 4) + 1 + 'ch';
      };
      bindMoney(val, c => {
        if (!t.receita) { pct = 0; return draw(false); }
        const cc = Math.min(c, t.receita);
        pct = Math.round(cc / t.receita * 1000) / 10;
        if (cc !== c) { val.dataset.cents = cc; val.value = centsText(cc); }
        draw(true);
      });
      range.addEventListener('input', () => { pct = +range.value; draw(false); });
      m.querySelector('.presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { pct = +b.dataset.p; draw(false); } });
      draw(false);
      m.querySelector('#iSave').addEventListener('click', () => {
        state.invest[view.month] = pct;
        commit(); toast('Meta de investimento salva');
      });
    });
  }

  // ---------- Categorias ----------
  function openCategories() {
    const kind = ui.tab === 'receita' ? 'receita' : 'despesa';
    const draw = m => {
      m.querySelector('#catList').innerHTML = catsOf(kind).map(c => `<div class="cat-edit" data-id="${c.id}">
        <label class="swatch" style="background:${c.color}" title="Mudar cor"><input type="color" value="${c.color}" data-color /></label>
        <input class="input" value="${esc(c.name)}" maxlength="30" data-name aria-label="Nome da categoria" />
        <button class="x" data-remove aria-label="Excluir categoria">${ico('x')}</button></div>`).join('');
    };
    openModal(`${modalHead('Categorias', kind === 'receita' ? 'Tipos de renda.' : 'Categorias das despesas variáveis.')}
      <div id="catList"></div>
      <button class="btn-soft" id="catAdd" style="margin-top:12px">${ico('plus')}Nova categoria</button>
      <div class="actions"><span class="grow"></span><button class="btn save" data-close>Pronto</button></div>`, m => {
      draw(m);
      onModalClose = () => { save(); render(); };
      m.querySelector('#catList').addEventListener('input', e => {
        const row = e.target.closest('.cat-edit'); const c = cat(row.dataset.id);
        if (e.target.matches('[data-name]')) c.name = e.target.value.trim() || c.name;
        if (e.target.matches('[data-color]')) { c.color = e.target.value; row.querySelector('.swatch').style.background = c.color; }
        save();
      });
      m.querySelector('#catList').addEventListener('click', e => {
        if (!e.target.closest('[data-remove]')) return;
        const id = e.target.closest('.cat-edit').dataset.id;
        const used = [...state.receitas, ...state.variaveis].filter(x => x.category === id).length;
        if (used && !confirm(`${used} lançamento(s) usam esta categoria e ficarão "Sem categoria". Excluir mesmo assim?`)) return;
        state.categories = state.categories.filter(c => c.id !== id);
        save(); draw(m);
      });
      m.querySelector('#catAdd').addEventListener('click', () => {
        state.categories.push({ id: uid(), kind, name: 'Nova categoria', color: PALETTE[catsOf(kind).length % PALETTE.length] });
        save(); draw(m);
        const inputs = m.querySelectorAll('[data-name]'); const last = inputs[inputs.length - 1];
        last.focus(); last.select();
      });
    });
  }

  // ---------- Menu ----------
  function openMenu() {
    openModal(`${modalHead('Configurações', 'Seus dados ficam salvos só neste navegador.')}
      <p class="fl" style="margin-top:4px">Fonte</p>
      <div class="font-pick" id="mFonts">${FONTS.map(f => `<button type="button" data-font="${f}" style="font-family:'${f}'" class="${f === ui.font ? 'on' : ''}"><span>Aa</span>${f}</button>`).join('')}</div>
      <p class="fl">Dados</p>
      <button class="menu-item" id="mCsv">📄 Exportar mês para planilha (CSV)</button>
      <button class="menu-item" id="mBackup">💾 Fazer backup completo</button>
      <button class="menu-item" id="mRestore">📂 Restaurar backup</button>
      <button class="menu-item danger" id="mClear">🗑️ Apagar tudo</button>
      <div class="actions"><span class="grow"></span><button class="btn cancel" data-close>Fechar</button></div>`, m => {
      m.querySelector('#mFonts').onclick = e => {
        const b = e.target.closest('[data-font]'); if (!b) return;
        applyFont(b.dataset.font, true);
        m.querySelectorAll('#mFonts button').forEach(x => x.classList.toggle('on', x === b));
      };
      m.querySelector('#mCsv').onclick = () => { exportCsv(); closeModal(); };
      m.querySelector('#mBackup').onclick = () => { download(`orcamento-backup-${todayIso}.json`, JSON.stringify(state, null, 2), 'application/json'); closeModal(); };
      m.querySelector('#mRestore').onclick = () => $('#importFile').click();
      m.querySelector('#mClear').onclick = () => {
        if (!confirm('Apagar todos os lançamentos? Isso não pode ser desfeito.')) return;
        state = blank(); commit(); toast('Tudo apagado');
      };
    });
  }

  function download(name, content, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportCsv() {
    const key = view.month;
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const val = c => (c / 100).toFixed(2).replace('.', ',');
    const d = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
    const lines = [['Data', 'Tipo', 'Descrição', 'Categoria / Status', 'Valor']];
    receitasOf(key).forEach(r => lines.push([d(r.shownDate), 'Receita', r.desc, r.pending ? 'A receber' : cat(r.category)?.name, val(r.amount)]));
    fixasOf(key).forEach(f => lines.push([d(f.shownDate), 'Despesa fixa', f.desc, f.paid ? 'Pago' : 'Pendente', val(-f.amount)]));
    variaveisOf(key).forEach(v => lines.push([d(v.shownDate), 'Despesa variável', v.desc + (v.installment ? ` (${v.installment.i}/${v.installment.n})` : ''), cat(v.category)?.name, val(-v.amount)]));
    const t = totals(key);
    lines.push([], ['', 'Receita', '', '', val(t.receita)], ['', 'Investir', '', fmtPct(t.pct), val(-t.investir)], ['', 'Despesas', '', '', val(-t.despesas)], ['', 'Saldo', '', '', val(t.saldo)]);
    download(`orcamento-${key}.csv`, '﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  }

  $('#importFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      let next;
      if (Array.isArray(data.receitas) && Array.isArray(data.variaveis)) next = { ...blank(), ...data };
      else if (Array.isArray(data.transactions)) next = migrate(data);
      else throw new Error('formato');
      if (!confirm('Restaurar este backup? Os dados atuais serão substituídos.')) return;
      state = next; commit(); toast('Backup restaurado');
    } catch (_) { toast('Arquivo de backup inválido'); }
  });

  // ================= Eventos =================
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.tab = b.dataset.tab; view.cat = ''; saveUi();
    fillFilter(); render();
  });
  $('#prevMonth').addEventListener('click', () => { view.month = addMonths(view.month, -1); render(); });
  $('#nextMonth').addEventListener('click', () => { view.month = addMonths(view.month, 1); render(); });
  $('#monthLabel').addEventListener('click', () => { view.month = monthOf(todayIso); render(); });
  $('#eyeBtn').addEventListener('click', () => { ui.hidden = !ui.hidden; saveUi(); render(); });
  $('#investBtn').addEventListener('click', openInvest);
  $('#manageBtn').addEventListener('click', openCategories);
  $('#menuBtn').addEventListener('click', openMenu);
  $('#themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    const root = document.documentElement;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return applyTheme(next, true);
    // Navegadores modernos: o próprio navegador faz um fade entre o tema antigo e o novo
    if (document.startViewTransition) return document.startViewTransition(() => applyTheme(next, true));
    // Reserva: transição de cores só durante a troca, removida depois que tudo terminou
    root.classList.add('theme-anim');
    applyTheme(next, true);
    clearTimeout(themeTimer);
    themeTimer = setTimeout(() => root.classList.remove('theme-anim'), 900);
  });

  const openAdd = () => ({ receita: openReceita, fixa: openFixa, variavel: openVariavel })[ui.tab]();
  $('#addBtn').addEventListener('click', () => openAdd());

  $('#table').addEventListener('click', e => {
    if (e.target.closest('[data-add]')) return openAdd();
    if (e.target.closest('#sortBtn')) { ui.sortAsc = !ui.sortAsc; saveUi(); return renderTable(); }
    const pay = e.target.closest('[data-pay]');
    if (pay) return togglePaid(pay.dataset.pay, view.month);
    const rec = e.target.closest('[data-receive]');
    if (rec) {
      const r = state.receitas.find(x => x.id === rec.dataset.receive);
      r.pending = false; save(); render(); toast('Marcado como recebido');
      return;
    }
    const ed = e.target.closest('[data-edit]');
    if (!ed) return;
    const id = ed.dataset.edit;
    if (ui.tab === 'receita') {
      // Receita recorrente abre com a data deste mês
      const r = state.receitas.find(x => x.id === id);
      openReceita(r.recurring ? { ...r, date: dateIn(view.month, +r.date.slice(8)) } : r);
    }
    else if (ui.tab === 'fixa') openFixa(state.fixas.find(x => x.id === id));
    else openVariavel(state.variaveis.find(x => x.id === id));
  });

  function togglePaid(id, key) {
    const list = state.paid[key] ||= [];
    const i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1); else list.push(id);
    save(); render();
  }

  // Popovers
  function togglePop(pop, show) {
    const willShow = show ?? pop.hidden;
    document.querySelectorAll('.pop').forEach(p => { p.hidden = true; });
    pop.hidden = !willShow;
  }
  $('#bellBtn').addEventListener('click', e => { e.stopPropagation(); togglePop($('#bellPop')); });
  $('#filterBtn').addEventListener('click', e => { e.stopPropagation(); togglePop($('#filterPop')); if (!$('#filterPop').hidden) $('#fSearch').focus(); });
  document.addEventListener('click', e => { if (!e.target.closest('.pop')) document.querySelectorAll('.pop').forEach(p => { p.hidden = true; }); });
  $('#bellPop').addEventListener('click', e => {
    const b = e.target.closest('[data-bellpay]');
    if (b) { togglePaid(b.dataset.bellpay, monthOf(todayIso)); toast('Conta marcada como paga'); }
  });

  function fillFilter() {
    const sel = $('#fCat');
    sel.hidden = ui.tab === 'fixa';
    const kind = ui.tab === 'receita' ? 'receita' : 'despesa';
    sel.innerHTML = `<option value="">Todas as categorias</option>` + catsOf(kind).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    sel.value = view.cat;
  }
  $('#fSearch').addEventListener('input', e => { view.query = e.target.value; render(); });
  $('#fCat').addEventListener('change', e => { view.cat = e.target.value; render(); });
  $('#fClear').addEventListener('click', () => { view.query = ''; view.cat = ''; $('#fSearch').value = ''; $('#fCat').value = ''; render(); togglePop($('#filterPop'), false); });

  // Atalhos: N = novo, ← → = mês, Esc = fechar
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); togglePop($('#filterPop'), false); return; }
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
    if (typing || !$('#overlay').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openAdd(); }
    if (e.key === 'ArrowLeft') { view.month = addMonths(view.month, -1); render(); }
    if (e.key === 'ArrowRight') { view.month = addMonths(view.month, 1); render(); }
  });

  // ================= Tema e aviso =================
  let themeTimer;
  function applyTheme(theme, persist) {
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0f1114' : '#eef0f2';
    if (persist) { ui.theme = theme; saveUi(); }
  }
  function applyFont(font, persist) {
    if (!FONTS.includes(font)) font = FONTS[0];
    document.documentElement.style.setProperty('--font', `"${font}"`);
    if (persist) { ui.font = font; saveUi(); }
  }
  applyFont(ui.font);
  applyTheme(ui.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  let toastTimer;
  function toast(msg, actionLabel, action) {
    const el = $('#toast');
    el.textContent = msg;
    if (actionLabel) {
      const b = document.createElement('button');
      b.textContent = actionLabel;
      b.onclick = () => { action(); el.classList.remove('show'); };
      el.append(b);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), actionLabel ? 5000 : 2200);
  }

  fillFilter();
  render();
})();
  </script>
</body>
</html>
