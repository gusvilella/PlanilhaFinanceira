  // ================= Importar extrato (CSV / OFX) =================
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();

  // "1.234,56", "-R$ 12,00", "1234.56", "(45,00)" -> centavos com sinal
  function parseMoney(raw) {
    let t = String(raw || '').trim();
    const negParen = /^\(.*\)$/.test(t);
    t = t.replace(/[R$\s()]/g, '');
    const neg = negParen || t.startsWith('-') || /d$/i.test(t);
    t = t.replace(/^[-+]/, '').replace(/[a-z]$/i, '');
    const lastComma = t.lastIndexOf(','), lastDot = t.lastIndexOf('.');
    if (lastComma > lastDot) t = t.replace(/\./g, '').replace(',', '.');
    else t = t.replace(/,/g, '');
    const v = Math.round(parseFloat(t) * 100);
    return isNaN(v) ? null : neg ? -v : v;
  }
  // "2026-09-15", "15/09/2026", "15/09/26", "20260915..." -> ISO
  function parseDate(raw) {
    const t = String(raw || '').trim();
    let m;
    if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
    if ((m = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
    if ((m = t.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
    return null;
  }
  function splitCsvLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (ch === sep && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(x => x.trim());
  }
  function parseCsv(text) {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
    // acha a linha de cabeçalho (alguns bancos põem umas linhas de título antes)
    const hi = lines.findIndex(l => { const n = norm(l); return /data|date/.test(n) && /valor|amount|quantia|entrada|saida|credito|debito/.test(n); });
    if (hi < 0) return parseCsvNoHeader(lines);
    const header = lines[hi];
    const sep = csvSep(header);
    const cols = splitCsvLine(header, sep).map(norm);
    const find = (re, not) => cols.findIndex(c => re.test(c) && !/saldo|balance/.test(c) && !(not && not.test(c)));
    const first = (...ix) => ix.find(i => i >= 0) ?? -1;
    // data: "Data", "Data Lançamento", "date"; senão qualquer coluna com data ("RELEASE_DATE" do Mercado Pago)
    const iDate = first(find(/^(data|date|dt)/), find(/date|data/));
    // valor em reais primeiro (o C6 tem "Valor (em US$)" e "Valor (em R$)"); nunca a cotação do dólar
    const iAmt = first(find(/(valor|amount|quantia).*(r\$|brl|reais)/), find(/(valor|amount|quantia)/, /us\$|usd|dolar|cotacao/));
    // extratos com colunas separadas de entrada e saída (C6, alguns bancos)
    const iIn = find(/^(entrada|credito|credit)/), iOut = find(/^(saida|debito|debit)/);
    const skip = i => i !== iDate && i !== iAmt && i !== iIn && i !== iOut;
    // descrição: procura por ordem de preferência, sem pegar as colunas de data e valor ("Data Lançamento")
    const iDesc = [/descri/, /title|titulo/, /hist/, /estabelecimento|memo|detalhe/, /nome/, /lancamento/, /transaction_type|tipo de transacao/]
      .map(re => cols.findIndex((c, i) => re.test(c) && skip(i))).find(i => i >= 0) ?? -1;
    // complemento: "Histórico"/"Título" junto da descrição (Inter: "Pix enviado - Fulano")
    const iHist = cols.findIndex((c, i) => /^(hist|titulo|title|lancamento$)/.test(c) && skip(i) && i !== iDesc);
    // coluna de tipo (BB: "Tipo Lançamento" = Saída/Entrada; outros: "D/C"): valores sem sinal viram saída quando é débito
    const iType = cols.findIndex((c, i) => /^(tipo|natureza|d\/c|c\/d|dc|cd|debito\/credito|credito\/debito)/.test(c) && skip(i) && i !== iDesc && i !== iHist);
    const iParc = cols.findIndex(c => /^parcela/.test(c));
    if (iDate < 0 || (iAmt < 0 && (iIn < 0 || iOut < 0))) throw new Error('Não achei as colunas de data e valor no arquivo.');
    return lines.slice(hi + 1).map(l => splitCsvLine(l, sep)).map(c => {
      let amount = iAmt >= 0 ? parseMoney(c[iAmt]) : (parseMoney(c[iIn]) || 0) - Math.abs(parseMoney(c[iOut]) || 0);
      if (iType >= 0 && amount > 0 && /^(d|deb|debito|saida|debit)\b/.test(norm(c[iType]))) amount = -amount;
      const main = iDesc >= 0 ? c[iDesc] || '' : '', hist = iHist >= 0 ? c[iHist] || '' : '';
      let desc = hist && main && norm(hist) !== norm(main) ? `${hist} - ${main}` : main || hist;
      const parc = iParc >= 0 && (c[iParc] || '').match(/^\s*(\d+)\s*(?:\/|de)\s*(\d+)/);
      if (parc && !/\d+\/\d+/.test(desc)) desc += ` (${parc[1]}/${parc[2]})`;
      return { date: parseDate(c[iDate]), amount, desc: desc.trim() || 'Lançamento' };
    }).filter(r => r.date && r.amount && !/^saldo\b|^s a l d o/.test(norm(r.desc)));
  }
  const csvSep = line => { const n = ch => line.split(ch).length - 1; return n(';') > n(',') ? ';' : n('\t') > n(',') ? '\t' : ','; };
  // Extrato sem cabeçalho (ex.: Itaú: "01/09/2026;PIX TRANSF FULANO;-50,00"): data, descrição e valor em cada linha
  function parseCsvNoHeader(lines) {
    const sep = csvSep(lines.find(l => /\d{1,2}\/\d{1,2}\/\d{2,4}/.test(l)) || lines[0] || '');
    const isMoney = v => /^\(?-?\s*(r\$)?\s*-?[\d.]+,\d{2}\)?[cd]?$|^-?\d+\.\d{2}$/i.test(String(v).replace(/\s/g, ''));
    const rows = lines.map(l => splitCsvLine(l, sep)).map(c => {
      const di = c.findIndex(v => parseDate(v));
      if (di < 0) return null;
      const mi = c.map((v, i) => i).filter(i => i !== di && isMoney(c[i]));
      if (!mi.length) return null;
      // valor: o primeiro número em dinheiro depois da data (o último costuma ser o saldo, quando há dois)
      const ai = mi.length > 1 ? mi[0] : mi[mi.length - 1];
      const desc = c.filter((v, i) => i !== di && !mi.includes(i) && !parseDate(v) && /[a-z]/i.test(v)).sort((a, b) => b.length - a.length)[0] || 'Lançamento';
      return { date: parseDate(c[di]), amount: parseMoney(c[ai]), desc };
    }).filter(r => r && r.amount && !/^saldo\b|^s a l d o/.test(norm(r.desc)));
    if (!rows.length) throw new Error('Não achei as colunas de data e valor no arquivo.');
    return rows;
  }
  function parseOfx(text) {
    const tag = (blk, name) => { const m = blk.match(new RegExp('<' + name + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    return (text.match(/<STMTTRN>[\s\S]*?(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>)/gi) || []).map(b => ({
      date: parseDate(tag(b, 'DTPOSTED')), amount: parseMoney(tag(b, 'TRNAMT').replace(',', '.')),
      desc: tag(b, 'MEMO') || tag(b, 'NAME') || 'Lançamento',
    })).filter(r => r.date && r.amount);
  }

  // Sugestão de categoria: primeiro pelo que você já categorizou com a mesma descrição, depois por palavras-chave
  const CAT_RULES = [
    ['Mercado', /supermerc|mercado|carrefour|assai|atacad|pao de acucar|hortifruti|sams club|\bdia\b|extra |zaffari|savegnago|guanabara/],
    ['Comida', /ifood|rappi|restaur|lanch|padaria|pizz|burger|mcdonald|\bbk\b|subway|cafe|starbucks|outback|sushi|acai|delivery|bar |cantina/],
    ['Carro', /posto|combust|shell|ipiranga|petrobras|\bbr\b|estacion|sem parar|conectcar|veloe|uber|\b99\b|99app|pedagio|ipva|detran|oficina|auto pecas/],
    ['Saúde', /farmac|drogar|droga raia|drogasil|pague menos|panvel|hospital|clinic|laborat|unimed|odonto|dentist|medic|amil|hapvida/],
    ['Contas', /enel|cemig|\blight\b|copel|celesc|sabesp|sanepar|copasa|energia|agua|\bgas\b|comgas|vivo|claro|\btim\b|\boi\b|internet|condomin|aluguel/],
    ['Lazer', /cinema|ingresso|steam|playstation|xbox|show|teatro|netflix|spotify|disney|hbo|prime video|crunchyroll|viagem|hotel|airbnb/],
    ['Casa', /leroy|telhanorte|magazine|casas bahia|mobly|tok ?stok|amazon|mercado livre|shopee|americanas|kabum/],
  ];
  function suggestCategory(desc, kind) {
    const n = norm(desc);
    const past = [...(kind === 'receita' ? state.receitas : state.variaveis)].reverse().find(x => x.category && norm(x.desc) === n);
    if (past) return past.category;
    const byName = name => catsOf(kind).find(c => norm(c.name) === norm(name))?.id;
    if (kind === 'receita') return byName(/salar|folha|provento|pagto salar/.test(n) ? 'Salário' : /rendimento|juros|dividend/.test(n) ? 'Rendimentos' : 'Outros') || '';
    for (const [name, re] of CAT_RULES) if (re.test(n)) return byName(name) || '';
    return byName('Outros') || '';
  }

  // Planilha do Excel (.xlsx): é um zip com XMLs. Abre com o descompactador do próprio navegador, lê a primeira
  // aba e devolve as linhas como texto separado por ";" para o mesmo leitor de CSV.
  async function xlsxToCsv(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('Não consegui abrir essa planilha.');
    const files = {};
    for (let k = 0, p = dv.getUint32(eocd + 16, true), n = dv.getUint16(eocd + 10, true); k < n; k++) {
      const nlen = dv.getUint16(p + 28, true);
      files[dec.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
      p += 46 + nlen + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
    }
    const read = async name => {
      const f = files[name]; if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), data = u8.subarray(start, start + f.size);
      if (f.method === 0) return dec.decode(data);
      if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador não abre planilhas do Excel. Salve como CSV no Excel e importe o CSV.');
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
    const xml = t => new DOMParser().parseFromString(t, 'application/xml');
    const tags = (el, name) => [...el.getElementsByTagName(name)];
    const ssXml = await read('xl/sharedStrings.xml');
    const shared = ssXml ? tags(xml(ssXml), 'si').map(si => tags(si, 't').map(t => t.textContent).join('')) : [];
    // estilos de data (formatos 14–22 e 45–47 prontos, ou formatos próprios com d/m/a)
    const dateXf = new Set(), stXml = await read('xl/styles.xml');
    if (stXml) {
      const st = xml(stXml), custom = {};
      tags(st, 'numFmt').forEach(f => { custom[f.getAttribute('numFmtId')] = f.getAttribute('formatCode') || ''; });
      const xfs = st.getElementsByTagName('cellXfs')[0];
      if (xfs) tags(xfs, 'xf').forEach((xf, i) => { const id = +xf.getAttribute('numFmtId');
        if ((id >= 14 && id <= 22) || (id >= 45 && id <= 47) || (custom[id] && /[dy]/i.test(custom[id].replace(/"[^"]*"|\[[^\]]*\]/g, '')))) dateXf.add(i); });
    }
    const sheetName = files['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml' : Object.keys(files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    if (!sheetName) throw new Error('A planilha está vazia.');
    const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+$/, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const serialDate = v => { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(+v * 864e5)); return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`; };
    const lines = tags(xml(await read(sheetName)), 'row').map(row => {
      const out = [];
      tags(row, 'c').forEach(c => {
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent ?? '';
        let val = t === 's' ? shared[+v] ?? '' : t === 'inlineStr' ? tags(c, 't').map(x => x.textContent).join('') : v;
        if ((!t || t === 'n') && v !== '' && dateXf.has(+c.getAttribute('s')) && +v > 20000 && +v < 80000) val = serialDate(v);
        out[c.getAttribute('r') ? colIdx(c.getAttribute('r')) : out.length] = val;
      });
      return Array.from(out, x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';');
    });
    return lines.join('\n');
  }

  $('#stmtFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    if (/\.xls$/i.test(file.name)) return toast('Planilha .xls antiga: abra no Excel e salve como .xlsx ou CSV.');
    let text;
    if (/\.xlsx$/i.test(file.name)) {
      try { text = await xlsxToCsv(await file.arrayBuffer()); }
      catch (err) { return toast(err.message || 'Não consegui abrir essa planilha'); }
    } else text = await file.text();
    // extratos antigos em Latin-1 aparecem com "�": relê na codificação certa
    if (!/\.xlsx$/i.test(file.name) && text.includes('\ufffd')) text = new TextDecoder('windows-1252').decode(await file.arrayBuffer());
    let rows;
    try { rows = /<OFX>|OFXHEADER/i.test(text) ? parseOfx(text) : parseCsv(text); }
    catch (err) { return toast(err.message || 'Não consegui ler esse arquivo'); }
    if (!rows.length) return toast('Não encontrei lançamentos nesse arquivo');
    openImport(rows, file.name);
  });

  function openImport(raw, fileName) {
    // Fonte do extrato: conta (negativo = saída) ou cartão (positivo = compra)
    const nameHint = norm(fileName);
    const guessCard = /fatura|cartao|card|credit/.test(nameHint) || raw.filter(r => r.amount > 0).length > raw.length * 0.7;
    let source = guessCard && state.cards.length ? 'card:' + state.cards[0].id : state.accounts.length ? 'acc:' + state.accounts[0].id : '';
    let invert = false;
    // índices montados uma vez (antes, cada linha do extrato varria todos os lançamentos, lento com extratos grandes)
    const dupIdx = list => { const exact = new Set(), imp = new Set(); for (const x of list) { exact.add(`${x.date}|${x.amount}|${norm(x.desc)}`); if (x.imported) imp.add(`${x.date}|${x.amount}`); } return { exact, imp }; };
    const dups = { receita: dupIdx(state.receitas), variavel: dupIdx(state.variaveis) };
    const isDup = (r, kind) => { const d = dups[kind], a = Math.abs(r.amount); return d.exact.has(`${r.date}|${a}|${norm(r.desc)}`) || d.imp.has(`${r.date}|${a}`); };
    const catMemo = new Map();
    const catFor = (desc, kind) => { const k = kind + '|' + norm(desc); if (!catMemo.has(k)) catMemo.set(k, suggestCategory(desc, kind)); return catMemo.get(k); };
    const build = () => raw.map(r => {
      const amt = invert ? -r.amount : r.amount;
      const card = source.startsWith('card:');
      const out = card ? amt > 0 : amt < 0;          // é gasto?
      const kind = out ? 'variavel' : 'receita';
      const sub = out ? subFor(r.desc, monthOf(r.date)) : null;
      const skipReason = card && !out ? 'pagamento ou estorno' : /pagamento.*fatura|fatura.*(cartao|card)|pgto.*fat|pag fat/.test(norm(r.desc)) ? 'pagamento de fatura' : isDup(r, kind === 'variavel' ? 'variavel' : 'receita') ? 'já lançado' : sub ? 'já está em Assinaturas' : '';
      return { ...r, amount: Math.abs(amt), kind, on: !skipReason, skipReason, sub: sub?.id, category: catFor(r.desc, kind === 'variavel' ? 'despesa' : 'receita') };
    }).sort((a, b) => b.date.localeCompare(a.date));
    let rows = build();
    openModal(`${modalHead('Importar extrato', `${esc(fileName)} · ${raw.length} lançamentos encontrados`)}
      <div class="imp-top">
        <label class="fl" style="margin:0">De onde é esse extrato?</label>
        <div class="bank-chips pay-pick" id="impSrc">${payOptionsHtml(source, { attr: 'data-src', noneLabel: 'Nenhuma conta' })}</div>
        <label class="check" style="margin:0"><input type="checkbox" id="impInv" /><span class="box">${ico('check')}</span><span><strong>Inverter entradas e saídas</strong><small>Use se os gastos aparecerem como entradas.</small></span></label>
      </div>
      <div class="imp-sum" id="impSum"></div>
      <div class="imp-list" id="impList"></div>
      <div class="actions"><button type="button" class="link" id="impAll">Marcar/desmarcar tudo</button><span class="grow"></span>
        <button type="button" class="btn cancel" data-close>Cancelar</button><button type="button" class="btn save" id="impGo">Importar</button></div>`, m => {
      m.classList.add('wide');
      onModalClose = () => m.classList.remove('wide');
      const draw = () => {
        const opt = kind => `<option value="">Sem categoria</option>` + catsOf(kind).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        m.querySelector('#impList').innerHTML = rows.map((r, i) => `<div class="imp-row ${r.on ? '' : 'off'}" data-i="${i}">
          <input type="checkbox" ${r.on ? 'checked' : ''} aria-label="Importar este lançamento" />
          <span class="d">${ddmm(r.date)}</span>
          <span class="t" title="${esc(r.desc)}">${esc(r.desc)}${r.skipReason ? `<small>${r.skipReason}</small>` : ''}</span>
          <select class="select">${opt(r.kind === 'variavel' ? 'despesa' : 'receita')}</select>
          <span class="v ${r.kind === 'receita' ? 'in' : ''}">${r.kind === 'receita' ? '+ ' : '- '}${brl.format(r.amount / 100)}</span></div>`).join('');
        m.querySelectorAll('.imp-row select').forEach((sel, i) => { sel.value = rows[i].category; });
        sum();
      };
      const sum = () => {
        const on = rows.filter(r => r.on);
        const outs = on.filter(r => r.kind === 'variavel').reduce((s, r) => s + r.amount, 0), ins = on.filter(r => r.kind === 'receita').reduce((s, r) => s + r.amount, 0);
        m.querySelector('#impSum').innerHTML = `<span><b>${on.length}</b> selecionados</span><span>Saídas <b>${brl.format(outs / 100)}</b></span><span>Entradas <b>${brl.format(ins / 100)}</b></span><span>${rows.length - on.length} de fora</span>`;
        m.querySelector('#impGo').textContent = `Importar ${on.length}`;
        m.querySelector('#impGo').disabled = !on.length && !rows.some(r => r.sub);
      };
      m.querySelector('#impSrc').addEventListener('click', e => {
        const b = e.target.closest('[data-src]'); if (!b) return;
        source = b.dataset.src; m.querySelectorAll('#impSrc button').forEach(x => x.classList.toggle('on', x === b));
        rows = build(); draw();
      });
      m.querySelector('#impInv').addEventListener('change', e => { invert = e.target.checked; rows = build(); draw(); });
      m.querySelector('#impList').addEventListener('change', e => {
        const row = e.target.closest('.imp-row'); if (!row) return;
        const r = rows[+row.dataset.i];
        if (e.target.type === 'checkbox') { r.on = e.target.checked; row.classList.toggle('off', !r.on); sum(); }
        else r.category = e.target.value;
      });
      m.querySelector('#impAll').addEventListener('click', () => { const all = rows.every(r => r.on); rows.forEach(r => { r.on = !all; }); draw(); });
      m.querySelector('#impGo').addEventListener('click', () => {
        const on = rows.filter(r => r.on);
        const pay = source.startsWith('card:') ? { payCard: source.slice(5), payAccount: '' } : { payCard: '', payAccount: source.slice(4) };
        const snap = JSON.stringify({ v: state.variaveis, r: state.receitas });
        on.forEach((r, n) => {
          const base = { id: uid(), created: Date.now() + n, date: r.date, amount: r.amount, desc: r.desc.slice(0, 60), category: r.category, imported: true };
          if (r.kind === 'variavel') state.variaveis.push({ ...base, ...pay });
          else state.receitas.push({ ...base, payAccount: pay.payAccount, pending: false, recurring: false });
        });
        // Cobrança de assinatura com valor diferente do cadastrado: avisa do reajuste
        let changed = 0;
        rows.filter(r => r.sub).sort((a, b) => a.date.localeCompare(b.date)).forEach(r => {
          const a = state.assinaturas.find(x => x.id === r.sub);
          const seen = state.subPrice?.[r.sub];
          if (!a || (seen && seen.date > r.date)) return;
          if (r.amount !== a.amount) { (state.subPrice ||= {})[r.sub] = { amount: r.amount, date: r.date }; changed++; }
          else if (seen) delete state.subPrice[r.sub];
        });
        const latest = on.map(r => r.date).sort().pop();
        if (!latest) { commit(); closeModal(); return toast(changed ? 'Uma assinatura mudou de preço, veja no sininho' : 'Nada para importar'); }
        view.month = monthOf(latest); ui.tab = on.some(r => r.kind === 'variavel') ? 'variavel' : 'receita'; saveUi();
        commit(); fillFilter();
        const nFound = detectSubs().length;
        toast(`${on.length} lançamentos importados${nFound ? ` · ${nFound} possíve${nFound > 1 ? 'is' : 'l'} assinatura${nFound > 1 ? 's' : ''} no sininho` : ''}`, 'Desfazer', () => { const o = JSON.parse(snap); state.variaveis = o.v; state.receitas = o.r; commit(); });
      });
      draw();
    });
  }

  // ================= Sincronizar entre aparelhos (GitHub Gist criptografado) =================
  // Os dados vão criptografados (AES-GCM 256, chave derivada da sua senha com PBKDF2) para um Gist secreto da sua
  // conta do GitHub. O GitHub só guarda texto embaralhado. Cada aparelho usa o mesmo token + a mesma senha.
  const SYNC_KEY = 'orcamento:sync', SYNC_FILE = 'orcamento-sync.json';
  let sync = null;
  try { sync = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch (_) {}
  if (sync && (!sync.token || !sync.gistId || !sync.key)) sync = null;   // configuração incompleta: como desligada
  let syncState = { busy: false, error: '', at: sync?.lastSyncAt || 0 };
  const saveSync = () => { try { if (sync) localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); else localStorage.removeItem(SYNC_KEY); } catch (_) {} };
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

  async function deriveKey(pass, saltB64) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(saltB64), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }
  const keyFromRaw = raw => crypto.subtle.importKey('raw', unb64(raw), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  async function encryptState(key, salt) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(state)));
    return JSON.stringify({ app: 'orcamento', v: 1, salt, iv: b64(iv), updatedAt: state.updatedAt || Date.now(), data: b64(data) });
  }
  async function decryptPayload(payload, key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(payload.iv) }, key, unb64(payload.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function gh(path, token, opts = {}) {
    const res = await fetch('https://api.github.com' + path, { ...opts, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (res.status === 401) throw new Error('Token inválido ou expirado.');
    if (res.status === 403 || res.status === 404) throw new Error('O token não tem permissão de Gist.');
    if (!res.ok) throw new Error('GitHub respondeu com erro ' + res.status + '.');
    return res.json();
  }
  async function readGist(token, id) {
    const g = await gh('/gists/' + id, token);
    const f = g.files[SYNC_FILE];
    if (!f) throw new Error('Arquivo de sincronização não encontrado.');
    const content = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    return JSON.parse(content);
  }
  async function findGist(token) {
    for (let page = 1; page <= 5; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`, token);
      const hit = list.find(g => g.files && g.files[SYNC_FILE]);
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    return null;
  }

  function applyRemote(remote, updatedAt) {
    applyingRemote = true;
    state = { ...normalize(remote), updatedAt };
    save();
    applyingRemote = false;
    fillFilter(); render();
  }

  async function pushNow() {
    if (!sync || !navigator.onLine) return;
    syncState = { ...syncState, busy: true, error: '' };
    try {
      const key = await keyFromRaw(sync.key);
      const content = await encryptState(key, sync.salt);
      await gh('/gists/' + sync.gistId, sync.token, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content } } }) });
      sync.lastRemote = state.updatedAt; sync.lastSyncAt = Date.now(); saveSync();
      syncState = { busy: false, error: '', at: sync.lastSyncAt };
    } catch (e) { syncState = { ...syncState, busy: false, error: e.message }; }
    refreshSyncUi();
  }
  async function pullNow(quiet = true) {
    if (!sync || !navigator.onLine) return;
    syncState = { ...syncState, busy: true, error: '' };
    refreshSyncUi();
    try {
      const payload = await readGist(sync.token, sync.gistId);
      const localChanged = (state.updatedAt || 0) > (sync.lastRemote || 0);
      if (payload.updatedAt > (sync.lastRemote || 0) && (!localChanged || payload.updatedAt >= state.updatedAt)) {
        const remote = await decryptPayload(payload, await keyFromRaw(sync.key));
        // este aparelho tinha mudanças que ainda não tinham subido: guarda uma cópia antes de trocar pelos da nuvem
        const localSnap = localChanged ? JSON.stringify(state) : null;
        if (localSnap) try { localStorage.setItem(KEY + ':antes-sync', localSnap); } catch (_) {}
        applyRemote(remote, payload.updatedAt);
        sync.lastRemote = payload.updatedAt;
        if (localSnap) toast('Chegaram dados mais novos de outro aparelho. Guardei uma cópia do que estava aqui.', 'Manter os deste aparelho', () => restoreBeforeSync(), 10000);
        else if (!quiet || document.visibilityState === 'visible') toast('Dados atualizados de outro aparelho ☁️');
      } else if (localChanged) {
        await pushNow();
      }
      sync.lastSyncAt = Date.now(); saveSync();
      syncState = { busy: false, error: '', at: sync.lastSyncAt };
    } catch (e) {
      syncState = { ...syncState, busy: false, error: e.name === 'OperationError' ? 'Senha de sincronização diferente da usada no outro aparelho.' : e.message };
    }
    refreshSyncUi();
  }
  // Volta para a cópia guardada antes da sincronização trocar os dados (e envia ela para a nuvem)
  function restoreBeforeSync() {
    let raw = null; try { raw = localStorage.getItem(KEY + ':antes-sync'); } catch (_) {}
    if (!raw) return toast('Não há cópia guardada');
    const undoSnap = JSON.stringify(state);
    state = normalize(JSON.parse(raw));
    closeModal(); fillFilter(); commit();   // commit salva com horário novo: vira a versão mais nova e sobe para a nuvem
    undoToast('Dados deste aparelho restaurados', undoSnap);
  }
  let syncTimer;
  function scheduleSync() {
    if (!sync) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushNow, 2500);
  }
  function syncStatusText() {
    if (!sync) return 'desligado';
    if (syncState.error) return 'erro';
    if (syncState.busy) return 'sincronizando…';
    if (!syncState.at) return 'ligado';
    const min = Math.round((Date.now() - syncState.at) / 60000);
    return min < 1 ? 'agora' : min < 60 ? `há ${min} min` : new Date(syncState.at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function refreshSyncUi() {
    if (!syncState.busy) renderBell();   // mostra/tira o aviso de sincronização parada no sininho
    const badge = $('#syncBadge'); if (badge) badge.textContent = syncStatusText();
    const box = $('#syncBox'); if (box) box.innerHTML = syncBoxHtml();
  }
  const syncBoxHtml = () => `<div class="sync-status"><span class="dot ${syncState.error ? 'err' : syncState.busy ? 'busy' : ''}"></span>
    <div>${syncState.error ? esc(syncState.error) : syncState.busy ? 'Sincronizando…' : `Sincronizado ${syncStatusText() === 'agora' ? 'agora mesmo' : syncStatusText()}`}</div></div>`;

  function openSync() {
    if (sync) {
      openModal(`${modalHead('Sincronizar entre aparelhos', 'Ligado. As mudanças sobem sozinhas e os outros aparelhos baixam ao abrir o app.')}
        <div id="syncBox">${syncBoxHtml()}</div>
        <p class="help">Dados criptografados com a sua senha num Gist secreto do GitHub. Pra usar em outro aparelho, abra o app lá e conecte com o mesmo token e a mesma senha.</p>
        <div class="actions"><button type="button" class="btn del" id="syncOff">Desconectar</button><span class="grow"></span>
          <button type="button" class="btn cancel" data-close>Fechar</button><button type="button" class="btn save" id="syncNow">Sincronizar agora</button></div>`, m => {
        m.querySelector('#syncNow').onclick = () => pullNow(false);
        m.querySelector('#syncOff').onclick = () => {
          if (!confirm('Desconectar este aparelho? Os dados continuam aqui e na nuvem, só param de sincronizar.')) return;
          sync = null; saveSync(); syncState = { busy: false, error: '', at: 0 }; closeModal(); toast('Sincronização desligada');
        };
      });
      return;
    }
    openModal(`<form id="f">${modalHead('Sincronizar entre aparelhos', 'Use os mesmos dados no celular e no computador, grátis, pelo seu GitHub.')}
      <ol class="sync-steps">
        <li>Crie um token no GitHub só com permissão de Gist: <a href="https://github.com/settings/tokens/new?scopes=gist&description=Orcamento%20app" target="_blank" rel="noopener">abrir o GitHub ↗</a> → role até o fim → <b>Generate token</b> → copie.</li>
        <li>Cole o token aqui e crie uma senha de sincronização. Use <b>o mesmo token e a mesma senha</b> em todos os aparelhos.</li>
      </ol>
      <label class="fl" for="sToken">Token do GitHub</label><input class="input" id="sToken" placeholder="ghp_…" autocomplete="off" spellcheck="false" />
      <label class="fl" for="sPass">Senha de sincronização</label><input class="input" id="sPass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
      <p class="help">🔒 Os dados vão criptografados com essa senha: nem o GitHub consegue ler. Guarde bem: sem ela não dá pra recuperar os dados da nuvem.</p>
      <div class="err" id="fErr"></div>
      <div class="actions"><span class="grow"></span><button type="button" class="btn cancel" data-close>Cancelar</button><button type="submit" class="btn save" id="fSave">Conectar</button></div></form>`, m => {
      m.querySelector('#f').addEventListener('submit', async e => {
        e.preventDefault();
        const token = m.querySelector('#sToken').value.trim(), pass = m.querySelector('#sPass').value;
        if (!token) return showErr('Cole o token do GitHub.');
        if (pass.length < 8) return showErr('A senha precisa ter pelo menos 8 caracteres.');
        const btn = m.querySelector('#fSave'); btn.disabled = true; btn.textContent = 'Conectando…';
        try {
          const id = await findGist(token);
          if (id) {
            const payload = await readGist(token, id);
            const key = await deriveKey(pass, payload.salt);
            let remote;
            try { remote = await decryptPayload(payload, key); } catch (_) { throw new Error('Senha diferente da usada no outro aparelho.'); }
            const raw = b64(await crypto.subtle.exportKey('raw', key));
            const hasLocal = state.receitas.length + state.variaveis.length + state.fixas.length + state.accounts.length + state.cards.length > 0;
            const useCloud = !hasLocal || confirm(`Já existem dados na nuvem (salvos em ${new Date(payload.updatedAt).toLocaleString('pt-BR')}).\n\nOK = usar os dados da nuvem neste aparelho\nCancelar = enviar os dados DESTE aparelho para a nuvem (substitui os de lá)`);
            sync = { token, gistId: id, salt: payload.salt, key: raw, lastRemote: 0 };
            if (useCloud) { applyRemote(remote, payload.updatedAt); sync.lastRemote = payload.updatedAt; sync.lastSyncAt = Date.now(); saveSync(); }
            else { saveSync(); await pushNow(); }
          } else {
            const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
            const key = await deriveKey(pass, salt);
            state.updatedAt = state.updatedAt || Date.now();
            const content = await encryptState(key, salt);
            const g = await gh('/gists', token, { method: 'POST', body: JSON.stringify({ description: 'Orçamento: dados sincronizados (criptografados)', public: false, files: { [SYNC_FILE]: { content } } }) });
            sync = { token, gistId: g.id, salt, key: b64(await crypto.subtle.exportKey('raw', key)), lastRemote: state.updatedAt, lastSyncAt: Date.now() };
            saveSync();
          }
          syncState = { busy: false, error: '', at: Date.now() };
          closeModal(); toast('Sincronização ligada ☁️');
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Conectar';
          showErr(err.message === 'Failed to fetch' ? 'Sem conexão com o GitHub. Verifique a internet.' : err.message);
        }
      });
    });
  }
  // Baixa mudanças ao abrir o app e ao voltar pra ele; envia pendências ao reconectar
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullNow(); });
  window.addEventListener('online', () => pullNow());

  // ================= Lançamento rápido por texto =================
  // Ex.: "mercado 45,90 nubank", "uber 23 credito itau ontem", "recebi 300 freela pix nubank", "cafe 6,5 12/09"
  function parseQuick(text) {
    let t = ' ' + norm(text) + ' ';
    const out = { kind: 'variavel', amount: 0, date: todayIso, payCard: '', payAccount: '', desc: '' };
    // data (antes do valor, pra "12/09" não virar R$ 12)
    let d;
    if (/\bontem\b/.test(t)) { const x = new Date(todayIso + 'T12:00:00'); x.setDate(x.getDate() - 1); out.date = isoOf(x); t = t.replace(/\bontem\b/, ' '); }
    else if (/\banteontem\b/.test(t)) { const x = new Date(todayIso + 'T12:00:00'); x.setDate(x.getDate() - 2); out.date = isoOf(x); t = t.replace(/\banteontem\b/, ' '); }
    else if ((d = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
      out.date = parseDate(d[3] ? d[0] : `${d[0]}/${todayIso.slice(0, 4)}`) || todayIso;
      // sem ano: "28/12" digitado em janeiro é o dezembro que passou, não o do fim do ano
      if (!d[3] && daysUntil(out.date) > 60) out.date = `${+out.date.slice(0, 4) - 1}${out.date.slice(4)}`;
      t = t.replace(d[0], ' ');
    }
    t = t.replace(/\bhoje\b/, ' ');
    // parcelado: "12x", "em 10x", "3 x" (antes do valor, pra "12x" não virar R$ 12)
    const px = t.match(/\b(?:em\s+)?(\d{1,2})\s?x\b/);
    if (px && +px[1] >= 2 && +px[1] <= 48) { out.parcelas = +px[1]; t = t.replace(px[0], ' '); }
    // valor: "45,90", "23", "6,5", "1.500", "1.234,56", "12.5"
    const m = t.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
    if (m) {
      let raw = m[1];
      raw = /^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(raw) ? raw.replace(/\./g, '') : raw.includes(',') ? raw : raw.replace('.', ',');
      out.amount = parseMoney(raw) || 0; t = t.replace(m[0], ' ');
    }
    // transferência entre contas: "transferi 200 nubank itau" (a primeira conta citada é a de onde sai)
    if (/\btransf\w*/.test(t) && state.accounts.length >= 2) {
      const pos = a => [a.name, BRANDS[a.brand]?.name].filter(Boolean).map(n => { const m = t.search(new RegExp('\\b' + norm(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b')); return m; }).filter(i => i >= 0).sort((x, y) => x - y)[0];
      const found = state.accounts.map(a => ({ a, i: pos(a) })).filter(x => x.i !== undefined).sort((x, y) => x.i - y.i);
      if (found.length >= 2) return { ...out, kind: 'transfer', from: found[0].a.id, to: found[1].a.id, desc: 'Transferência', category: '' };
    }
    // entrada?
    if (/\b(recebi|receb\w*|entrada|ganhei|salario|pagamento recebido)\b/.test(t) || /^\s*\+/.test(text)) { out.kind = 'receita'; t = t.replace(/\b(recebi|entrada|ganhei)\b/, ' '); }
    // forma de pagamento: cartão se falar crédito/cartão; senão conta pelo nome do banco
    const credit = /\b(credito|cartao|card|cc)\b/.test(t);
    t = t.replace(/\b(no|na|do|da|de|em|pelo|pela|com|via|credito|cartao|debito|pix|boleto|conta)\b/g, ' ');
    const has = name => { const n = norm(name); return n && (t.includes(' ' + n + ' ') || (n.split(' ')[0].length > 2 && t.includes(' ' + n.split(' ')[0] + ' '))); };
    const takeOut = name => { const n = norm(name); t = t.replace(' ' + n + ' ', ' ').replace(' ' + n.split(' ')[0] + ' ', ' '); };
    const bankWord = c => [c.name, BRANDS[c.bank]?.name, c.last4].filter(Boolean);
    const cards = state.cards.filter(c => activeIn(c, monthOf(out.date)));
    const card = out.kind !== 'receita' && (cards.find(c => c.last4 && t.includes(' ' + c.last4 + ' ')) || (credit || !state.accounts.length ? cards.find(c => bankWord(c).some(has)) : null) || (credit && cards.length === 1 ? cards[0] : null));
    if (card) { out.payCard = card.id; bankWord(card).forEach(takeOut); }
    else { const acc = state.accounts.find(a => has(a.name) || has(BRANDS[a.brand]?.name || '')); if (acc) { out.payAccount = acc.id; takeOut(acc.name); takeOut(BRANDS[acc.brand]?.name || ''); } }
    const words = t.replace(/\s+/g, ' ').trim();
    const orig = String(text).trim().split(/\s+/).filter(w => words.split(' ').includes(norm(w)));
    out.desc = (orig.join(' ') || words).replace(/^./, c => c.toUpperCase());
    out.category = suggestCategory(out.desc, out.kind === 'receita' ? 'receita' : 'despesa');
    return out;
  }
  function saveQuick(q) {
    if (q.kind === 'transfer') {
      const undoSnap = JSON.stringify(state);
      (state.transfers ||= []).push({ id: uid(), created: Date.now(), date: q.date, amount: q.amount, from: q.from, to: q.to, desc: '' });
      commit();
      return undoToast(`${brl.format(q.amount / 100)} transferidos para ${state.accounts.find(a => a.id === q.to)?.name || 'a conta'}`, undoSnap);
    }
    const base = { id: uid(), created: Date.now(), date: q.date, amount: q.amount, desc: q.desc.slice(0, 60), category: q.category };
    if (q.kind !== 'receita' && q.parcelas) {
      // compra parcelada: uma parcela por mês, a primeira leva os centavos que sobram (igual ao formulário)
      const undoSnap = JSON.stringify(state), n = q.parcelas, group = uid(), each = Math.floor(q.amount / n), rest = q.amount - each * n;
      for (let i = 0; i < n; i++) state.variaveis.push({ ...base, id: uid(), created: Date.now() + i, date: dateIn(addMonths(monthOf(q.date), i), +q.date.slice(8)),
        amount: each + (i === 0 ? rest : 0), payCard: q.payCard, payAccount: q.payAccount, installment: { group, i: i + 1, n } });
      commit();
      return undoToast(`${brl.format(q.amount / 100)} em ${n}x de ${brl.format(each / 100)} lançado`, undoSnap);
    }
    if (q.kind === 'receita') state.receitas.push({ ...base, payAccount: q.payAccount, pending: false, recurring: false });
    else state.variaveis.push({ ...base, payCard: q.payCard, payAccount: q.payAccount });
    const list = q.kind === 'receita' ? 'receitas' : 'variaveis', id = base.id;
    commit();
    toast(`${q.kind === 'receita' ? 'Entrada' : 'Gasto'} de ${brl.format(q.amount / 100)} lançado`, 'Desfazer', () => { state[list] = state[list].filter(x => x.id !== id); commit(); });
  }
  function payLabel(q) {
    const c = q.payCard && state.cards.find(x => x.id === q.payCard), a = q.payAccount && state.accounts.find(x => x.id === q.payAccount);
    if (c) return `${logoHtml({ brand: c.bank, name: c.name, icon: c.icon, color: c.color }, 'sm')}${esc(c.name)}${c.last4 ? ' •' + esc(c.last4) : ''} ${flagHtml(c.flag)}`;
    if (a) return `${logoHtml(a, 'sm')}${esc(a.name)}`;
    return 'Não informado';
  }
  function openQuick() {
    state.favorites ||= [];
    openModal(`${modalHead('Lançamento rápido', 'Escreva do seu jeito e aperte Enter.')}
      <input class="input qa-input" id="qaText" placeholder="mercado 45,90 nubank" autocomplete="off" autofocus enterkeyhint="done" />
      <div class="qa-hint">Ex.: <code>uber 23 crédito itaú</code> <code>café 6,50 ontem</code> <code>tv 2400 12x nubank</code> <code>recebi 300 freela pix nubank</code></div>
      <div class="qa-preview" id="qaPrev"></div>
      <p class="fl" style="display:flex;justify-content:space-between;align-items:center">Favoritos <span style="font-weight:500;color:var(--muted);font-size:.74rem">toque pra lançar na hora</span></p>
      <div class="favs" id="qaFavs"></div>
      <div class="actions"><button type="button" class="link" id="qaFull">Formulário completo</button><span class="grow"></span>
        <button type="button" class="btn cancel" id="qaStar" title="Salvar como favorito">⭐ Favorito</button>
        <button type="button" class="btn save" id="qaSave" disabled>Lançar</button></div>`, m => {
      const input = m.querySelector('#qaText');
      let q = null;
      const drawFavs = () => {
        m.querySelector('#qaFavs').innerHTML = state.favorites.length ? state.favorites.map((f, i) => `<span class="fav" data-i="${i}" role="button" tabindex="0">${esc(f.label)} <b class="num">${brl.format(f.amount / 100)}</b><button type="button" class="x" data-rmfav="${i}" aria-label="Remover favorito">${ico('x')}</button></span>`).join('')
          : '<span class="qa-hint" style="margin:0">Escreva um gasto comum (ex.: café 6,50) e toque em ⭐ pra guardar aqui.</span>';
      };
      const preview = () => {
        q = input.value.trim() ? parseQuick(input.value) : null;
        const ok = q && q.amount > 0;
        m.querySelector('#qaSave').disabled = !ok; m.querySelector('#qaStar').disabled = !ok;
        const accN = id => esc(state.accounts.find(a => a.id === id)?.name || '');
        m.querySelector('#qaPrev').innerHTML = !q ? '<span class="qa-hint" style="margin:0">O que eu entender aparece aqui.</span>' : q.kind === 'transfer' ? `
          <div class="l"><span>Transferência</span><b class="big num">${ok ? brl.format(q.amount / 100) : 'falta o valor'}</b></div>
          <div class="l"><span>De → para</span><b>${accN(q.from)} → ${accN(q.to)}</b></div>
          <div class="l"><span>Data</span><b>${q.date === todayIso ? 'Hoje' : new Date(q.date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}</b></div>` : `
          <div class="l"><span>${q.kind === 'receita' ? 'Entrada' : 'Gasto'}</span><b class="big num" style="color:${q.kind === 'receita' ? 'var(--green)' : 'var(--ink)'}">${ok ? brl.format(q.amount / 100) : 'falta o valor'}</b></div>
          ${q.parcelas && q.kind !== 'receita' ? `<div class="l"><span>Parcelado</span><b>${q.parcelas}x de ${brl.format(Math.floor(q.amount / q.parcelas) / 100)}</b></div>` : ''}
          <div class="l"><span>Descrição</span><b>${esc(q.desc || '—')}</b></div>
          <div class="l"><span>Categoria</span><b>${esc(cat(q.category)?.name || 'Sem categoria')}</b></div>
          <div class="l"><span>${q.kind === 'receita' ? 'Recebido em' : 'Pago com'}</span><b>${payLabel(q)}</b></div>
          <div class="l"><span>Data</span><b>${q.date === todayIso ? 'Hoje' : new Date(q.date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', ...(q.date.slice(0, 4) !== todayIso.slice(0, 4) ? { year: 'numeric' } : {}) })}</b></div>`;
      };
      input.addEventListener('input', preview);
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && q && q.amount > 0) { e.preventDefault(); saveQuick(q); } });
      m.querySelector('#qaSave').onclick = () => q && q.amount > 0 && saveQuick(q);
      m.querySelector('#qaStar').onclick = () => {
        if (!q || !q.amount) return;
        state.favorites.push({ label: q.desc || 'Favorito', text: input.value.trim(), amount: q.amount });
        save(); drawFavs(); toast('Guardado nos favoritos ⭐');
      };
      m.querySelector('#qaFavs').addEventListener('click', e => {
        const rm = e.target.closest('[data-rmfav]');
        if (rm) { e.stopPropagation(); state.favorites.splice(+rm.dataset.rmfav, 1); save(); drawFavs(); return; }
        const f = e.target.closest('.fav'); if (!f) return;
        const fav = state.favorites[+f.dataset.i];
        saveQuick({ ...parseQuick(fav.text), date: todayIso });
      });
      // leva o que já foi digitado para o formulário completo
      m.querySelector('#qaFull').onclick = () => {
        const p = input.value.trim() ? parseQuick(input.value) : null;
        if (!p) return (ui.tab === 'receita' ? openReceita : openVariavel)();
        if (p.kind === 'transfer') return openTransfer();
        (p.kind === 'receita' ? openReceita : openVariavel)(null, { date: p.date, amount: p.amount, desc: p.desc, category: p.category, payCard: p.payCard, payAccount: p.payAccount, ...(p.parcelas ? { parcelas: p.parcelas } : {}) });
      };
      drawFavs(); preview();
    });
  }
  $('#fab').addEventListener('click', openQuick);

  // ================= Senha / digital para abrir o app =================
  // Tela de proteção: PIN guardado só como hash (PBKDF2 + sal) e, opcionalmente, a digital/Face ID do aparelho (WebAuthn).
  const LOCK_KEY = 'orcamento:lock';
  let lockCfg = null;
  try { lockCfg = JSON.parse(localStorage.getItem(LOCK_KEY) || 'null'); } catch (_) {}
  // configuração de senha danificada (sem hash/sal) trancaria o app sem nenhuma senha possível: ignora
  if (lockCfg && (typeof lockCfg.hash !== 'string' || typeof lockCfg.salt !== 'string')) { lockCfg = null; document.documentElement.classList.remove('locked'); }
  const saveLock = () => { try { lockCfg ? localStorage.setItem(LOCK_KEY, JSON.stringify(lockCfg)) : localStorage.removeItem(LOCK_KEY); } catch (_) {} };
  async function hashPin(pin, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(salt), iterations: 150000, hash: 'SHA-256' }, base, 256));
  }
  const bioAvailable = async () => !!(window.PublicKeyCredential && isSecureContext && location.protocol !== 'file:' && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false));
  async function bioRegister() {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Orçamento' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'orcamento', displayName: 'Orçamento' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } });
    return b64(cred.rawId);
  }
  async function bioCheck() {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: unb64(lockCfg.credId) }], userVerification: 'required', timeout: 60000 } });
    return true;
  }
  let pinBuf = '';
  function unlock() { document.documentElement.classList.remove('locked'); pinBuf = ''; }
  function drawLock(msg, err) {
    const n = lockCfg.len || 4;
    $('#pinDots').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('');
    if (msg !== undefined) { $('#lockMsg').textContent = msg; $('#lockMsg').classList.toggle('err', !!err); }
  }
  async function lockNow() {
    if (!lockCfg) return;
    document.documentElement.classList.add('locked');
    closeModal();
    pinBuf = '';
    const bio = lockCfg.credId && await bioAvailable();
    $('#keypad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button type="button" data-d="${d}">${d}</button>`).join('')
      + `<button type="button" class="ghost" id="kBio" ${bio ? '' : 'style="visibility:hidden"'} aria-label="Usar digital">${ico('finger')}</button><button type="button" data-d="0">0</button><button type="button" class="ghost" id="kDel" aria-label="Apagar">${ico('back')}</button>`;
    drawLock(bio ? 'Digite sua senha ou use a digital' : 'Digite sua senha');
    if (bio) setTimeout(tryBio, 300);
  }
  async function tryBio() { try { if (await bioCheck()) unlock(); } catch (_) { drawLock('Digite sua senha'); } }
  async function pressDigit(d) {
    const n = lockCfg.len || 4;
    if (pinBuf.length >= n) return;
    pinBuf += d; drawLock();
    if (pinBuf.length === n) {
      const ok = (await hashPin(pinBuf, lockCfg.salt)) === lockCfg.hash;
      if (ok) return unlock();
      pinBuf = ''; drawLock('Senha errada, tente de novo', true);
      $('#pinDots').classList.remove('shake'); void $('#pinDots').offsetWidth; $('#pinDots').classList.add('shake');
    }
  }
  $('#keypad').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.d) pressDigit(b.dataset.d);
    else if (b.id === 'kDel') { pinBuf = pinBuf.slice(0, -1); drawLock(); }
    else if (b.id === 'kBio') tryBio();
  });
  document.addEventListener('keydown', e => {
    if (!document.documentElement.classList.contains('locked')) return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); pressDigit(e.key); }
    if (e.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); drawLock(); }
  }, true);
  $('#lockForgot').addEventListener('click', () => {
    if (!confirm('Sem a senha, o único jeito é apagar os dados deste aparelho e recuperar pelo backup ou pela sincronização. Apagar os dados deste aparelho?')) return;
    if (!confirm('Tem certeza? Isso apaga tudo que está salvo neste navegador.')) return;
    try { localStorage.removeItem(KEY); localStorage.removeItem(SYNC_KEY); } catch (_) {}
    lockCfg = null; saveLock(); location.reload();
  });
  // Bloqueia de novo depois de 1 minuto em segundo plano
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') hiddenAt = Date.now();
    else if (lockCfg && hiddenAt && Date.now() - hiddenAt > 60000) lockNow();
  });

  async function openLockSettings() {
    const bioOk = await bioAvailable();
    if (lockCfg) {
      openModal(`<form id="f">${modalHead('Senha para abrir o app', 'Ligada neste aparelho.')}
        <label class="fl" for="lkCur">Senha atual</label><input class="input pin-input" id="lkCur" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
        ${bioOk ? checkField('lkBio', 'Usar digital / Face ID', 'Desbloqueia com a biometria do aparelho; a senha continua funcionando.', !!lockCfg.credId) : ''}
        <div class="err" id="fErr"></div>
        <div class="actions"><button type="button" class="btn del" id="lkOff">Desligar senha</button><span class="grow"></span>
          <button type="button" class="btn cancel" data-close>Fechar</button><button type="submit" class="btn save" id="fSave">Salvar</button></div></form>`, m => {
        const check = async () => (await hashPin(m.querySelector('#lkCur').value, lockCfg.salt)) === lockCfg.hash;
        m.querySelector('#lkOff').onclick = async () => {
          if (!await check()) return showErr('Senha atual errada.');
          lockCfg = null; saveLock(); closeModal(); toast('Senha desligada');
        };
        m.querySelector('#f').addEventListener('submit', async e => {
          e.preventDefault();
          if (!await check()) return showErr('Senha atual errada.');
          const want = m.querySelector('#lkBio')?.checked;
          try { if (want && !lockCfg.credId) lockCfg.credId = await bioRegister(); if (!want) delete lockCfg.credId; }
          catch (_) { return showErr('Não foi possível ativar a digital neste aparelho.'); }
          saveLock(); closeModal(); toast('Senha atualizada');
        });
      });
      return;
    }
    openModal(`<form id="f">${modalHead('Senha para abrir o app', 'Pede a senha ao abrir e depois de 1 minuto fora do app.')}
      <label class="fl" for="lkNew">Nova senha (4 a 6 números)</label><input class="input pin-input" id="lkNew" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
      <label class="fl" for="lkNew2">Repita a senha</label><input class="input pin-input" id="lkNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
      ${bioOk ? checkField('lkBio', 'Usar digital / Face ID também', 'Mais rápido: desbloqueia com a biometria do aparelho.', true) : `<p class="help">A digital/Face ID fica disponível quando você abre o app pelo endereço publicado (GitHub Pages) num aparelho com biometria.</p>`}
      <p class="help">⚠️ É uma proteção de tela: evita que alguém com seu celular desbloqueado veja seus números. Se esquecer a senha, dá pra apagar os dados deste aparelho e recuperar pelo backup ou pela sincronização.</p>
      <div class="err" id="fErr"></div>
      <div class="actions"><span class="grow"></span><button type="button" class="btn cancel" data-close>Cancelar</button><button type="submit" class="btn save" id="fSave">Ligar senha</button></div></form>`, m => {
      m.querySelectorAll('.pin-input').forEach(i => i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 6); }));
      m.querySelector('#f').addEventListener('submit', async e => {
        e.preventDefault();
        const a = m.querySelector('#lkNew').value, b2 = m.querySelector('#lkNew2').value;
        if (!/^\d{4,6}$/.test(a)) return showErr('Use de 4 a 6 números.');
        if (a !== b2) return showErr('As senhas não são iguais.');
        const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
        const cfg = { salt, hash: await hashPin(a, salt), len: a.length };
        if (m.querySelector('#lkBio')?.checked) { try { cfg.credId = await bioRegister(); } catch (_) { /* segue só com PIN */ } }
        lockCfg = cfg; saveLock(); closeModal();
        toast(cfg.credId ? 'Senha e digital ligadas 🔒' : 'Senha ligada 🔒');
      });
    });
  }

  // ================= Instalar como app (PWA) =================
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
  window.addEventListener('appinstalled', () => { installPrompt = null; toast('App instalado ✓'); });
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  async function installApp() {
    if (standalone()) return toast('O app já está instalado neste aparelho');
    if (installPrompt) {
      installPrompt.prompt();
      const { outcome } = await installPrompt.userChoice;
      installPrompt = null;
      if (outcome === 'accepted') closeModal();
      return;
    }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const local = location.protocol === 'file:';
    openModal(`${modalHead('Instalar como app', 'Fica com ícone na tela inicial, abre em tela cheia e funciona sem internet.')}
      ${local ? `<p class="help" style="font-size:.85rem;color:var(--amber)">Você abriu o arquivo direto do computador. Pra instalar, o app precisa estar publicado num endereço (ex.: GitHub Pages). Veja o passo a passo no README.</p>` : ''}
      <p class="fl">${ios ? 'No iPhone (Safari)' : 'No celular Android (Chrome)'}</p>
      <p class="help" style="font-size:.85rem">${ios ? 'Toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>.' : 'Toque nos <b>⋮</b> no canto de cima e depois em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.'}</p>
      <p class="fl">No computador (Chrome ou Edge)</p>
      <p class="help" style="font-size:.85rem">Clique no ícone de instalar na barra de endereço (um monitor com uma seta) ou no menu <b>⋮ → Instalar Orçamento</b>.</p>
      <div class="actions"><span class="grow"></span><button class="btn save" data-close>Entendi</button></div>`);
  }
  // O service worker só funciona quando o app está publicado (http/https), não abrindo o arquivo direto
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // O app pode ficar aberto por dias (PWA no celular): quando o dia vira, atualiza "hoje" e, se você estava
  // olhando o mês atual, passa para o novo mês
  function refreshDay() {
    const d = new Date(), iso = isoOf(d);
    if (iso === todayIso) return;
    const wasCurrent = view.month === monthOf(todayIso);
    today = d; todayIso = iso;
    if (wasCurrent) view.month = monthOf(iso);
    render();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshDay(); });
  // App aberto em duas abas do navegador: quando a outra aba salva, esta passa a usar os dados dela
  // (senão, ao salvar aqui, esta aba escreveria por cima do que foi lançado na outra)
  window.addEventListener('storage', e => {
    if (e.key !== KEY || !e.newValue) return;
    try { state = normalize(JSON.parse(e.newValue)); } catch (_) { return; }
    fillFilter(); render();
  });
  setInterval(refreshDay, 60000);

  if (lockCfg) lockNow();
  fillFilter();
  render();
  // Atalhos do ícone do app instalado (segurar o ícone): ?acao=rapido abre o lançamento rápido, ?aba=… abre uma aba
  { const qs = new URLSearchParams(location.search);
    if (qs.has('acao') || qs.has('aba')) {
      const aba = qs.get('aba');
      if (aba && ['geral', 'receita', 'fixa', 'variavel', 'assin', 'cartoes', 'invest', 'metas'].includes(aba)) { ui.tab = aba; saveUi(); fillFilter(); render(); }
      if (qs.get('acao') === 'rapido') openQuick();
      try { history.replaceState(null, '', location.pathname); } catch (_) {}
    } }
  if (loadWarning) toast('Os dados salvos estavam ilegíveis. Guardei uma cópia deles; restaure um backup se precisar.', 'OK', () => {});
  if (state.cdi.checked !== todayIso) fetchCdi();
  if (sync) pullNow();
})();
  </script>
</body>
